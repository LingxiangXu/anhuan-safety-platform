services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: safety_platform
      MYSQL_USER: safety
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-safety_local}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_local}
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-safety}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-safety_local_123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

volumes:
  mysql-data:
  minio-data:
