server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: safety-platform
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/safety_platform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:safety}
    password: ${DB_PASSWORD:safety_local}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    user:
      name: ${BOOTSTRAP_ADMIN:admin}
      password: ${BOOTSTRAP_PASSWORD:change-me}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
