<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>隐患治理与督办 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <div class="content">
      <div class="page-header"></div>
      <div class="page-body" id="pageBody"></div>
    </div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/oa-bridge.js"></script>
<script src="assets/ui.js"></script>
<script src="assets/hazard-acceptance.js"></script>
<script>
(function(){
"use strict";
var params=new URLSearchParams(location.search);
var tab=params.get('tab')||'overview';
var body=document.getElementById('pageBody');
UI.renderShell('hazards',tab);
var TITLES={overview:'隐患总览',ledger:'隐患台账','mine-rect':'待我整改','mine-review':'待我复核',professional:'专业检查台账',supervision:'隐患督办',stats:'统计分析'};
UI.pageHeader(['隐患治理与督办',TITLES[tab]],TITLES[tab]);

var STATUS_TAG={'待受理':'<span class="tag tag-warn">待受理</span>','待整改':'<span class="tag tag-blue">待整改</span>',
  '整改中':'<span class="tag tag-warn">整改中</span>','待复核':'<span class="tag tag-purple">待复核</span>','已闭环':'<span class="tag tag-green">已闭环</span>','不受理关闭':'<span class="tag tag-gray">不受理关闭</span>','审批中':'<span class="tag tag-warn">审批中</span>','驳回起草人':'<span class="tag tag-error">驳回起草人</span>','已拒绝':'<span class="tag tag-error">已拒绝</span>','已撤销':'<span class="tag tag-gray">已撤销</span>','已终止':'<span class="tag tag-gray">已终止</span>'};
function tagOfStatus(s){return STATUS_TAG[s]||('<span class="tag tag-gray">'+s+'</span>');}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function sevTag(s){return s==='重大'?'<span class="tag tag-error">重大隐患</span>':s==='一般'?'<span class="tag tag-common">一般隐患</span>':'<span class="tag tag-warn">未定级</span>';}
function sourceLabel(h){return h.sourceLabel||App.sourceLabel(h.source);}
function hazardStatusCell(h){if(h.source==='HSE_SUPERVISION'&&h.oaStatus==='审批中'&&h.oaStatusUrl)return '<button class="btn btn-text" title="在新窗口打开 OA 审批状态" onclick="openOaApprovalForHazard(\''+h.id+'\')">审批中</button>';return tagOfStatus(h.status);}
function openOaApprovalForHazard(id){var h=App.hazard.byId(id);if(!h||!h.oaStatusUrl){App.toast('OA 尚未返回审批状态链接','warn');return;}window.open(h.oaStatusUrl,'oa_supervision_'+id);}
function canAccept(h){return App.hazard&&App.hazard.canAccept?App.hazard.canAccept(h):false;}
function acceptRoleName(h){var key=App.hazard.acceptanceOwner(h).role,map={section_manager:'工段/作业区负责人',company_safety:'二级单位安全管理人员',group_safety:'集团监督检查',unit_leader:'二级单位领导'};return map[key]||'无需受理';}
function visibleHazards(){
  var scoped=App.hazards.filter(function(h){return !App.inCurrentOrgScope||App.inCurrentOrgScope(h.org);});
  if(App.currentRole!=='professional_inspector')return scoped;
  return scoped.filter(function(h){return h.source==='PROFESSIONAL_DEPT_CHECK'&&(!h.professionalDeptId||h.professionalDeptId==='equipment_energy');});
}
function hazardUsers(){return (App.directoryMembers||[]).filter(function(p){return p.status==='在职';}).map(function(p){return {id:p.id,weComId:p.weComId,name:p.name,dept:p.org,post:p.post};});}
function personSelect(id,value){return '<select id="'+id+'">'+hazardUsers().map(function(u){return '<option value="'+u.id+'" '+(u.id===value?'selected':'')+'>'+esc(u.name)+' · '+esc(u.dept)+' · '+esc(u.post)+'</option>';}).join('')+'</select>';}
function overdue(h){var final=['已闭环','不受理关闭','已拒绝','已撤销','已终止','已作废'],due=h.deadline&&Date.parse(String(h.deadline).replace(/-/g,'/'));return !!(due&&due<Date.now()&&final.indexOf(h.status)<0&&h.status!=='待受理');}

/* ================= 隐患总览 ================= */
function viewOverview(){
  var hs=visibleHazards();
  var pending=hs.filter(function(h){return h.status==='待受理';}).length;
  var recting=hs.filter(function(h){return App.hazard.canRectify(h);}).length;
  var review=hs.filter(function(h){return h.status==='待复核';}).length;
  var closed=hs.filter(function(h){return h.status==='已闭环'||h.status==='不受理关闭';}).length;
  var overdueCount=hs.filter(overdue).length;
  body.innerHTML=
  '<div class="kpi-grid g5">'+
    '<div class="kpi clickable" onclick="location.href=\'hazards.html?tab=ledger&st=待受理\'"><div class="k-label">待受理</div><div class="k-num warn">'+pending+'</div><div class="k-sub">含巡检转来</div></div>'+
    '<div class="kpi clickable" onclick="location.href=\'hazards.html?tab=mine-rect\'"><div class="k-label">待整改/整改中</div><div class="k-num blue">'+recting+'</div><div class="k-sub">责任部门执行中</div></div>'+
    '<div class="kpi clickable" onclick="location.href=\'hazards.html?tab=mine-review\'"><div class="k-label">待复核</div><div class="k-num purple">'+review+'</div><div class="k-sub">待最终定级分配人复核</div></div>'+
    '<div class="kpi"><div class="k-label">已闭环</div><div class="k-num green">'+closed+'</div><div class="k-sub">复核通过</div></div>'+
    '<div class="kpi clickable" onclick="location.href=\'hazards.html?tab=ledger&overdue=1\'"><div class="k-label">逾期隐患</div><div class="k-num danger">'+overdueCount+'</div><div class="k-sub">按整改期限判断</div></div>'+ 
  '</div>'+
  '<div class="grid-2-1" style="margin-top:16px">'+
    '<div class="card"><div class="card-title">隐患台账一览</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>编号</th><th>标题</th><th>等级</th><th>状态</th><th>责任人</th><th>期限</th><th>操作</th></tr></thead><tbody>'+
    hs.map(function(h){return '<tr><td class="mono">'+h.code+'</td><td>'+h.title+'</td><td>'+sevTag(h.severity)+'</td><td>'+hazardStatusCell(h)+'</td><td>'+(h.responsibleUser||'-')+'</td><td>'+(h.deadline||'-')+'</td>'+
      '<td><button class="btn btn-text" onclick="openHazard(\''+h.id+'\')">详情</button></td></tr>';}).join('')+
    '</tbody></table></div></div>'+
    '<div class="card"><div class="card-title">业务闭环</div>'+
    '<div style="display:flex;flex-direction:column;gap:10px">'+
      '<button class="btn btn-primary" onclick="openRegister()">+ 登记隐患</button>'+
       '<button class="btn btn-outline" onclick="location.href=\'hazards.html?tab=supervision\'">隐患督办（'+App.supervisions.filter(function(s){return s.status!=='已关闭';}).length+' 活跃）</button>'+
      '<button class="btn btn-outline" onclick="location.href=\'hazards.html?tab=stats\'">统计分析</button>'+
    '</div>'+
    '<div class="hint-line" style="margin-top:14px">巡检、随手拍进入受理、整改、复查闭环；集团监督检查走 OA；集团专业检查记录考核责任人和罚款后提交即形成已闭环台账，不进入整改流程。</div></div>'+ 
  '</div>';
}

/* ================= 隐患台账 ================= */
function viewLedger(){
  var stParam=params.get('st'),openOnly=params.get('open')==='1',overdueOnly=params.get('overdue')==='1';
  body.innerHTML=
  '<div class="filter-bar">'+
    '<div class="f-item">状态 <select id="fStatus"><option value="">全部</option><option>审批中</option><option>驳回起草人</option><option>待受理</option><option>待上级受理</option><option>待整改</option><option>整改中</option><option>待复核</option><option>已闭环</option><option>不受理关闭</option><option>已拒绝</option><option>已撤销</option><option>已终止</option></select></div>'+
    '<div class="f-item">来源 <select id="fSource"><option value="">全部</option><option value="INSPECTION">巡检发现</option><option value="MOBILE_REPORT">移动随手拍</option><option value="PROFESSIONAL_DEPT_CHECK">集团专业检查</option><option value="HSE_SUPERVISION">集团监督检查</option></select></div>'+ 
    '<button class="btn btn-outline btn-sm" onclick="renderLedger()">查询</button>'+
    '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openRegister()">+ 登记隐患</button>'+
  '</div>'+
  '<div class="tbl-wrap"><table class="tbl" style="min-width:1500px"><thead><tr><th>隐患编号</th><th>隐患标题</th><th>位置</th><th>来源</th><th>等级</th><th>关联风险</th><th>状态</th><th>整改人</th><th>整改期限</th><th>当前办理人</th><th>最终分配人/复核人</th><th>操作</th></tr></thead><tbody id="ledgerBody">'+
  '</tbody></table></div>';
  if(stParam){setTimeout(function(){document.getElementById('fStatus').value=stParam;renderLedger();},0);}
  else renderLedger();
}
function renderLedger(){
  var st=document.getElementById('fStatus')?document.getElementById('fStatus').value:'';
  var src=document.getElementById('fSource')?document.getElementById('fSource').value:'';
  var openOnly=params.get('open')==='1',overdueOnly=params.get('overdue')==='1',openStatuses=['待受理','待上级受理','待整改','整改中','待复核'];
  var rows=visibleHazards().filter(function(h){return (!st||h.status===st)&&(!src||h.source===src)&&(!openOnly||openStatuses.indexOf(h.status)>-1)&&(!overdueOnly||overdue(h));});
  document.getElementById('ledgerBody').innerHTML=rows.map(function(h){
    return '<tr><td class="mono">'+h.code+'</td><td>'+h.title+'</td><td>'+esc(h.location||'-')+'</td><td><span class="tag tag-gray">'+sourceLabel(h)+'</span></td>'+
    '<td>'+sevTag(h.severity)+'</td><td>'+(h.riskCode||'-')+'</td><td>'+hazardStatusCell(h)+'</td>'+
    '<td>'+esc(h.responsibleUser||'-')+'</td><td>'+esc(h.deadline||'-')+'</td><td>'+esc(['待受理','待上级受理'].indexOf(h.status)>-1?App.hazard.acceptanceOwner(h).user:h.status==='待复核'?h.finalAssigner:['待整改','整改中'].indexOf(h.status)>-1?h.responsibleUser:'-')+'</td><td>'+esc(h.finalAssigner||'-')+'</td>'+
    '<td><button class="btn btn-text" onclick="openHazard(\''+h.id+'\')">详情</button>'+hazardAcceptanceButtons(h)+
    (h.status==='待受理'&&canAccept(h)?'<button class="btn btn-text" onclick="openAccept(\''+h.id+'\')">受理</button>':'')+
    (App.hazard.canReview(h)?'<button class="btn btn-text" onclick="openReview(\''+h.id+'\')">复核</button>':'')+
    (App.hazard.canRectify(h)?'<button class="btn btn-text" onclick="openRectify(\''+h.id+'\')">整改反馈</button>':'')+
    (overdue(h)?'<button class="btn btn-text danger" onclick="suggestSup(\''+h.id+'\')">逾期督办建议</button>':'')+'</td></tr>';
  }).join('')||UI.empty('暂无隐患');
}

/* ================= 待我整改 ================= */
function viewMineRect(){
  var rows=visibleHazards().filter(function(h){return h.status==='待整改'||h.status==='整改中';});
  body.innerHTML=
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>隐患编号</th><th>标题</th><th>等级</th><th>整改期限</th><th>状态</th><th>操作</th></tr></thead><tbody>'+ 
  rows.map(function(h){return '<tr><td class="mono">'+h.code+'</td><td>'+h.title+'</td><td>'+sevTag(h.severity)+'</td><td>'+h.deadline+'</td><td>'+tagOfStatus(h.status)+'</td>'+
    '<td><button class="btn btn-primary btn-sm" onclick="openRectify(\''+h.id+'\')">提交整改反馈</button></td></tr>';}).join('')||
  UI.empty('暂无待整改任务')+'</tbody></table></div>';
}

/* ================= 待我复核 ================= */
function viewMineReview(){
  var rows=visibleHazards().filter(function(h){return App.hazard.canReview(h);});
  body.innerHTML=
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>隐患编号</th><th>标题</th><th>整改情况说明</th><th>提交时间</th><th>操作</th></tr></thead><tbody>'+
  rows.map(function(h){return '<tr><td class="mono">'+h.code+'</td><td>'+h.title+'</td>'+
    '<td>'+(h.rectification?h.rectification.completed:'-')+'</td><td>'+(h.rectification?h.rectification.submittedAt:'-')+'</td>'+
    '<td><button class="btn btn-primary btn-sm" onclick="openReview(\''+h.id+'\')">复核整改 ▸</button></td></tr>';}).join('')||
  UI.empty('暂无待复核隐患')+'</tbody></table></div>';
}

/* ================= 隐患详情与操作 ================= */
function hazardTimeline(h){
  return hazardAcceptanceSummary(h)+hazardAcceptanceButtons(h)+'<div class="section-head"><h3>操作时间线</h3></div><ul class="timeline">'+
  h.actions.map(function(a){return '<li><div class="t-date">'+a.at+'</div><div class="t-title">'+esc(a.type)+'</div>'+
    '<div class="t-note">'+esc(a.note||'')+'</div><div class="t-actor">操作人：'+esc(a.by)+'</div></li>';}).join('')+'</ul>';
}
function openHazard(id){
  var h=App.hazard.byId(id);
  if(!h||visibleHazards().indexOf(h)<0){App.toast('当前角色或组织范围无权查看该记录','error');return;}
  UI.drawer(
    '<div class="desc desc-2">'+
      '<div class="d-item"><span class="d-label">隐患编号</span><span class="d-value">'+h.code+'</span></div>'+
      '<div class="d-item"><span class="d-label">标题</span><span class="d-value">'+h.title+'</span></div>'+
      '<div class="d-item"><span class="d-label">来源</span><span class="d-value">'+sourceLabel(h)+(h.sourceRef?'（'+h.sourceRef+'）':'')+'</span></div>'+
      '<div class="d-item"><span class="d-label">等级</span><span class="d-value">'+sevTag(h.severity)+'</span></div>'+
      '<div class="d-item"><span class="d-label">关联风险</span><span class="d-value">'+(h.riskCode||'-')+'</span></div>'+
      '<div class="d-item"><span class="d-label">位置</span><span class="d-value">'+h.location+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">填报人</span><span class="d-value">'+(h.reporter||'-')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">责任部门</span><span class="d-value">'+(h.responsibleDept||'-')+'</span></div>'+
      '<div class="d-item"><span class="d-label">责任人</span><span class="d-value">'+(h.responsibleUser||'-')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">整改期限</span><span class="d-value">'+(h.deadline||'-')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">受理人</span><span class="d-value">'+(h.acceptedBy||'-')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">受理时间</span><span class="d-value">'+(h.acceptedAt||'-')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">应受理岗位</span><span class="d-value">'+acceptRoleName(h)+'</span></div>'+ 
      (h.source==='PROFESSIONAL_DEPT_CHECK'?'<div class="d-item"><span class="d-label">检查部门</span><span class="d-value">'+(h.inspectionDept||'-')+'</span></div><div class="d-item"><span class="d-label">考核责任人/金额</span><span class="d-value">'+(h.assessmentResponsible||'-')+' / '+(h.penaltyAmount==null?'0':h.penaltyAmount)+' 元</span></div><div class="d-item"><span class="d-label">台账方式</span><span class="d-value">直接登记已闭环</span></div>':'')+
      (h.source==='HSE_SUPERVISION'?'<div class="d-item"><span class="d-label">检查部门</span><span class="d-value">'+(h.inspectionDept||'-')+'</span></div><div class="d-item"><span class="d-label">考核责任人/金额</span><span class="d-value">'+(h.assessmentResponsible||'待 OA 最终回传')+' / '+(h.penaltyAmount==null?'待回传':h.penaltyAmount+' 元')+'</span></div><div class="d-item"><span class="d-label">流转方式</span><span class="d-value">平台发起 OA；不展示 OA 流程</span></div>':'')+
      (h.source==='HSE_SUPERVISION'?'<div class="d-item"><span class="d-label">OA 实例</span><span class="d-value">'+(h.oaInstanceId||'-')+'</span></div><div class="d-item"><span class="d-label">OA 状态</span><span class="d-value">'+(h.oaStatus==='审批中'?'<button class="btn btn-text" onclick="openOaApprovalForHazard(\''+h.id+'\')">审批中</button>':tagOfStatus(h.oaStatus))+'</span></div>':'')+
      (h.source==='MOBILE_REPORT'?'<div class="d-item"><span class="d-label">奖励资格</span><span class="d-value">'+(h.rewardEligible?(h.rewardStatus||'待评定'):'不参与奖励')+'</span></div>':'')+
      '<div class="d-item full"><span class="d-label">受理意见</span><span class="d-value">'+(h.acceptanceOpinion||'-')+'</span></div>'+ 
      '<div class="d-item full"><span class="d-label">整改要求</span><span class="d-value">'+(h.rectificationRequirement||'-')+'</span></div>'+ 
      (h.status==='不受理关闭'?'<div class="d-item full"><span class="d-label">不受理原因</span><span class="d-value">'+esc(h.rejectionReason||'-')+'</span></div>':'')+
      '<div class="d-item"><span class="d-label">发现照片</span><span class="d-value">'+(h.sourceEvidence&&h.sourceEvidence.photo?'<span class="tag tag-green">已带入来源照片</span>':'<span class="tag tag-gray">未留存</span>')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">状态</span><span class="d-value">'+hazardStatusCell(h)+'</span></div>'+
      '<div class="d-item full"><span class="d-label">描述</span><span class="d-value">'+h.description+'</span></div>'+
    '</div>'+
    (h.rectification?'<div class="section-head"><h3>整改反馈</h3></div><div class="desc desc-2">'+
      '<div class="d-item full"><span class="d-label">整改情况说明</span><span class="d-value">'+(h.rectification.summary||h.rectification.completed||h.rectification.plan||'-')+'</span></div>'+
      '<div class="d-item"><span class="d-label">整改前照片</span><span class="d-value">'+(h.rectification.evidenceBefore?'<span class="tag tag-green">已带入发现照片</span>':'<span class="tag tag-gray">未留存</span>')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">整改后照片</span><span class="d-value">'+(h.rectification.evidenceAfter?'<span class="tag tag-green">已上传</span>':'<span class="tag tag-warn">未上传</span>')+'</span></div>'+ 
      '<div class="d-item"><span class="d-label">复查状态</span><span class="d-value">'+(h.rectification.reviewStatus||'-')+'</span></div></div>':'')+
    hazardTimeline(h),
    {title:'隐患详情 · '+h.code,wide:true,
     footer:'<button class="btn btn-outline" data-close>关闭</button>'+
      (h.status==='待受理'&&canAccept(h)?'<button class="btn btn-primary" onclick="closeDrawerOpenAccept(\''+h.id+'\')">定级分配</button>':'')+
     (App.hazard.canRectify(h)?'<button class="btn btn-primary" onclick="closeDrawerOpenRectify(\''+h.id+'\')">提交整改反馈</button>':'')+
     (App.hazard.canReview(h)?'<button class="btn btn-primary" onclick="closeDrawerOpenReview(\''+h.id+'\')">复核整改</button>':'')+
     (h.source==='HSE_SUPERVISION'&&h.status==='驳回起草人'?'<button class="btn btn-primary" onclick="editSupervisionDraft(\''+h.id+'\')">继续编辑并按原 OA 重提</button>':'')}
  );
}
function closeDrawerOpenAccept(id){document.querySelectorAll('.mask,.drawer').forEach(function(n){n.remove();});openAccept(id);}
function closeDrawerOpenRectify(id){document.querySelectorAll('.mask,.drawer').forEach(function(n){n.remove();});openRectify(id);}
function closeDrawerOpenReview(id){document.querySelectorAll('.mask,.drawer').forEach(function(n){n.remove();});openReview(id);}

function openAccept(id){
  var h=App.hazard.byId(id);if(!h)return;
  if(!canAccept(h)){App.toast('当前角色无受理权限，本隐患应由'+acceptRoleName(h)+'处理','error');return;}
  var phrases=(App.hazardPhrases||[]).map(function(text,index){return '<button type="button" class="btn btn-outline btn-sm" onclick="applyAcceptancePhrase('+index+')">'+esc(text)+'</button>';}).join('');
  UI.modal(hazardAcceptanceSummary(h)+'<div class="alert info">受理人负责确认等级、整改责任人和期限；也可选择“不受理”并填写关闭原因。</div><div class="form-grid">'+
    '<div class="form-item"><span class="form-label">受理人</span><input id="aAcceptor" value="'+App.currentUser()+'" disabled></div>'+

function doReview(id,pass){

  var note=document.getElementById('rvNote')?document.getElementById('rvNote').value.trim():'';

  var result=App.hazard.review(id,pass===1,note);if(result&&result.ok===false){App.toast(result.msg,'error');return;}
  App.toast(pass===1?'隐患已闭环关闭':'已退回整改');

  route();

  '</div>',{title:'新增专业检查已闭环台账',size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="proOk">提交并闭环</button>'});
  document.getElementById('proOk').onclick=function(){
    var title=document.getElementById('proTitle').value.trim(),desc=document.getElementById('proDesc').value.trim(),locationValue=document.getElementById('proLocation').value.trim(),summary=document.getElementById('proSummary').value.trim(),after=!!document.getElementById('proAfterPhoto').dataset.done;
    var rectifier=App.directoryMemberById(document.getElementById('proRectUser').value),acceptor=App.directoryMemberById(document.getElementById('proAcceptor').value),penalty=App.directoryMemberById(document.getElementById('proPenaltyUser').value);
    if(!title||!desc||!locationValue||!summary||!rectifier||!acceptor||!penalty){App.toast('请完整填写标题、描述、位置、整改闭环信息和人员字段','error');return;}if(!after){App.toast('已闭环台账必须上传整改后照片','error');return;}
    var created=now(),closedAt=document.getElementById('proClosedAt').value.trim(),riskCode=document.getElementById('proRisk').value||null;
    App.hazards.unshift({id:uid(),code:'PRO-'+dstr()+'-'+seq('hz'),title:title,org:(App.currentOrg||'造型作业区').split(' / ').pop(),location:locationValue,source:'PROFESSIONAL_DEPT_CHECK',sourceLabel:'集团专业检查',sourceRef:document.getElementById('proRef').value.trim()||null,severity:document.getElementById('proSeverity').value,riskCode:riskCode,professionalDeptId:'equipment_energy',inspectionDept:'设备能源部',inspectionAt:document.getElementById('proCheckAt').value.trim(),assessmentResponsible:penalty.name,assessmentResponsiblePersonId:penalty.id,penaltyAmount:+document.getElementById('proPenalty').value||0,penaltyNote:document.getElementById('proPenaltyNote').value.trim()||'无',responsibleDept:document.getElementById('proRectDept').value.trim(),responsibleUser:rectifier.name,responsiblePersonId:rectifier.id,deadline:document.getElementById('proDeadline').value,status:'已闭环',reporter:App.currentUser(),createdAt:created,acceptedBy:acceptor.name,acceptedAt:document.getElementById('proAcceptedAt').value.trim(),closedAt:closedAt,description:desc,sourceEvidence:{photo:!!document.getElementById('proBeforePhoto').dataset.done,note:desc,label:'专业检查发现照片'},rectification:{summary:summary,completed:summary,evidenceBefore:!!document.getElementById('proBeforePhoto').dataset.done,evidenceAfter:true,submittedAt:closedAt,reviewStatus:'提交即闭环'},actions:[{type:'专业检查登记',at:created,by:App.currentUser(),note:'已完整登记整改与考核信息，提交即闭环'}]});
    App.persist();document.querySelectorAll('.modal').forEach(function(n){n.remove();});App.toast('专业检查已提交并形成已闭环台账','success');tab='professional';viewProfessional();
  };
}

/* ================= 统计分析 ================= */
function viewStats(){
  var hs=visibleHazards();
  var pending=hs.filter(function(h){return h.status==='待受理';}).length;
  var recting=hs.filter(function(h){return h.status==='待整改'||h.status==='整改中';}).length;
  var review=hs.filter(function(h){return h.status==='待复核';}).length;
  var closed=hs.filter(function(h){return h.status==='已闭环'||h.status==='不受理关闭';}).length;
  var overdueCount=hs.filter(overdue).length;
  body.innerHTML=
  '<div class="kpi-grid g5">'+
    '<div class="kpi"><div class="k-label">待处理</div><div class="k-num warn">'+pending+'</div></div>'+
    '<div class="kpi"><div class="k-label">整改中</div><div class="k-num blue">'+recting+'</div></div>'+
    '<div class="kpi"><div class="k-label">待复核</div><div class="k-num purple">'+review+'</div></div>'+
    '<div class="kpi"><div class="k-label">已关闭</div><div class="k-num green">'+closed+'</div></div>'+
    '<div class="kpi"><div class="k-label">已逾期</div><div class="k-num danger">'+overdueCount+'</div></div>'+ 
  '</div>'+ 
  '<div class="card" style="margin-top:16px"><div class="card-title">隐患状态分布</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>状态</th><th>数量</th><th>入口</th></tr></thead><tbody>'+ 
    '<tr><td>待受理</td><td>'+pending+'</td><td><button class="btn btn-text" onclick="location.href=\'hazards.html?tab=ledger&st=待受理\'">查看</button></td></tr>'+ 
    '<tr><td>待整改/整改中</td><td>'+recting+'</td><td><button class="btn btn-text" onclick="location.href=\'hazards.html?tab=mine-rect\'">查看</button></td></tr>'+ 
    '<tr><td>待复核</td><td>'+review+'</td><td><button class="btn btn-text" onclick="location.href=\'hazards.html?tab=mine-review\'">查看</button></td></tr>'+
    '<tr><td>已关闭</td><td>'+closed+'</td><td><button class="btn btn-text" onclick="location.href=\'hazards.html?tab=ledger&st=已闭环\'">查看</button></td></tr>'+ 
  '</tbody></table></div></div>';
}

/* ================= 登记隐患 ================= */
function openRegister(){
  UI.modal('<div class="form-grid">'+
    '<div class="form-item full"><span class="form-label">隐患标题 <span class="req">*</span></span><input id="hTitle" placeholder="如：配电箱箱门破损"></div>'+
    '<div class="form-item"><span class="form-label">位置 <span class="req">*</span></span><input id="hLocation" value="'+((App.currentOrg||'造型作业区').split(' / ').pop()+'现场')+'" placeholder="可修改现场位置"></div>'+ 
    '<div class="form-item"><span class="form-label">来源 <span class="req">*</span></span><select id="hSource" onchange="syncRegisterSource()"><option value="MOBILE_REPORT">移动随手拍</option><option value="HSE_SUPERVISION">集团监督检查</option></select></div>'+ 
    '<div class="form-item"><span class="form-label">填报人</span><input value="'+App.currentUser()+'" disabled></div>'+ 
    '<div class="form-item"><span class="form-label">建议等级</span><select id="hSeverity"><option value="">未定级（受理时确认）</option><option>一般</option><option>重大</option></select></div>'+ 
    '<div id="sourceExtra" class="form-item full"></div>'+ 
    '<div class="form-item full"><span class="form-label">事实描述</span><textarea id="hDesc" placeholder="描述隐患事实或不安全状态"></textarea></div>'+ 
    '<div class="form-item"><span class="form-label">现场照片</span><div id="hDiscoveryPhoto" class="photo-box" style="height:56px" onclick="mockPhoto(this)"><span>+ 留存现场照片</span></div></div>'+ 
  '</div>',{title:'登记隐患',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="hOk">登记</button>'});
  var sourceSelect=document.getElementById('hSource');
  if(App.currentRole==='professional_inspector'){document.querySelectorAll('.modal').forEach(function(n){n.remove();});openProfessionalRegister();return;}
  if(App.currentRole==='group_safety')sourceSelect.value='HSE_SUPERVISION';
  syncRegisterSource();
  document.getElementById('hOk').onclick=function(){
    var t=document.getElementById('hTitle').value.trim();
    if(!t){App.toast('请填写隐患标题','error');return;}
    var location=document.getElementById('hLocation').value.trim();
    if(!location){App.toast('请填写隐患位置','error');return;}
    var source=document.getElementById('hSource').value;
    var photo=!!document.getElementById('hDiscoveryPhoto').dataset.done;
    var supervision=source==='HSE_SUPERVISION',created=now(),hid=uid(),hcode='HZ-'+dstr()+'-'+seq('hz'),instance=supervision?('OA-HSE-'+dstr()+'-'+String(App._seq.hz).padStart(2,'0')):null;
    App.hazards.unshift({id:hid,code:hcode,title:t,org:(App.currentOrg||'造型作业区').split(' / ').pop(),location:location,
      source:source,sourceLabel:App.sourceLabel(source),sourceRef:null,severity:document.getElementById('hSeverity').value||null,riskCode:null,
      professionalDeptId:null,inspectionDept:supervision?'集团监督检查':null,assessmentResponsible:null,assessmentResponsiblePersonId:null,penaltyAmount:null,oaRequired:supervision,oaStatus:supervision?'审批中':'不走OA',oaInstanceId:instance,oaStatusUrl:supervision?OABridge.detailUrl(instance):null,rewardEligible:source==='MOBILE_REPORT',rewardStatus:source==='MOBILE_REPORT'?'待闭环后评定':'不参与奖励',
      responsibleDept:null,responsibleUser:null,deadline:null,status:supervision?'审批中':'待受理',reporter:App.currentUser(),
      createdAt:created,closedAt:null,description:document.getElementById('hDesc').value||'-',sourceEvidence:{photo:photo,note:document.getElementById('hDesc').value||'',label:App.sourceLabel(source)+'现场证据'},rectification:null,
      actions:[{type:'登记',at:created,by:App.currentUser(),note:supervision?'集团监督检查已发起 OA；平台只保存实例号和状态链接':App.sourceLabel(source)}]});
    if(supervision)syncSupervisionToOa(App.hazards[0]);
    App.toast(supervision?'集团监督检查已发起 OA；点击“审批中”查看状态':'隐患已登记，待受理');
    document.querySelectorAll('.modal').forEach(function(n){n.remove();});
    route();
  };
}
function syncRegisterSource(){var source=(document.getElementById('hSource')||{}).value,box=document.getElementById('sourceExtra');if(!box)return;if(source==='MOBILE_REPORT'){box.innerHTML='<div class="alert info">随手拍隐患由二级单位安全管理人员受理；闭环后可进入奖励评定。</div>';return;}if(source==='HSE_SUPERVISION'){box.innerHTML='<div class="alert info">安全管理平台发起 OA 并保存实例号和审批状态链接，不展示 OA 流程。考核责任人和考核金额在 OA 最终结果回传后写入台账。</div>';return;}box.innerHTML='';}
function syncSupervisionToOa(h){if(!h||h.source!=='HSE_SUPERVISION')return;h.oaStatusUrl=OABridge.detailUrl(h.oaInstanceId);OABridge.submit({instanceId:h.oaInstanceId,businessType:'supervision',businessId:h.id,businessCode:h.code,title:h.title,applicant:h.reporter||App.currentUser(),applicantOrg:'太重集团',targetOrg:'铸锻件分公司 / '+h.org,priority:h.severity,currentNode:'二级单位领导审批',safetyUrl:'../hazards.html?tab=ledger',summary:{location:h.location,description:h.description,source:'集团监督检查'},materials:['现场检查记录','现场证据照片']});}
function editSupervisionDraft(id){var h=App.hazard.byId(id);if(!h||h.source!=='HSE_SUPERVISION'||h.status!=='驳回起草人')return;document.querySelectorAll('.mask,.drawer').forEach(function(n){n.remove();});UI.modal('<div class="alert warn">OA 已驳回起草人。请在安全管理平台修改业务数据，重新提交时沿用原 OA 实例 <b>'+h.oaInstanceId+'</b>。</div><div class="form-grid"><div class="form-item full"><span class="form-label">隐患标题</span><input id="hseEditTitle" value="'+h.title+'"></div><div class="form-item"><span class="form-label">位置</span><input id="hseEditLocation" value="'+h.location+'"></div><div class="form-item full"><span class="form-label">事实描述</span><textarea id="hseEditDesc">'+h.description+'</textarea></div><div class="form-item full"><span class="form-label">驳回原因</span><input value="'+(h.returnedReason||'-')+'" disabled></div></div>',{title:'集团监督检查 · 驳回修改',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="hseResubmit">基于原 OA 重新提交</button>'});document.getElementById('hseResubmit').onclick=function(){var title=document.getElementById('hseEditTitle').value.trim(),location=document.getElementById('hseEditLocation').value.trim(),desc=document.getElementById('hseEditDesc').value.trim();if(!title||!location||!desc){App.toast('标题、位置和事实描述均为必填','error');return;}h.title=title;h.location=location;h.description=desc;h.status='审批中';h.oaStatus='审批中';syncSupervisionToOa(h);h.actions.unshift({type:'重新提交 OA',at:now(),by:App.currentUser(),note:'沿用实例 '+h.oaInstanceId+'，状态链接保持不变'});if(App._emit)App._emit();document.querySelectorAll('.modal').forEach(function(n){n.remove();});App.toast('已基于原 OA 实例重新提交','success');route();};}
function receiveOaHazardEvent(id,event,note,payload){var h=App.hazard.byId(id);if(!h||h.source!=='HSE_SUPERVISION')return {ok:false};var map={returned:'驳回起草人',approved:'已批准',rejected:'已拒绝',revoked:'已撤销',terminated:'已终止'},status=map[event];if(!status)return {ok:false};if(h.oaStatus===status)return {ok:true,status:status};payload=payload||{};note=(note||status).trim();h.oaStatus=status;h.actions.unshift({type:'OA 回调',at:now(),by:'OA回调',note:status+'：'+note});if(event==='returned'){h.status='驳回起草人';h.returnedReason=note;App.pushWeComTodo('hazards','OA 驳回起草人',h.code+' 请在安全管理平台修改后重提','hazards.html?tab=ledger');}else if(event==='approved'){h.status='待受理';h.assessmentResponsiblePersonId=payload.assessmentResponsiblePersonId||'P-001';h.assessmentResponsible=payload.assessmentResponsible||'张青';h.penaltyAmount=payload.penaltyAmount==null?1000:+payload.penaltyAmount;App.pushWeComTodo('hazards','集团监督检查待受理',h.code+' OA 已批准，考核信息已回传','hazards.html?tab=ledger');}else{h.status=status;h.finalReason=note;App.pushWeComTodo('hazards','集团监督检查 OA 最终结果',h.code+' '+status,'hazards.html?tab=ledger');}if(App._emit)App._emit();document.querySelectorAll('.mask,.drawer').forEach(function(n){n.remove();});if(document.getElementById('ledgerBody'))renderLedger();App.toast('已接收 OA 回调：'+status,event==='returned'?'warn':'success');openHazard(h.id);return {ok:true,status:status};}
function mockPhoto(box){box.dataset.done='1';box.innerHTML='<span style="font-size:11px;color:#0B7A1C">✓ 已上传（模拟）</span>';box.style.borderColor='#00AA1C';box.style.background='#F0FFF2';}
function dstr(){var d=new Date();return String(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function seq(p){App._seq[p]=(App._seq[p]||0)+1;return String(App._seq[p]).padStart(2,'0');}
function now(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function uid(){return 'ID-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ================= 路由 ================= */
function route(){
  if(tab==='overview')viewOverview();
  else if(tab==='ledger')viewLedger();
  else if(tab==='mine-rect')viewMineRect();
  else if(tab==='mine-review')viewMineReview();
  else if(tab==='professional')viewProfessional();
  else if(tab==='supervision')viewSupervision();
  else if(tab==='stats')viewStats();
  else viewOverview();
}
window.openHazard=openHazard;window.openAccept=openAccept;window.openRectify=openRectify;window.openReview=openReview;window.suggestSup=suggestSup;
window.openSup=openSup;window.openRegister=openRegister;window.openProfessionalRegister=openProfessionalRegister;window.syncRegisterSource=syncRegisterSource;window.editSupervisionDraft=editSupervisionDraft;window.openOaApprovalForHazard=openOaApprovalForHazard;window.receiveOaHazardEvent=receiveOaHazardEvent;window.mockPhoto=mockPhoto;
OABridge.bind(function(item){if(item.businessType!=='supervision')return false;return receiveOaHazardEvent(item.businessId,item.event,item.note,item.payload).ok;});
window.renderLedger=renderLedger;window.doReview=doReview;window.doFeedback=doFeedback;window.doCloseSup=doCloseSup;
window.closeDrawerOpenAccept=closeDrawerOpenAccept;
window.closeDrawerOpenRectify=closeDrawerOpenRectify;window.closeDrawerOpenReview=closeDrawerOpenReview;
window.applyAcceptancePhrase=applyAcceptancePhrase;window.manageAcceptancePhrases=manageAcceptancePhrases;window.rejectAcceptance=rejectAcceptance;
window.drill=function(){};
route();
})();
</script>
