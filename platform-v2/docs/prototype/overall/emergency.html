<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>应急管理 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app"><div class="topbar"></div><div class="body"><aside class="sidebar"><div class="nav-tree"></div></aside><div class="content"><div class="page-header"></div><div class="page-body" id="pageBody"></div></div></div></div>
<script src="assets/store.js"></script><script src="assets/ui.js"></script>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search),tab=q.get('tab')||'plans',body=document.getElementById('pageBody'),titles={plans:'应急预案台账',search:'预案内容检索'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function now(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function statusTag(s){return '<span class="tag '+(s==='现行有效'?'tag-green':'tag-gray')+'">'+esc(s)+'</span>';}
function tableRows(rows){return rows.map(function(p){return '<tr><td class="mono">'+esc(p.code)+'</td><td><b>'+esc(p.title)+'</b><br><span class="muted">'+esc(p.fileName)+'</span></td><td>'+esc(p.type)+'</td><td>'+esc(p.org)+'</td><td>'+esc(p.version)+'</td><td>'+esc(p.effectiveDate)+'</td><td>'+esc(p.owner)+'</td><td>'+statusTag(p.status)+'</td><td><button class="btn btn-text" onclick="openPlan(\''+p.id+'\')">查看</button></td></tr>';}).join('')||'<tr><td colspan="9">'+UI.empty('暂无应急预案')+'</td></tr>';}
function renderPlans(){body.innerHTML='<div class="filter-bar"><div class="f-item">关键字 <input id="planKeyword" placeholder="预案名称或编号"></div><div class="f-item">预案类型 <select id="planType"><option value="">全部</option><option>综合应急预案</option><option>专项应急预案</option><option>现场处置方案</option></select></div><button class="btn btn-outline btn-sm" onclick="filterPlans()">查询</button><button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openPlanUpload()">+ 导入应急预案</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>预案编号</th><th>预案名称</th><th>类型</th><th>责任组织</th><th>版本</th><th>生效日期</th><th>维护责任</th><th>状态</th><th>操作</th></tr></thead><tbody id="planRows">'+tableRows(App.emergencyPlans||[])+'</tbody></table></div><div class="hint-line">应急管理独立维护应急预案目录和内容检索，不与法律法规、安全制度目录混在一起。</div>';}
window.filterPlans=function(){var key=document.getElementById('planKeyword').value.trim(),type=document.getElementById('planType').value,rows=(App.emergencyPlans||[]).filter(function(p){return (!key||(p.code+p.title+p.org).indexOf(key)>-1)&&(!type||p.type===type);});document.getElementById('planRows').innerHTML=tableRows(rows);};
window.openPlan=function(id){var p=(App.emergencyPlans||[]).filter(function(x){return x.id===id;})[0];if(!p)return;UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">预案编号</span><span class="d-value mono">'+esc(p.code)+'</span></div><div class="d-item"><span class="d-label">预案类型</span><span class="d-value">'+esc(p.type)+'</span></div><div class="d-item full"><span class="d-label">预案名称</span><span class="d-value">'+esc(p.title)+'</span></div><div class="d-item"><span class="d-label">责任组织</span><span class="d-value">'+esc(p.org)+'</span></div><div class="d-item"><span class="d-label">版本/状态</span><span class="d-value">'+esc(p.version)+' / '+statusTag(p.status)+'</span></div><div class="d-item"><span class="d-label">维护责任</span><span class="d-value">'+esc(p.owner)+'</span></div><div class="d-item"><span class="d-label">原始文件</span><span class="d-value">'+esc(p.fileName)+' · '+esc(p.pages)+' 页</span></div></div><div class="section-head"><h3>预案内容</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:150px">章节</th><th>内容</th><th>操作</th></tr></thead><tbody>'+(p.clauses||[]).map(function(c){return '<tr><td>'+esc(c.no)+'</td><td>'+esc(c.text)+'</td><td><button class="btn btn-text" onclick="App.toast(\'已定位到 '+esc(c.no)+'（原型）\',\'success\')">定位原文</button></td></tr>';}).join('')+'</tbody></table></div>',{title:'应急预案详情',wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button><button class="btn btn-primary" onclick="App.toast(\'已打开预案 PDF（原型）\',\'success\')">查看原始文件</button>'});};
window.openPlanUpload=function(){UI.modal('<div class="form-grid"><div class="form-item"><span class="form-label">预案编号 <span class="req">*</span></span><input id="epCode"></div><div class="form-item"><span class="form-label">预案类型 <span class="req">*</span></span><select id="epType"><option>综合应急预案</option><option>专项应急预案</option><option>现场处置方案</option></select></div><div class="form-item full"><span class="form-label">预案名称 <span class="req">*</span></span><input id="epTitle"></div><div class="form-item"><span class="form-label">责任组织</span><input id="epOrg" value="造型作业区"></div><div class="form-item"><span class="form-label">维护责任</span><input id="epOwner" value="造型作业区负责人"></div><div class="form-item"><span class="form-label">版本</span><input id="epVersion" value="V1.0"></div><div class="form-item"><span class="form-label">生效日期</span><input id="epEffective" type="date" value="2026-08-23"></div><div class="form-item full"><span class="form-label">预案 PDF <span class="req">*</span></span><div id="epFile" class="photo-box" style="height:56px" onclick="this.dataset.done=\'1\';this.innerHTML=\'<span style=color:#0B7A1C>✓ 已选择 PDF（模拟）</span>\'"><span>+ 选择预案 PDF</span></div></div></div>',{title:'导入应急预案',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="epOk">保存预案</button>'});document.getElementById('epOk').onclick=function(){var code=document.getElementById('epCode').value.trim(),title=document.getElementById('epTitle').value.trim(),file=document.getElementById('epFile');if(!code||!title||!file.dataset.done){App.toast('请填写编号、名称并选择 PDF','error');return;}App.emergencyPlans.unshift({id:'EP-'+Date.now().toString(36),code:code,title:title,type:document.getElementById('epType').value,org:document.getElementById('epOrg').value.trim()||'当前组织',version:document.getElementById('epVersion').value.trim()||'V1.0',publishDate:'2026-08-23',effectiveDate:document.getElementById('epEffective').value,status:'现行有效',fileName:title+'.pdf',pages:1,owner:document.getElementById('epOwner').value.trim()||'待维护',updatedAt:now(),clauses:[{no:'待解析',text:'PDF 内容将在生产环境完成解析和索引。'}]});App.persist();document.querySelectorAll('.modal').forEach(function(n){n.remove();});App.toast('应急预案已保存','success');renderPlans();};};
function renderSearch(){body.innerHTML='<div class="card"><div class="card-title">应急预案内容检索</div><div class="filter-bar"><div class="f-item" style="flex:1">检索内容 <input id="emergencyQuery" value="停止作业" placeholder="输入处置动作、事故类型或关键字"></div><button class="btn btn-primary" onclick="runEmergencySearch()">检索</button></div><div class="hint-line">结果只检索应急预案，点击可查看预案详情并定位章节。</div></div><div id="emergencyResults" style="margin-top:14px"></div>';runEmergencySearch();}
window.runEmergencySearch=function(){var key=(document.getElementById('emergencyQuery')||{}).value||'',results=[];(App.emergencyPlans||[]).forEach(function(p){(p.clauses||[]).forEach(function(c){if(!key||(p.title+c.no+c.text).indexOf(key)>-1)results.push({plan:p,clause:c});});});document.getElementById('emergencyResults').innerHTML=results.map(function(r){return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>'+esc(r.plan.title)+' · '+esc(r.clause.no)+'</b><p style="margin-top:8px;line-height:1.7">'+esc(r.clause.text)+'</p><span class="muted">'+esc(r.plan.type)+' / '+esc(r.plan.org)+' / '+esc(r.plan.version)+'</span></div><button class="btn btn-text" onclick="openPlan(\''+r.plan.id+'\')">查看预案</button></div></div>';}).join('')||UI.empty('未检索到相关预案内容');};
UI.renderShell('emergency',tab);UI.pageHeader(['应急管理',titles[tab]||'应急预案台账'],titles[tab]||'应急预案台账');if(tab==='search')renderSearch();else renderPlans();
})();
</script>
</body>
</html>
