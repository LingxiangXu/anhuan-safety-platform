<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>巡检任务 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
.inspection-context{display:flex;align-items:center;justify-content:space-between;gap:16px;background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:14px 18px;margin-bottom:16px}.inspection-context .ctx-main{display:flex;align-items:center;gap:12px}.inspection-context .ctx-avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:linear-gradient(135deg,var(--tz-blue),var(--tz-green))}.inspection-context .ctx-title{font-weight:600;color:var(--tz-deep)}.inspection-context .ctx-sub{font-size:12px;color:var(--gray-500)}.inspection-context .ctx-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}.risk-select{width:38px;text-align:center}.draft-card{border:1px solid var(--gray-200);border-radius:var(--radius-lg);background:#fff;margin-bottom:16px;overflow:hidden}.draft-card .dc-head{display:flex;align-items:center;gap:10px;padding:13px 18px;border-bottom:1px solid var(--gray-200);background:var(--gray-50)}.draft-card .dc-head .dc-title{font-size:14px;font-weight:600;color:var(--tz-deep)}.draft-card .dc-body{padding:16px 18px}.it-input{width:100%;border:1px solid var(--gray-300);border-radius:var(--radius-sm);padding:6px 9px;font-size:13px;background:#fff;color:var(--gray-700)}.it-input:focus{border-color:var(--tz-blue);box-shadow:0 0 0 3px var(--tz-blue-50);outline:none}.it-input.area{min-height:36px;resize:vertical;line-height:1.45}.src-chain{font-size:12px;color:var(--gray-500)}.src-chain .m{color:var(--tz-blue-700)}.freq-stack{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--gray-500)}.freq-stack b{font-weight:500;color:var(--gray-700)}.inline-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.plan-detail-row td,.task-detail-row td{background:var(--gray-50);padding:0}.detail-panel{padding:12px 14px}.detail-panel table{width:100%;border-collapse:collapse;font-size:12px}.detail-panel th,.detail-panel td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--gray-200)}.detail-panel th{color:var(--gray-500);font-weight:500}.detail-panel td{color:var(--gray-700)}.flow-strip{display:flex;align-items:center;gap:0;overflow-x:auto;padding:8px 0 4px}.flow-step{display:flex;align-items:center;gap:8px;white-space:nowrap}.flow-dot{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--tz-blue-50);border:1px solid var(--tz-blue-200);color:var(--tz-blue-700);font-size:12px;font-weight:600}.flow-step.done .flow-dot{background:var(--tz-green-50);border-color:var(--tz-green-100);color:var(--tz-green-600)}.flow-label{font-size:12px;color:var(--gray-600)}.flow-arrow{width:34px;height:1px;background:var(--gray-300);margin:0 10px}.standard-detail{margin-bottom:16px}.standard-detail .back-link{display:inline-flex;align-items:center;gap:4px;margin-bottom:12px}.content-line{display:flex;gap:8px;align-items:flex-start;margin-bottom:7px}.content-line .line-no{width:22px;height:22px;border-radius:50%;background:var(--tz-blue-50);color:var(--tz-blue-700);font-size:11px;display:flex;align-items:center;justify-content:center;flex:0 0 22px}.content-line .line-field{flex:1}.content-line .remove-line{color:var(--tz-error);font-size:12px;padding:5px 2px}.nowrap{white-space:nowrap}.stat-note{font-size:12px;color:var(--gray-500);line-height:1.7}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <div class="content">
      <div class="page-header"></div>
      <div class="page-body" id="pageBody"></div>
    </div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
"use strict";
var params=new URLSearchParams(location.search);
var tab=params.get("tab")||"overview";
if(tab==="stats")tab="overview";
var body=document.getElementById("pageBody");
var TITLES={overview:"巡检总览",items:"检查标准",plans:"巡检计划",tasks:"巡检任务"};
var INSPECTION_USERS=[
  {name:"张青",dept:"造型作业区 / 自动线组",post:"班组长"},
  {name:"王欣宇",dept:"造型作业区 / 自动线组",post:"兼职安全员"},
  {name:"李天翔",dept:"造型作业区 / 自动线组",post:"班组成员"},
  {name:"高远",dept:"造型作业区 / 自动线组",post:"班组成员"},
  {name:"李建杰",dept:"造型作业区 / 制模组",post:"班组长"},
  {name:"赵志宏",dept:"造型作业区 / 制模组",post:"兼职安全员"},
  {name:"张明",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"常兴明",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"李刚",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"郭海涛",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"李涛",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"郭勇",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"刘化利",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"郝利强",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"梁博文",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"王宝胜",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"杨天财",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"郭刚明",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"路宁",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"范利君",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"詹志星",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"刘翔",dept:"造型作业区 / 制模组",post:"班组成员"},
  {name:"张鹏伟",dept:"造型作业区 / 制模组",post:"班组成员"}
];

function esc(v){return String(v===undefined||v===null?"":v).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];});}
function uid(prefix){return (prefix||"ID")+"-"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function now(){var d=new Date(),p=function(n){return String(n).padStart(2,"0");};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+" "+p(d.getHours())+":"+p(d.getMinutes());}
function context(){
  var role=App.roleOf(App.currentRole)||{};
  var full=App.currentOrg||"";
  return {name:App.currentUser(),role:role.name||"当前岗位",org:full,area:full.split(" / ").pop()||full||"造型作业区"};
}
function ctx(){return context();}
function defaultAssigneeForPost(post){return (INSPECTION_USERS.filter(function(u){return u.post===post;})[0]||INSPECTION_USERS[0]).name;}
function assigneeOptions(selected){return INSPECTION_USERS.map(function(u){return '<option value="'+esc(u.name)+'" '+(u.name===selected?'selected':'')+'>'+esc(u.name+' · '+u.dept+' · '+u.post)+'</option>';}).join('');}
function teamOptions(selected){return (App.teams||[]).map(function(t){return '<option value="'+esc(t.id)+'" '+(t.id===selected?'selected':'')+'>'+esc(t.name)+'</option>';}).join('');}
function activeRisks(){
  var c=ctx();
  return (App.risks||[]).filter(function(r){return r.org===c.area&&(r.status==="已发布"||r.status==="管控中");});
}
function publishedStandards(){
  var c=ctx();
  return Object.keys(App.drafts||{}).map(function(k){return App.drafts[k];}).filter(function(d){return d.status==="已发布"&&activeRisks().some(function(r){return r.id===d.riskId;});});
}
function draftContentCount(d){return (d&&d.items||[]).reduce(function(total,item){return total+(item.contents||[]).filter(function(content){return String(content||"").trim();}).length;},0);}
function riskById(id){return (App.risks||[]).filter(function(r){return r.id===id;})[0];}
function draftFor(id){return (App.drafts||{})[id];}
function levelTag(r){return UI.tagOf(r.level||"low")||'<span class="tag tag-gray">未定级</span>';}
function freqStack(r){var f=r.checkFreq||{};return '<div class="freq-stack"><span>班组：<b>'+esc(f.group||"未设置")+'</b></span><span>分公司：<b>'+esc(f.branch||"未设置")+'</b></span><span>公司：<b>'+esc(f.company||"未设置")+'</b></span></div>';}
function freqPlain(r){var f=r.checkFreq||{};return [f.group||"",f.branch||"",f.company||""].filter(Boolean).join(" / ")||"未设置";}
function persist(){if(App._emit)App._emit();else if(App.persist)App.persist();}
function syncLegacy(){
  App.inspectionItems=[];App.inspectionPlans=[];App.inspectionTasks=[];
  Object.keys(App.drafts||{}).forEach(function(k){var d=App.drafts[k];(d.items||[]).forEach(function(it){(it.contents||[]).forEach(function(content,index){if(!String(content||"").trim())return;
    App.inspectionItems.push({id:it.id+"-C"+(index+1),sourceStandardItemId:it.id,standardVersionId:"STD-"+d.riskCode+"-V"+(d.version||1),code:"CHK-"+String(App.inspectionItems.length+1).padStart(3,"0"),name:content,standard:content,response:"是非",requiredPhoto:!!((it.contentPhotoRequired||[])[index]),sourceMeasure:it.manual?null:it.sourceMeasureId,sourceMeasureIds:it.manual?[]:(it.sourceMeasureIds||(it.sourceMeasureId?[it.sourceMeasureId]:[])),riskCode:d.riskCode,enabled:true,status:d.status,version:d.version||1,hazardId:it.hazardId});
  });});});
  (App.plans||[]).forEach(function(p){App.inspectionPlans.push({id:p.id,code:p.code,name:p.name,type:p.type,org:p.org||ctx().area,scope:p.scope,cycle:p.cycle,teamId:p.teamId,teamName:p.teamName,status:p.enabled?"已发布":"停用",standardRefs:p.standardRefs||[],items:(p.items||[]).map(function(_,i){return i+1;})});});
  (App.tasks||[]).forEach(function(t){App.inspectionTasks.push({id:t.id,code:t.code,planId:t.planId,planName:t.planName,org:t.org||ctx().area,teamId:t.teamId,teamName:t.teamName,assignee:t.claimant||null,window:t.dispatchTime||"-",status:t.status,completionRate:t.completionRate||0,unqualified:t.unqualified||0,createdAt:t.createdAt,completedAt:t.completedAt,results:t.results,hazardGeneratedIds:t.hazardGeneratedIds||[]});});
}
function persistInspection(){syncLegacy();persist();}
function planItemsFromDrafts(ids){
  var out=[];
  ids.forEach(function(id){var d=draftFor(id),r=riskById(id);if(!d||d.status!=="已发布"||!r)return;(d.items||[]).forEach(function(it){(it.contents||[]).forEach(function(content,index){content=String(content||"").trim();if(!content)return;out.push({id:it.id+"-C"+(index+1),sourceStandardItemId:it.id,riskCode:r.code,riskName:r.name,riskLocation:r.location,hazardId:it.hazardId,hazardName:it.hazardName,measureName:it.measureName,content:content,checkFreq:freqPlain(r),requiredPhoto:!!((it.contentPhotoRequired||[])[index])});});});});
  return out;
}
function makeTask(plan,dispatchType){
  var next=(App.tasks||[]).length+1;
  var task={id:uid("TASK"),code:"TASK-"+String(next).padStart(3,"0"),planId:plan.id,planName:plan.name,org:ctx().area,scope:plan.scope,standardRefs:plan.standardRefs||[],dispatchType:dispatchType||"单次",teamId:plan.teamId,teamName:plan.teamName,claimant:null,claimedAt:null,status:"待领取",createdAt:new Date().toISOString().slice(0,16).replace("T"," "),dispatchTime:(dispatchType==="周期派发"?"今天 ":"")+plan.dispatchTime,items:(plan.items||[]).map(function(it){return Object.assign({},it,{result:"",description:"",photoDone:false});}),results:null,completionRate:0,unqualified:0};
  App.tasks.unshift(task);persistInspection();return task;
}
function statusTag(s){var cls=(["已完成","合格"].indexOf(s)>-1)?"tag-green":(["已领取","执行中"].indexOf(s)>-1?"tag-blue":(["不合格","逾期"].indexOf(s)>-1?"tag-error":(["已停用","未检"].indexOf(s)>-1?"tag-gray":"tag-warn")));return '<span class="tag '+cls+'">'+esc(s)+'</span>';}
function setTab(next){location.href="inspection.html?tab="+next;}
function renderTabs(){return '';}
function canMaintainStandards(){return App.currentRole==="team_leader";}
function requireStandardMaintainer(){if(canMaintainStandards())return true;App.toast("检查标准由班组长关联风险点并维护，当前角色仅可查看","warn");return false;}

function viewOverview(){
  var c=ctx(),plans=(App.plans||[]).filter(function(p){return !p.org||p.org===c.area;}),tasks=(App.tasks||[]).filter(function(t){return !t.org||t.org===c.area;}),risks=activeRisks(),drafts=publishedStandards();
  var waiting=tasks.filter(function(t){return t.status==="待领取";}).length,claimed=tasks.filter(function(t){return t.status==="已领取";}).length,running=tasks.filter(function(t){return t.status==="执行中";}).length,done=tasks.filter(function(t){return t.status==="已完成";}).length,unq=tasks.reduce(function(n,t){return n+(t.unqualified||0);},0);
  body.innerHTML=renderTabs()+
  '<div class="kpi-grid g5"><div class="kpi clickable" onclick="setTab(\'tasks\')"><div class="k-label">待领取</div><div class="k-num warn">'+waiting+'</div><div class="k-sub">班组任务池</div></div><div class="kpi clickable" onclick="setTab(\'tasks\')"><div class="k-label">已领取</div><div class="k-num blue">'+claimed+'</div><div class="k-sub">首人领取后锁定</div></div><div class="kpi clickable" onclick="setTab(\'tasks\')"><div class="k-label">执行中</div><div class="k-num blue">'+running+'</div><div class="k-sub">现场逐项检查</div></div><div class="kpi clickable" onclick="setTab(\'tasks\')"><div class="k-label">已完成</div><div class="k-num green">'+done+'</div><div class="k-sub">结果已提交</div></div><div class="kpi"><div class="k-label">不合格项</div><div class="k-num danger">'+unq+'</div><div class="k-sub">逐条转隐患</div></div></div>'+ 
  '<div class="grid-2-1" style="margin-top:16px"><div class="card"><div class="card-title">巡检状态流程</div><div class="flow-strip"><div class="flow-step done"><span class="flow-dot">1</span><span class="flow-label">检查标准</span></div><span class="flow-arrow"></span><div class="flow-step '+(plans.length?"done":"")+'"><span class="flow-dot">2</span><span class="flow-label">巡检计划</span></div><span class="flow-arrow"></span><div class="flow-step '+(tasks.length?"done":"")+'"><span class="flow-dot">3</span><span class="flow-label">任务生成</span></div><span class="flow-arrow"></span><div class="flow-step '+(done?"done":"")+'"><span class="flow-dot">4</span><span class="flow-label">执行完成</span></div></div><div class="stat-note" style="margin-top:15px">检查标准发布后由巡检计划引用；计划启用后按周期自动生成班组任务，任务状态按“待领取 → 已领取 → 执行中 → 已完成/未检”流转。</div></div><div class="card"><div class="card-title">快捷入口</div><div style="display:flex;flex-direction:column;gap:9px"><button class="btn btn-primary" onclick="setTab(\'items\')">维护检查标准</button><button class="btn btn-outline" onclick="setTab(\'plans\')">创建巡检计划</button><button class="btn btn-outline" onclick="setTab(\'tasks\')">进入现场执行</button></div></div></div>'+ 
  '<div class="section-head"><h3>当前组织巡检计划</h3><button class="btn btn-text" onclick="setTab(\'plans\')">查看全部</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>计划编号</th><th>计划名称</th><th>类型</th><th>周期/派发</th><th>执行班组</th><th>检查项</th><th>状态</th></tr></thead><tbody>'+(plans.map(function(p){return '<tr><td class="mono">'+esc(p.code)+'</td><td>'+esc(p.name)+'</td><td><span class="tag tag-blue">'+esc(p.type)+'</span></td><td>'+esc(p.cycle)+' / '+esc(p.dispatchTime)+'</td><td>'+esc(p.teamName||"-")+'</td><td>'+(p.items||[]).length+' 项</td><td>'+(p.enabled?'<span class="tag tag-green">已启用</span>':'<span class="tag tag-gray">未启用</span>')+'</td></tr>';}).join("")||'<tr><td colspan="7">'+UI.empty("暂无巡检计划")+'</td></tr>')+'</tbody></table></div>';
}

function viewItems(){
  if(params.get("riskId"))return renderItemsDetail(params.get("riskId"));
  var risks=activeRisks(),drafts=Object.keys(App.drafts||{}).map(function(k){return App.drafts[k];}).filter(function(d){return risks.some(function(r){return r.id===d.riskId;});});
  body.innerHTML=renderTabs()+
  '<div class="card"><div class="card-title">① 当前组织风险点</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th class="risk-select"><input type="checkbox" id="riskAll" onchange="toggleAllRisks(this)" '+(canMaintainStandards()?"":"disabled")+'></th><th>风险点编号</th><th>风险点名称</th><th>位置</th><th>危险源</th><th>最高风险等级</th><th>风险状态</th><th>检查标准</th></tr></thead><tbody>'+(risks.map(function(r){var d=draftFor(r.id);return '<tr><td class="risk-select"><input type="checkbox" class="risk-check" value="'+esc(r.id)+'" '+(canMaintainStandards()?"":"disabled")+'></td><td class="mono">'+esc(r.code)+'</td><td>'+esc(r.name)+'</td><td>'+esc(r.location)+'</td><td>'+((r.hazards||[]).length)+' 个</td><td>'+levelTag(r)+'</td><td><span class="tag tag-green">管控中</span></td><td>'+(d?(d.status==="已发布"?'<span class="tag tag-green">已发布 V'+d.version+'</span>':'<span class="tag tag-warn">草稿 V'+d.version+'</span>'):'<span class="tag tag-gray">未创建</span>')+'</td></tr>';}).join("")||'<tr><td colspan="8">'+UI.empty("当前组织暂无管控中风险点")+'</td></tr>')+'</tbody></table></div><div class="inline-actions" style="margin-top:12px"><button class="btn btn-primary" '+(canMaintainStandards()?"":"disabled")+' onclick="genDrafts()">关联风险措施生成草稿</button><span class="hint-line">由班组长选择风险点生成并维护；其他角色只读查看。</span></div></div>'+ 
  '<div class="section-head"><h3>② 检查标准维护</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>风险点编号</th><th>风险点名称</th><th>状态</th><th>版本</th><th>变更次数</th><th>检查内容</th><th>更新时间</th><th>操作</th></tr></thead><tbody>'+(drafts.map(function(d){return '<tr><td class="mono">'+esc(d.riskCode)+'</td><td>'+esc(d.riskName)+'</td><td>'+(d.status==="已发布"?'<span class="tag tag-green">已发布</span>':'<span class="tag tag-warn">草稿</span>')+'</td><td>V'+d.version+'</td><td>'+Math.max((d.version||1)-1,0)+' 次</td><td>'+draftContentCount(d)+' 条</td><td>'+esc(d.updatedAt||"-")+'</td><td><button class="btn btn-text" onclick="openStandard(\''+esc(d.riskId)+'\')">'+(canMaintainStandards()?"维护":"查看")+'</button></td></tr>';}).join("")||'<tr><td colspan="8">'+UI.empty("尚未生成检查标准草稿")+'</td></tr>')+'</tbody></table></div>';
}
function toggleAllRisks(box){document.querySelectorAll(".risk-check").forEach(function(x){x.checked=box.checked;});}
function genDrafts(){
  if(!requireStandardMaintainer())return;
  var ids=[].slice.call(document.querySelectorAll(".risk-check:checked")).map(function(x){return x.value;});
  if(!ids.length){App.toast("请先选择风险点","error");return;}
  ids.forEach(function(id){var r=riskById(id);if(!r)return;var d=draftFor(id);if(d)return;var items=App.inspectionRiskItems(r);App.drafts[id]={riskId:id,riskCode:r.code,riskName:r.name,status:"草稿",version:1,updatedAt:new Date().toISOString().slice(0,16).replace("T"," "),items:items};});
  persistInspection();App.toast("已生成检查标准草稿，请逐个维护并发布","success");viewItems();
}
function openStandard(id){location.href="inspection.html?tab=items&riskId="+encodeURIComponent(id);}
function renderItemsDetail(id){
  var d=draftFor(id),r=riskById(id);if(!d||!r){body.innerHTML=renderTabs()+UI.empty("检查标准不存在");return;}

function calculatePlanOccurrences(cycle,startValue,endValue,weekday,monthday){
  var start=parsePlanDate(startValue),end=parsePlanDate(endValue),out=[];if(!start||!end||end<start)return out;

function openExecute(taskId){
  var t=(App.tasks||[]).filter(function(x){return x.id===taskId;})[0];if(!t)return;
  if(t.status==="待领取"){App.toast("请先领取任务","warn");return;}if(t.claimant!==App.currentUser()){App.toast("任务已锁定给 "+(t.claimant||"其他成员")+"，当前用户不可执行","error");return;}
  var items=t.items||[];
  UI.drawer('<div class="alert info">任务 <b>'+esc(t.code)+'</b> · 执行班组 '+esc(t.teamName||"-")+' · 领取人 '+esc(t.claimant||"-")+' · '+esc(t.dispatchTime||"-")+'<br>位置校验：<button class="btn btn-outline btn-sm" onclick="mockLocation(this,\''+esc(t.id)+'\')">获取现场位置并开始执行</button> <span id="execLocation" class="tag tag-gray">未校验</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:44px">#</th><th>危险源/位置</th><th>检查内容</th><th>检查结果</th><th>说明</th><th>照片</th></tr></thead><tbody>'+items.map(function(it,i){return '<tr><td>'+(i+1)+'</td><td>'+esc(it.hazardName)+'<div class="row-hint">'+esc(it.riskLocation)+'</div></td><td>'+esc(it.content)+'</td><td><select class="res" data-item="'+esc(it.id)+'"><option value="">选择</option><option value="合格" '+(it.result==="合格"?"selected":"")+'>合格</option><option value="不合格" '+(it.result==="不合格"?"selected":"")+'>不合格</option></select></td><td><input class="it-input inspection-description" data-description="'+esc(it.id)+'" placeholder="填写现场说明；不合格时必填" value="'+esc(it.description||it.note||"")+'"></td><td><div class="photo-box" data-photo-box="'+esc(it.id)+'" style="height:54px" onclick="mockPhoto(this)"><span>'+(it.photoDone?"✓ 已上传现场照片":(it.requiredPhoto?"+ 上传现场照片（必拍）":"+ 上传现场照片（选填）"))+'</span></div></td></tr>';}).join("")+'</tbody></table></div><div id="execHint" class="hint-line">检查结果仅有合格、不合格；不合格项必须填写说明，该说明将直接作为隐患标题；是否必拍按检查标准逐条校验。</div>',{title:"执行巡检 · "+t.code,wide:true,footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="execOk">提交巡检结果</button>'});
  document.getElementById("execOk").onclick=function(){var loc=document.getElementById("execLocation");if(!loc||loc.className.indexOf("tag-green")<0){App.toast("请先完成现场位置校验","error");return;}var results=[],ok=true;document.querySelectorAll(".res").forEach(function(sel){var item=items.filter(function(x){return x.id===sel.getAttribute("data-item");})[0],description=(document.querySelector('[data-description="'+sel.getAttribute("data-item")+'"]')||{}).value||"",photo=document.querySelector('[data-photo-box="'+sel.getAttribute("data-item")+'"]');description=description.trim();if(!sel.value){ok=false;App.toast("存在未判定检查项","error");return;}if(sel.value==="不合格"&&!description){ok=false;App.toast("不合格项必须填写说明，说明将作为隐患标题","error");return;}if(item&&item.requiredPhoto&&photo&&!photo.dataset.done&&!item.photoDone){ok=false;App.toast("必拍项目需先上传现场照片","error");return;}results.push({itemId:item.id,result:sel.value,description:description,photoDone:!!(photo&&photo.dataset.done)||!!(item&&item.photoDone)});});if(!ok||results.length!==items.length)return;results.forEach(function(res){var it=items.filter(function(x){return x.id===res.itemId;})[0];it.result=res.result;it.description=res.description;delete it.note;it.photoDone=res.photoDone;});t.results=results;t.completionRate=100;t.unqualified=results.filter(function(x){return x.result==="不合格";}).length;t.status="已完成";t.completedAt=new Date().toISOString().slice(0,16).replace("T"," ");persistInspection();closeInspectionOverlays();viewTasks();var refreshed=(App.tasks||[]).filter(function(x){return x.id===t.id;})[0],pending=pendingBadItems(refreshed).length;App.toast("巡检结果已提交，完成率 100%"+(pending?"，检出 "+pending+" 项待转隐患":""),"success");if(pending)openHazardConversion(refreshed.id);};
}

function openHazardConversion(taskId){var t=(App.tasks||[]).filter(function(x){return x.id===taskId;})[0];if(!t)return;var pending=pendingBadItems(t);if(!pending.length){App.toast('该任务没有待转隐患的不合格项','success');openTaskDetail(taskId);return;}var rows=pending.map(function(item,i){return '<tr><td><input type="checkbox" class="pending-hazard-check" value="'+esc(item.id)+'" checked></td><td>'+(i+1)+'</td><td>'+esc(item.riskLocation||t.scope||'-')+'</td><td>'+esc(item.content||'-')+'</td><td><b>'+esc(item.description||item.note||'-')+'</b></td><td>'+(item.photoDone?'<span class="tag tag-green">已带入</span>':'<span class="tag tag-gray">无照片</span>')+'</td></tr>';}).join('');UI.drawer('<div class="alert info">这里只显示“不合格且尚未转隐患”的检查项。每条检查项分别生成一条隐患，隐患标题取巡检说明；可勾选单条或多条处理。</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th><input type="checkbox" checked onchange="toggleAllPendingHazards(this)"></th><th>#</th><th>位置</th><th>检查内容</th><th>隐患标题（巡检说明）</th><th>现场照片</th></tr></thead><tbody>'+rows+'</tbody></table></div>',{title:'转隐患 · '+t.code+'（待处理 '+pending.length+' 项）',wide:true,footer:'<button class="btn btn-outline" data-close>稍后处理</button><button class="btn btn-primary" onclick="convertSelectedHazards(\''+esc(t.id)+'\')">生成所选隐患</button>'});}
function convertSelectedHazards(taskId){var t=(App.tasks||[]).filter(function(x){return x.id===taskId;})[0],ids=[].slice.call(document.querySelectorAll('.pending-hazard-check:checked')).map(function(x){return x.value;});if(!t)return;if(!ids.length){App.toast('请至少选择一条不合格检查项','error');return;}syncLegacy();var generated=0;ids.forEach(function(itemId){var before=(App.hazards||[]).length,h=App.inspection.toHazard(t.id,itemId),item=(t.items||[]).filter(function(x){return x.id===itemId;})[0];if(h){t.hazardGeneratedIds=t.hazardGeneratedIds||[];if(t.hazardGeneratedIds.indexOf(h.id)<0)t.hazardGeneratedIds.push(h.id);if(item)item.generatedHazardId=h.id;if((App.hazards||[]).length>before)generated++;}});persistInspection();closeInspectionOverlays();var remaining=pendingBadItems(t).length;App.toast('已生成 '+generated+' 条隐患'+(remaining?'，仍有 '+remaining+' 条待处理':'，本任务不合格项已全部转隐患'),'success');refreshTaskRows();if(remaining)openHazardConversion(taskId);else openTaskDetail(taskId);}

function mockPhoto(box){box.innerHTML='<span style="font-size:11px;color:#0B7A1C">✓ 已上传现场照片（模拟）</span>';box.dataset.done="1";box.style.borderColor="#00AA1C";box.style.background="#F0FFF2";}
function mockLocation(btn,taskId){var el=document.getElementById("execLocation"),t=(App.tasks||[]).filter(function(x){return x.id===taskId;})[0];if(el){el.textContent=ctx().area+"（模拟）";el.className="tag tag-green";}if(t&&t.status==="已领取"){t.status="执行中";t.startedAt=new Date().toISOString().slice(0,16).replace("T"," ");persistInspection();refreshTaskRows();App.toast("现场位置已确认，任务进入执行中","success");}if(btn)btn.disabled=true;}
function openTaskDetail(taskId){var t=(App.tasks||[]).filter(function(x){return x.id===taskId;})[0];if(!t)return;var pending=pendingBadItems(t).length,rows=(t.items||[]).map(function(it){var hazard=it.result==="不合格"?generatedHazardFor(t,it):null,state=it.result!=="不合格"?'<span class="muted">—</span>':hazard?'<span class="tag tag-green">已转隐患</span><div class="row-hint mono">'+esc(hazard.code)+'</div>':'<span class="tag tag-warn">待转隐患</span>';return '<tr><td>'+esc(it.hazardName)+'</td><td>'+esc(it.riskLocation||t.scope||'-')+'</td><td>'+esc(it.content)+'</td><td>'+(it.result?statusTag(it.result):'<span class="tag tag-gray">未判定</span>')+'</td><td>'+esc(it.description||it.note||"-")+'</td><td>'+(it.photoDone?'<span class="tag tag-green">已上传</span>':'<span class="tag tag-gray">未上传</span>')+'</td><td>'+state+'</td></tr>';}).join("");UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">任务编号</span><span class="d-value mono">'+esc(t.code)+'</span></div><div class="d-item"><span class="d-label">来源计划</span><span class="d-value">'+esc(t.planName)+'</span></div><div class="d-item"><span class="d-label">任务状态</span><span class="d-value">'+statusTag(t.status)+(pending?' <span class="tag tag-warn">待转隐患 '+pending+'</span>':'')+'</span></div><div class="d-item"><span class="d-label">执行班组</span><span class="d-value">'+esc(t.teamName||"-")+'</span></div><div class="d-item"><span class="d-label">领取人</span><span class="d-value">'+esc(t.claimant||"-")+'</span></div><div class="d-item"><span class="d-label">完成率</span><span class="d-value">'+(t.completionRate||0)+'%</span></div><div class="d-item"><span class="d-label">不合格项</span><span class="d-value">'+(t.unqualified||0)+'</span></div></div><div class="section-head"><h3>全部检查结果</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>危险源</th><th>位置</th><th>检查内容</th><th>检查结果</th><th>说明</th><th>照片</th><th>隐患转换</th></tr></thead><tbody>'+rows+'</tbody></table></div><div class="hint-line">查看结果保留全部检查项；“转隐患”入口只处理不合格且尚未转换的检查项，按任务与检查项防止重复建单。</div>',{title:"巡检结果 · "+t.code,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'+(pending?'<button class="btn btn-primary" onclick="closeInspectionOverlays();openHazardConversion(\''+esc(t.id)+'\')">转隐患（'+pending+'）</button>':'<button class="btn btn-outline" onclick="location.href=\'hazards.html?tab=ledger\'">查看隐患台账</button>')});}

window.setTab=setTab;window.toggleAllRisks=toggleAllRisks;window.genDrafts=genDrafts;window.openStandard=openStandard;window.saveDraft=saveDraft;window.publishDraft=publishDraft;window.addContent=addContent;window.removeContent=removeContent;window.addManualItem=addManualItem;window.removeItem=removeItem;window.openPlanModal=openPlanModal;window.syncPlanType=syncPlanType;window.syncCycleFields=syncCycleFields;window.updatePlanSchedulePreview=updatePlanSchedulePreview;window.togglePlanDetail=togglePlanDetail;window.togglePlan=togglePlan;window.confirmDisablePlan=confirmDisablePlan;window.removePlan=removePlan;window.filterTasks=filterTasks;window.claimTask=claimTask;window.transferTask=transferTask;window.confirmTransferTask=confirmTransferTask;window.markTaskUninspected=markTaskUninspected;window.confirmTaskUninspected=confirmTaskUninspected;window.startTask=startTask;window.completeTask=completeTask;window.openExecute=openExecute;window.openTaskDetail=openTaskDetail;window.openHazardConversion=openHazardConversion;window.toggleAllPendingHazards=toggleAllPendingHazards;window.convertSelectedHazards=convertSelectedHazards;window.closeInspectionOverlays=closeInspectionOverlays;window.onResultChange=onResultChange;window.mockPhoto=mockPhoto;window.mockLocation=mockLocation;

UI.renderShell("inspection",tab);UI.pageHeader(["巡检任务",TITLES[tab]||"巡检总览"],TITLES[tab]||"巡检总览");
if(tab==="overview")viewOverview();else if(tab==="items")viewItems();else if(tab==="plans")viewPlans();else if(tab==="tasks")viewTasks();else viewOverview();
})();
