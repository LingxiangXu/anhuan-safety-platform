<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>特殊作业管控 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <div class="content">
      <div class="page-header"></div>
      <div class="page-body" id="pageBody"></div>
    </div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
"use strict";
var params=new URLSearchParams(location.search);
var tab=params.get('tab')||'ledger';
var body=document.getElementById('pageBody');
UI.renderShell('permits',tab);
var TITLES={ledger:'作业票台账',review:'待我审核',approve:'待我审批',execute:'现场执行',archived:'已归档'};
UI.pageHeader(['特殊作业管控',TITLES[tab]],TITLES[tab],'<button class="btn btn-outline" onclick="openPermitRules()">审批规则</button>');

var TYPE_KEYS={hotwork:'动火作业',height:'高处作业',power:'临时用电',confined:'有限空间'};
var STEPS=['作业申请','资格校验','风险分析','审批路径','审批完成','监护确认','开工执行','完工验收','归档'];
function directoryOptions(selected){return (App.directoryMembers||[]).filter(function(p){return p.status==='在职';}).map(function(p){return '<option value="'+p.id+'" '+(p.id===selected?'selected':'')+'>'+p.name+' · '+p.org+' · '+p.post+'</option>';}).join('');}
function directoryPerson(id){return App.directoryMemberById(id)||{};}
function typeTag(t){var map={hotwork:'<span class="tag tag-error">动火</span>',height:'<span class="tag tag-big">高处</span>',power:'<span class="tag tag-blue">临电</span>',confined:'<span class="tag tag-purple">有限空间</span>'};return map[t]||t;}
function statusTag(s){
  var map={'资格校验失败':'<span class="tag tag-error">资格阻断</span>','审批中':'<span class="tag tag-warn">审批中</span>',
  '待监护确认':'<span class="tag tag-purple">待监护确认</span>','待开工':'<span class="tag tag-blue">待开工</span>','执行中':'<span class="tag tag-green">执行中</span>',
  '已暂停':'<span class="tag tag-warn">已暂停</span>','待验收':'<span class="tag tag-purple">待验收</span>','已归档':'<span class="tag tag-gray">已归档</span>',
  '超时阻断':'<span class="tag tag-error">超时阻断（禁止作业）</span>',
  '延期审批中':'<span class="tag tag-error">延期审批中（禁止作业）</span>',
  '已退回':'<span class="tag tag-error">已退回</span>','已驳回':'<span class="tag tag-error">已驳回</span>','监护条件不满足':'<span class="tag tag-error">条件不满足</span>','待重新申请':'<span class="tag tag-error">变更待重申</span>','草稿':'<span class="tag tag-gray">草稿</span>'};
  return map[s]||('<span class="tag tag-gray">'+s+'</span>');
}

/* ================= 作业票台账 ================= */
function viewLedger(){
  body.innerHTML=
  '<div class="alert info">演示入口：作业票 <b>WP-20260801-001 有限空间作业</b> 处于 <b>资格校验失败</b>（人员证书过期阻断），可演示「补齐资格 → 重新校验 → 按类型×级别审批路径提交」全链路。</div>'+
  '<div class="filter-bar">'+
    '<div class="f-item">作业类型 <select id="fType"><option value="">全部</option><option>动火作业</option><option>高处作业</option><option>临时用电</option><option>有限空间</option></select></div>'+
    '<div class="f-item">状态 <select id="fStatus"><option value="">全部</option><option>资格校验失败</option><option>执行中</option><option>超时阻断</option><option>已归档</option></select></div>'+ 
    '<button class="btn btn-outline btn-sm" onclick="renderLedger()">查询</button>'+
    '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openCreatePermit()">+ 新建作业票</button>'+
  '</div>'+
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>作业票编号</th><th>类型</th><th>级别</th><th>作业内容</th><th>作业地点</th><th>申请人</th><th>作业负责人</th><th>监护人</th><th>状态</th><th>操作</th></tr></thead><tbody id="ledgerBody">'+
  '</tbody></table></div>';
  renderLedger();
}
function renderLedger(){
  var ty=document.getElementById('fType')?document.getElementById('fType').value:'';
  var st=document.getElementById('fStatus')?document.getElementById('fStatus').value:'';
  var rows=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&(!ty||w.type===ty)&&(!st||w.status===st);});
  document.getElementById('ledgerBody').innerHTML=rows.map(function(w){
    return '<tr><td class="mono">'+w.code+'</td><td>'+typeTag(w.typeKey)+'</td><td><span class="tag tag-blue">'+(w.workLevel||'三级')+'</span></td><td>'+w.workContent+'</td><td>'+w.location+'</td>'+
    '<td>'+w.applicant+'</td><td>'+w.workLeader+'</td><td>'+(w.guardian||'<span class="tag tag-error">未指定</span>')+'</td>'+
    '<td>'+statusTag(w.status)+'</td><td><button class="btn btn-text" onclick="openPermit(\''+w.id+'\')">详情</button></td></tr>';
  }).join('')||UI.empty('暂无作业票');
}

/* ================= 待我审核 / 待我审批 ================= */
function viewReview(){
  var rows=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&(w.status==='审批中'||w.status==='延期审批中')&&w.currentApprovalNode;});
  body.innerHTML=
  '<div class="hint-line">本页办理安全管理平台内置审批；完整展示审批节点、审批人、意见和时间，待办推送企业微信。延期批准前禁止继续作业。</div>'+ 
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>作业票编号</th><th>类型</th><th>作业内容</th><th>地点</th><th>计划时间</th><th>作业级别</th><th>当前审批节点</th><th>操作</th></tr></thead><tbody>'+
  rows.map(function(w){return '<tr><td class="mono">'+w.code+'</td><td>'+typeTag(w.typeKey)+'</td><td>'+w.workContent+'</td><td>'+w.location+'</td><td>'+w.plannedStart+' ~ '+w.plannedEnd+'</td><td><span class="tag tag-big">'+(w.workLevel||'三级')+'</span></td>'+
    '<td><span class="tag tag-warn">'+w.currentApprovalNode+'</span></td><td><button class="btn btn-primary btn-sm" onclick="openApproval(\''+w.id+'\')">平台内'+(w.status==='延期审批中'?'延期':'作业票')+'审批 ▸</button></td></tr>';}).join('')||
  UI.empty('当前无审批中作业票')+'</tbody></table></div>';
}
function viewApprove(){
  var rows=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&(w.status==='审批中'||w.status==='延期审批中')&&w.currentApprovalNode;});
  body.innerHTML=
  '<div class="hint-line">本页展示平台内置审批节点；全部节点通过后才进入监护确认，每个节点待办同步推送企业微信。</div>'+ 
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>作业票编号</th><th>类型</th><th>作业内容</th><th>作业级别</th><th>当前审批节点</th><th>操作</th></tr></thead><tbody>'+
  rows.map(function(w){return '<tr><td class="mono">'+w.code+'</td><td>'+typeTag(w.typeKey)+'</td><td>'+w.workContent+'</td><td><span class="tag tag-big">'+(w.workLevel||'三级')+'</span></td>'+
    '<td><span class="tag tag-warn">'+w.currentApprovalNode+'</span></td><td><button class="btn btn-primary btn-sm" onclick="openApproval(\''+w.id+'\')">'+w.currentApprovalNode+' · 平台内办理 ▸</button></td></tr>';}).join('')||
  UI.empty('当前无审批中作业票')+'</tbody></table></div>';
}

/* ================= 现场执行 ================= */
function viewExecute(){
  var rows=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&(w.status==='待监护确认'||w.status==='待开工'||w.status==='执行中'||w.status==='已暂停'||w.status==='超时阻断'||w.status==='待验收'||w.status==='监护条件不满足'||w.status==='延期审批中');});
  body.innerHTML=
  '<div class="card" style="margin-bottom:14px"><div class="card-title">现场作业地图 / 列表入口</div><div class="hint-line">地图仅显示审批中、待监护确认、待开工、执行中、暂停、超时阻断和延期审批中的作业票；完工和归档不显示。</div><button class="btn btn-outline btn-sm" onclick="openPermitMap()">查看未完成作业票地图</button></div>'+ 
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>作业票编号</th><th>类型</th><th>作业内容</th><th>现场阶段</th><th>监护人</th><th>状态</th><th>操作</th></tr></thead><tbody>'+
  rows.map(function(w){
    var act='';
    if(w.status==='待监护确认'||w.status==='监护条件不满足')act='<button class="btn btn-primary btn-sm" onclick="openGuardian(\''+w.id+'\')">监护确认 ▸</button>';
    else if(w.status==='待开工')act='<button class="btn btn-green btn-sm" onclick="doStart(\''+w.id+'\')">开工</button>';
    else if(w.status==='执行中')act='<button class="btn btn-warn btn-sm" onclick="doPause(\''+w.id+'\')">暂停</button> <button class="btn btn-outline btn-sm" onclick="requestExtension(\''+w.id+'\')">申请延期</button> <button class="btn btn-outline btn-sm" onclick="doComplete(\''+w.id+'\')">完工</button>';
    else if(w.status==='已暂停')act='<button class="btn btn-outline btn-sm" onclick="doResume(\''+w.id+'\')">恢复作业</button> <button class="btn btn-outline btn-sm" onclick="requestExtension(\''+w.id+'\')">申请延期</button>';
    else if(w.status==='超时阻断')act='<span class="tag tag-error">延期批准前禁止作业</span> <button class="btn btn-primary btn-sm" onclick="requestExtension(\''+w.id+'\')">申请延期</button>';
    else if(w.status==='延期审批中')act='<span class="tag tag-error">审批前禁止继续作业</span> <button class="btn btn-primary btn-sm" onclick="openExtensionApproval(\''+w.id+'\')">处理延期</button>';
    else if(w.status==='待验收')act='<button class="btn btn-green btn-sm" onclick="doAccept(\''+w.id+'\')">完工验收</button>';
    return '<tr><td class="mono">'+w.code+'</td><td>'+typeTag(w.typeKey)+'</td><td>'+w.workContent+'</td><td>'+stepOf(w.status)+'</td><td>'+(w.guardian||'-')+'</td><td>'+statusTag(w.status)+'</td><td>'+act+'</td></tr>';
  }).join('')||UI.empty('暂无现场作业')+'</tbody></table></div>'+
  '<div class="hint-line">现场执行阶段：监护确认 → 开工 → 暂停/恢复 → 完工 → 验收 → 归档。作业票超时必须申请延期，批准前禁止继续作业。</div>';
}
function openPermitMap(){
  var rows=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&App.mapPermitStatuses.indexOf(w.status)>-1;});
  UI.modal('<div class="alert info">当前为作业位置示意图，不代表 GIS 精确定位；正式地图能力需接入厂区底图和位置坐标。</div><div class="mobile-map" style="height:300px"><div class="road h"></div><div class="road v"></div>'+rows.map(function(w,i){return '<span class="pin '+(w.status==='执行中'?'major':'blue')+'" style="left:'+(25+(i*27)%60)+'%;top:'+(30+(i*21)%55)+'%" title="'+w.code+' '+w.status+'"></span>';}).join('')+'</div><div class="hint-line">当前展示 '+rows.length+' 张未完成作业票，点击列表可查看详情。</div><div class="mobile-list" style="margin-top:10px">'+rows.map(function(w){return '<div class="mobile-row"><span><b>'+w.code+'</b><span class="sub">'+w.type+' · '+w.location+'</span></span>'+statusTag(w.status)+'</div>';}).join('')+'</div>',{title:'现场作业地图（未完成）',wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'});
}
function stepOf(status){
  var map={'待监护确认':7,'监护条件不满足':7,'待开工':7,'执行中':7,'已暂停':7,'超时阻断':7,'延期审批中':7,'待验收':8,'已归档':9};
  return '第 '+(map[status]||'-')+' 步';
}

/* ================= 已归档 ================= */
function viewArchived(){
  var rows=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&w.status==='已归档';});
  body.innerHTML=
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>作业票编号</th><th>类型</th><th>作业内容</th><th>归档时间</th><th>操作</th></tr></thead><tbody>'+
  rows.map(function(w){return '<tr><td class="mono">'+w.code+'</td><td>'+typeTag(w.typeKey)+'</td><td>'+w.workContent+'</td><td>'+(w.archivedAt||'-')+'</td>'+
    '<td><button class="btn btn-text" onclick="openPermit(\''+w.id+'\')">查看归档档案</button></td></tr>';}).join('')||
  UI.empty('暂无归档作业票')+'</tbody></table></div>'+
  '<div class="hint-line">归档后作业票、审批意见、资格校验、监护确认和照片<b>只读</b>，形成可追溯档案。</div>';
}

/* ================= 作业票详情（九步流程） ================= */
function openPermit(id){
  var w=App.permit.byId(id);
  if(!w||App.inCurrentOrgScope&&!App.inCurrentOrgScope(w.org)){App.toast('当前组织范围无权查看该作业票','error');return;}
  var stepIdx=stepIndexOf(w.status);
  UI.drawer(
    '<div class="steps" style="margin-bottom:16px">'+STEPS.map(function(s,i){
      var n=i+1,cls=n<stepIdx?'done':(n===stepIdx?'current':'');
      if(n===2&&w.status==='资格校验失败')cls='block';
      return '<div class="step"><div class="dot '+cls+'">'+(n<stepIdx?'✓':n)+'</div><div class="s-name '+(n===stepIdx?'current':'')+'">'+s+'</div></div>'+(n<9?'<div class="step-line '+(n<stepIdx?'done':'')+'"></div>':'');
    }).join('')+'</div>'+
    '<div class="desc desc-2">'+
      '<div class="d-item"><span class="d-label">作业票编号</span><span class="d-value">'+w.code+'</span></div>'+
      '<div class="d-item"><span class="d-label">作业类型</span><span class="d-value">'+w.type+'</span></div>'+
      '<div class="d-item"><span class="d-label">作业级别</span><span class="d-value"><span class="tag tag-blue">'+(w.workLevel||'三级')+'</span></span></div>'+
      '<div class="d-item"><span class="d-label">地点</span><span class="d-value">'+w.location+'</span></div>'+
      '<div class="d-item"><span class="d-label">风险等级</span><span class="d-value">'+w.riskLevel+'</span></div>'+
      '<div class="d-item"><span class="d-label">计划窗口</span><span class="d-value">'+w.plannedStart+' ~ '+w.plannedEnd+'</span></div>'+
      '<div class="d-item"><span class="d-label">状态</span><span class="d-value">'+statusTag(w.status)+'</span></div>'+ 
      '<div class="d-item full"><span class="d-label">类型×级别审批路径</span><span class="d-value">'+(w.approvalPath||App.approvalPathFor(w)).join(' → ')+'</span></div>'+ 
      '<div class="d-item full"><span class="d-label">作业内容</span><span class="d-value">'+w.workContent+'</span></div>'+
      '<div class="d-item full"><span class="d-label">安全方案</span><span class="d-value">'+w.safetyPlan+'</span></div>'+
      '<div class="d-item full"><span class="d-label">应急处置</span><span class="d-value">'+(w.emergencyPlan||'-')+'</span></div>'+ 
      '<div class="d-item full"><span class="d-label">风险措施引用快照</span><span class="d-value">'+((w.risks||[]).map(function(r){return r.ref||'现场风险分析：'+r.hazard;}).join('；')||'未关联风险措施')+'</span></div>'+ 
    '</div>'+
    ((w.extensionRequests||[]).length?'<div class="section-head"><h3>延期记录</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>原结束时间</th><th>申请延期至</th><th>原因</th><th>状态</th><th>申请人/时间</th></tr></thead><tbody>'+w.extensionRequests.map(function(x){return '<tr><td>'+x.oldEnd+'</td><td>'+x.newEnd+'</td><td>'+x.reason+'</td><td>'+statusTag(x.status)+'</td><td>'+x.by+' / '+x.createdAt+'</td></tr>';}).join('')+'</tbody></table></div>':'')+
    '<div class="section-head"><h3>作业人员与资格校验</h3></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>人员</th><th>角色</th><th>所需证书</th><th>资格状态</th><th>校验时间</th></tr></thead><tbody>'+ 
    w.persons.map(function(p){return '<tr><td>'+p.user+'</td><td>'+p.role+'</td><td>'+(p.certRequired?(p.requiredCert||'按作业规则校验'):'不要求')+'</td>'+ 
      '<td>'+(p.qualification==='过期'?'<span class="tag tag-error">过期</span>':p.qualification==='有效'?'<span class="tag tag-green">有效</span>':'<span class="tag tag-warn">'+p.qualification+'</span>')+'</td><td>'+p.checkedAt+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    (w.qualificationFailed?'<div class="block-panel" style="margin-top:12px"><div class="bp-title">⛔ 资格校验阻断</div><table>'+
      w.persons.filter(function(p){return p.qualification==='过期';}).map(function(p){return '<tr><td>缺失证书</td><td><b>'+p.missingCert+'</b></td></tr>';}).join('')+
      '<tr><td>处理方式</td><td>在“培训与证书 → 证书管理”维护有效证书后重新校验，方可提交审核。 <button class="btn btn-text" onclick="openCertificateLedger(\''+w.id+'\')">前往证书管理</button></td></tr></table></div>':'')+
    '<div class="section-head"><h3>现场确认项（监护）</h3></div>'+
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>类型</th><th>确认内容</th><th>结果</th><th>确认人</th></tr></thead><tbody>'+
    w.checks.map(function(c){return '<tr><td>'+c.type+'</td><td>'+(c.check_text||c.text)+'</td><td>'+(c.result==='通过'?'<span class="tag tag-green">通过</span>':c.result==='不通过'?'<span class="tag tag-error">不通过</span>':'<span class="tag tag-gray">未确认</span>')+'</td><td>'+(c.checkedBy||'-')+'</td></tr>';}).join('')+
    '</tbody></table></div>'+
    '<div class="section-head"><h3>操作时间线</h3></div><ul class="timeline">'+
    w.actions.map(function(a){return '<li><div class="t-date">'+a.at+'</div><div class="t-title">'+a.type+'</div><div class="t-note">'+(a.note||'')+'</div><div class="t-actor">操作人：'+a.by+'</div></li>';}).join('')+'</ul>',
    {title:'作业票详情 · '+w.code,wide:true,
     footer:'<button class="btn btn-outline" data-close>关闭</button>'+
     (w.status==='资格校验失败'?'<button class="btn btn-primary" onclick="fixQualification(\''+w.id+'\')">补齐资格并重新校验</button>':'')+
     (w.status==='审批中'?'<button class="btn btn-primary" onclick="openApproval(\''+w.id+'\')">平台内审批：'+(w.currentApprovalNode||'审批')+'</button>':'')+
     ((w.status==='执行中'||w.status==='已暂停')?'<button class="btn btn-outline" onclick="requestExtension(\''+w.id+'\')">申请延期</button><button class="btn btn-outline" onclick="requestPermitChange(\''+w.id+'\')">变更重新申请</button>':'')+
     (w.status==='超时阻断'?'<button class="btn btn-primary" onclick="requestExtension(\''+w.id+'\')">申请延期</button>':'')+
     (w.status==='延期审批中'?'<button class="btn btn-primary" onclick="openExtensionApproval(\''+w.id+'\')">处理延期申请</button>':'')});
}
function stepIndexOf(status){

      safetyPlan:document.getElementById('wpPlan').value||'按标准作业方案执行。',emergencyPlan:'按应急预案执行。',
      persons:people,
      risks:[{id:uid(),ref:null,hazard:'作业过程危险因素',control:'按安全方案控制',confirmed:true}],
      checks:[{id:uid(),type:'隔离',text:'作业区域已隔离警戒',result:'未确认'},{id:uid(),type:'人员',text:'人员证书有效、监护人到位',result:'未确认'},{id:uid(),type:'防护',text:'劳保穿戴齐全',result:'未确认'}],
      actions:[{type:'创建',at:now(),by:App.currentUser(),note:'提交作业申请'}],
      qualificationFailed:false};
    App.workPermits.unshift(w);
    var result=App.permit.qualificationCheck(w.id);
    App.toast(result.ok?'作业票已创建，资格校验通过':'作业票已创建，但资格校验阻断，请维护有效证书后重新校验',result.ok?'success':'warn');
    document.querySelectorAll('.modal').forEach(function(n){n.remove();});
    route();
  };
}

/* ================= 作业类型 × 级别审批矩阵 ================= */
function openPermitRules(){
  var levels=['三级','二级','一级','特级'],rules=App.permitApprovalRules||{};
  UI.drawer('<div class="alert warn"><b>业务确认边界：</b>以下为可交互的演示默认矩阵，四类作业的正式审批岗位须由业务单位签字确认后再固化；集团监督检查不参与特殊作业审批。</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>作业类型</th>'+levels.map(function(x){return '<th>'+x+'</th>';}).join('')+'</tr></thead><tbody>'+Object.keys(TYPE_KEYS).map(function(key){var rule=rules[key]||{base:[],levels:{}};return '<tr><td><b>'+TYPE_KEYS[key]+'</b><br><span class="muted">固定前置：'+(rule.base||[]).join(' → ')+'</span></td>'+levels.map(function(level){var path=(rule.base||[]).concat((rule.levels||{})[level]||[]);return '<td><div>'+path.join(' → ')+'</div><button class="btn btn-text" onclick="openPermitRuleEditor(\''+key+'\',\''+level+'\')">编辑该级别</button></td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div>',{title:'特殊作业审批规则',wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'});
}
function openPermitRuleEditor(typeKey,level){
  var rule=(App.permitApprovalRules||{})[typeKey],selected=((rule&&rule.levels&&rule.levels[level])||[]),fixed=(rule&&rule.base)||[];
  UI.modal('<div class="alert info">固定前置节点：<b>'+fixed.join(' → ')+'</b>。以下只配置该作业级别的后续审批岗位。</div><div class="check-grid">'+(App.permitApprovalPostOptions||[]).filter(function(p){return fixed.indexOf(p)<0;}).map(function(p){return '<label><input type="checkbox" class="permitRulePost" value="'+p+'" '+(selected.indexOf(p)>-1?'checked':'')+'> '+p+'</label>';}).join('')+'</div><div class="field-hint">勾选顺序按页面岗位字典顺序生成。正式规则需业务确认，不应由原型自行决定。</div>',{title:TYPE_KEYS[typeKey]+' · '+level+'审批岗位',size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="permitRuleSave">保存演示规则</button>'});
  document.getElementById('permitRuleSave').onclick=function(){var posts=[].slice.call(document.querySelectorAll('.permitRulePost:checked')).map(function(n){return n.value;});if(!posts.length){App.toast('至少保留一个级别审批岗位','error');return;}App.permitApprovalRules[typeKey].levels[level]=posts;App.workPermits.forEach(function(w){w.approvalPath=App.approvalPathFor(w);if(w.status==='审批中')w.currentApprovalNode=w.approvalPath[w.approvalIndex||0]||null;});App.log('特殊作业','[审批规则演示配置] '+TYPE_KEYS[typeKey]+' '+level+' → '+posts.join(' → '));App._emit();document.querySelectorAll('.modal,.mask,.drawer').forEach(function(n){n.remove();});App.toast('演示审批规则已保存','success');openPermitRules();};
}

/* ================= 工具 ================= */
function dstr(){var d=new Date();return String(d.getFullYear())+pad(d.getMonth()+1)+pad(d.getDate());}
function pad(n){return String(n).padStart(2,'0');}
function seq(p){App._seq[p]=(App._seq[p]||0)+1;return String(App._seq[p]).padStart(2,'0');}
function now(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function uid(){return 'ID-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function mockPhoto(box){box.dataset.done='1';box.innerHTML='<span style="font-size:11px;color:#0B7A1C">✓ 已留证（模拟）</span>';box.style.borderColor='#00AA1C';box.style.background='#F0FFF2';}

/* ================= 路由 ================= */
function route(){
  if(tab==='ledger')viewLedger();
  else if(tab==='review')viewReview();
  else if(tab==='approve')viewApprove();
  else if(tab==='execute')viewExecute();
  else if(tab==='archived')viewArchived();
  else viewLedger();
}
window.openPermit=openPermit;window.openApproval=openApproval;window.doApproval=doApproval;window.requestPermitChange=requestPermitChange;window.requestExtension=requestExtension;window.submitExtension=submitExtension;window.openExtensionApproval=openExtensionApproval;window.doExtensionApproval=doExtensionApproval;
window.openGuardian=openGuardian;window.fixQualification=fixQualification;window.openCertificateLedger=openCertificateLedger;window.mockPhoto=mockPhoto;
window.doStart=doStart;window.confirmStart=confirmStart;window.doPause=doPause;window.doResume=doResume;window.doComplete=doComplete;window.doAccept=doAccept;
window.renderLedger=renderLedger;window.openCreatePermit=openCreatePermit;window.openPermitMap=openPermitMap;
window.openPermitRules=openPermitRules;window.openPermitRuleEditor=openPermitRuleEditor;
window.openGuardianStart=openGuardianStart;window.doArchive=doArchive;
window.drill=function(){};
route();
if(params.get('id'))setTimeout(function(){openPermit(params.get('id'));},0);
})();
</script>
