<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>安全知识库 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app"><div class="topbar"></div><div class="body"><aside class="sidebar"><div class="nav-tree"></div></aside><div class="content"><div class="page-header"></div><div class="page-body" id="pageBody"></div></div></div></div>
<script src="assets/store.js"></script><script src="assets/ui.js"></script>
<script>
(function(){
'use strict';
var q=new URLSearchParams(location.search),tab=q.get('tab')||'laws',body=document.getElementById('pageBody'),titles={laws:'法律法规',systems:'安全制度',search:'知识检索'};
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function now(){var d=new Date(),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
function uid(){return 'KD-'+Date.now().toString(36);}
function docsByTab(){var category=tab==='laws'?'法律法规':'安全制度';return (App.knowledgeDocs||[]).filter(function(d){return d.category===category;});}
function statusTag(s){return '<span class="tag '+(s==='现行有效'?'tag-green':'tag-gray')+'">'+esc(s)+'</span>';}
function renderList(){
  var rows=docsByTab();
  body.innerHTML='<div class="filter-bar"><div class="f-item">关键字 <input id="docKeyword" placeholder="名称、文号或发布单位"></div><div class="f-item">状态 <select id="docStatus"><option value="">全部</option><option>现行有效</option><option>已废止</option></select></div><button class="btn btn-outline btn-sm" onclick="filterDocs()">查询</button><button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openUpload()">+ 导入PDF文件</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>文档编号</th><th>名称</th><th>层级/发布单位</th><th>版本</th><th>生效日期</th><th>适用范围</th><th>页数</th><th>状态</th><th>操作</th></tr></thead><tbody id="docRows">'+tableRows(rows)+'</tbody></table></div><div class="hint-line">一期支持目录分类、文件查看和内容检索；真实 PDF 解析、OCR 和检索索引属于生产建设内容，当前为可交互原型。</div>';
}
function tableRows(rows){return rows.map(function(d){return '<tr><td class="mono">'+esc(d.code)+'</td><td><b>'+esc(d.title)+'</b><br><span class="muted">'+esc(d.fileName)+'</span></td><td>'+esc(d.level)+'<br><span class="muted">'+esc(d.issuer)+'</span></td><td>'+esc(d.version)+'</td><td>'+esc(d.effectiveDate)+'</td><td>'+esc(d.scope)+'</td><td>'+esc(d.pages)+'</td><td>'+statusTag(d.status)+'</td><td><button class="btn btn-text" onclick="openDoc(\''+d.id+'\')">查看</button></td></tr>';}).join('')||'<tr><td colspan="9">'+UI.empty('暂无文档')+'</td></tr>';}
window.filterDocs=function(){var keyword=document.getElementById('docKeyword').value.trim(),status=document.getElementById('docStatus').value,rows=docsByTab().filter(function(d){return (!keyword||(d.title+d.code+d.issuer).indexOf(keyword)>-1)&&(!status||d.status===status);});document.getElementById('docRows').innerHTML=tableRows(rows);};
window.openDoc=function(id){var d=(App.knowledgeDocs||[]).filter(function(x){return x.id===id;})[0];if(!d)return;UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">文档编号</span><span class="d-value mono">'+esc(d.code)+'</span></div><div class="d-item"><span class="d-label">分类</span><span class="d-value">'+esc(d.category)+'</span></div><div class="d-item full"><span class="d-label">名称</span><span class="d-value">'+esc(d.title)+'</span></div><div class="d-item"><span class="d-label">版本/状态</span><span class="d-value">'+esc(d.version)+' / '+statusTag(d.status)+'</span></div><div class="d-item"><span class="d-label">生效日期</span><span class="d-value">'+esc(d.effectiveDate)+'</span></div><div class="d-item"><span class="d-label">原始文件</span><span class="d-value">'+esc(d.fileName)+' · '+esc(d.pages)+' 页</span></div><div class="d-item"><span class="d-label">更新时间</span><span class="d-value">'+esc(d.updatedAt)+'</span></div></div><div class="section-head"><h3>内容条款</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th style="width:140px">条款</th><th>内容</th><th>操作</th></tr></thead><tbody>'+(d.clauses||[]).map(function(c){return '<tr><td>'+esc(c.no)+'</td><td>'+esc(c.text)+'</td><td><button class="btn btn-text" onclick="App.toast(\'已定位到 '+esc(c.no)+'（原型）\',\'success\')">定位原文</button></td></tr>';}).join('')+'</tbody></table></div>',{title:'知识文档详情',wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button><button class="btn btn-primary" onclick="App.toast(\'已打开原始 PDF 文件（原型）\',\'success\')">查看原始文件</button>'});};
window.openUpload=function(){var category=tab==='laws'?'法律法规':'安全制度';UI.modal('<div class="form-grid"><div class="form-item"><span class="form-label">文档分类</span><input id="upCategory" value="'+category+'" disabled></div><div class="form-item"><span class="form-label">文档编号 <span class="req">*</span></span><input id="upCode" placeholder="如 LAW-002"></div><div class="form-item full"><span class="form-label">文档名称 <span class="req">*</span></span><input id="upTitle"></div><div class="form-item"><span class="form-label">层级</span><select id="upLevel"><option>国家法律</option><option>行政法规</option><option>公司制度</option><option>二级单位制度</option></select></div><div class="form-item"><span class="form-label">发布单位</span><input id="upIssuer"></div><div class="form-item"><span class="form-label">版本</span><input id="upVersion" value="V1.0"></div><div class="form-item"><span class="form-label">生效日期</span><input id="upEffective" type="date" value="2026-08-23"></div><div class="form-item full"><span class="form-label">适用范围</span><input id="upScope" value="太原重工股份有限公司"></div><div class="form-item full"><span class="form-label">PDF 文件 <span class="req">*</span></span><div id="upFile" class="photo-box" style="height:56px" onclick="this.dataset.done=\'1\';this.innerHTML=\'<span style=color:#0B7A1C>✓ 已选择 PDF（模拟）</span>\'"><span>+ 选择 PDF 文件</span></div></div></div>',{title:'导入'+category,footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="upOk">保存并建立目录</button>'});document.getElementById('upOk').onclick=function(){var code=document.getElementById('upCode').value.trim(),title=document.getElementById('upTitle').value.trim(),file=document.getElementById('upFile');if(!code||!title||!file.dataset.done){App.toast('请填写编号、名称并选择 PDF 文件','error');return;}App.knowledgeDocs.unshift({id:uid(),code:code,category:category,title:title,level:document.getElementById('upLevel').value,issuer:document.getElementById('upIssuer').value.trim()||'待维护',publishDate:'2026-08-23',effectiveDate:document.getElementById('upEffective').value,version:document.getElementById('upVersion').value.trim()||'V1.0',status:'现行有效',fileName:title+'.pdf',pages:1,scope:document.getElementById('upScope').value.trim()||'当前组织',updatedAt:now(),clauses:[{no:'待解析',text:'PDF 内容将在生产环境完成解析和索引。'}]});App.persist();document.querySelectorAll('.modal').forEach(function(n){n.remove();});App.toast('文档目录已保存','success');renderList();};};
function renderSearch(){body.innerHTML='<div class="card"><div class="card-title">知识内容检索</div><div class="filter-bar"><div class="f-item" style="flex:1">检索内容 <input id="knowledgeQuery" value="安全风险分级管控" placeholder="输入条款、主题或关键字"></div><button class="btn btn-primary" onclick="runKnowledgeSearch()">检索</button></div><div class="hint-line">检索结果定位到文档及具体条款，点击可查看文档详情或定位原文。</div></div><div id="knowledgeResults" style="margin-top:14px"></div>';runKnowledgeSearch();}
window.runKnowledgeSearch=function(){var key=(document.getElementById('knowledgeQuery')||{}).value||'',results=[];(App.knowledgeDocs||[]).forEach(function(d){(d.clauses||[]).forEach(function(c){if(!key||((d.title+c.no+c.text).indexOf(key)>-1))results.push({doc:d,clause:c});});});document.getElementById('knowledgeResults').innerHTML=results.map(function(r){return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:12px"><div><b>'+esc(r.doc.title)+' · '+esc(r.clause.no)+'</b><p style="margin-top:8px;line-height:1.7">'+esc(r.clause.text)+'</p><span class="muted">'+esc(r.doc.category)+' / '+esc(r.doc.version)+' / '+esc(r.doc.status)+'</span></div><button class="btn btn-text" onclick="openDoc(\''+r.doc.id+'\')">查看原文</button></div></div>';}).join('')||UI.empty('未检索到相关条款');};
UI.renderShell('knowledge',tab);UI.pageHeader(['安全知识库',titles[tab]||'法律法规'],titles[tab]||'法律法规');if(tab==='search')renderSearch();else renderList();
})();
</script>
</body>
</html>
