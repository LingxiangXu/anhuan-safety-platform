<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风险管理 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
<style>
.risk-flow{display:flex;align-items:center;gap:8px;margin:0 0 16px;padding:12px 16px;background:#F5F9FF;border:1px solid #D9E8F7;border-radius:8px;color:#52677D;font-size:13px;overflow-x:auto}
.risk-flow .flow-node{display:flex;align-items:center;gap:7px;white-space:nowrap}
.risk-flow .flow-no{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#DCEAF8;color:#0A5CA8;font-weight:700}
.risk-flow .flow-node.active{color:#0A5CA8;font-weight:700}.risk-flow .flow-node.active .flow-no{background:#0A5CA8;color:#fff}
.risk-flow .flow-arrow{color:#9AAFC4}
.risk-context{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:14px;padding:12px 16px;background:#fff;border:1px solid #E2E8F0;border-left:4px solid #0A5CA8;border-radius:8px}
.risk-context .main{font-weight:700;color:#16324F}.risk-context .sub{margin-top:4px;font-size:12px;color:#64748B}
.risk-section-title{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:17px;font-weight:700;color:#16324F}
.risk-section-title .no{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;background:#0A5CA8;color:#fff;font-size:14px}
.risk-form-actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid #E5EAF0}
.formula-panel{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;margin-top:12px;padding:14px 16px;background:#F7FAFC;border:1px solid #D8E3EE;border-radius:8px}
.formula-panel .formula{font-size:15px;font-weight:700;color:#16324F}.formula-panel .formula-note{margin-top:5px;font-size:12px;color:#64748B}
.measure-grid{display:grid;grid-template-columns:130px minmax(280px,1fr) 110px 110px;gap:10px;align-items:center;margin-bottom:10px}
.measure-grid-simple{grid-template-columns:130px minmax(280px,1fr)}
.measure-grid .measure-type{font-weight:700;color:#334155}
.tier-grid{display:grid;grid-template-columns:120px minmax(180px,1fr) minmax(140px,1fr) 150px;gap:10px;align-items:center;margin-bottom:10px}
.tier-grid.head{font-size:12px;font-weight:700;color:#64748B}
.accident-checks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:10px 12px;border:1px solid var(--gray-300);border-radius:6px;background:#fff}
.accident-checks label{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--gray-700);cursor:pointer}.accident-checks input{width:auto;margin:0}
.approval-phrases{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:7px 0 8px}.approval-phrases .label{font-size:12px;color:var(--gray-500)}
@media(max-width:1100px){.measure-grid{grid-template-columns:120px 1fr}.measure-grid .measure-options{grid-column:2}.tier-grid{grid-template-columns:110px 1fr 1fr}.tier-grid .tier-frequency{grid-column:2/4}}
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <div class="content">
      <div class="page-header"></div>
      <div class="page-body" id="pageBody"></div>
    </div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
"use strict";
var params=new URLSearchParams(location.search);
var tab=params.get("tab")||"overview";
var mode=params.get("mode")||"";
var risk=App.risk.byId(params.get("risk")||"R-001")||App.risks[0];
var body=document.getElementById("pageBody");

UI.renderShell("risks",tab);
var TITLES={overview:["风险总览"],ledger:["风险台账"],map:["风险四色图"],notice:["风险告知"],changes:["变更复评"]};
function statusTag(s){var c={草稿:'tag-gray',辨识中:'tag-blue',待完善:'tag-warn',已退回:'tag-error',待作业区负责人审核:'tag-warn',待二级单位安全管理审核:'tag-warn',待二级单位领导审批:'tag-warn',当前生效:'tag-green',已生效:'tag-green',已发布:'tag-green',已完成:'tag-green',审批中:'tag-warn',管控中:'tag-green'};return '<span class="tag '+(c[s]||'tag-gray')+'">'+(s||'-')+'</span>';}
function assessmentTag(s){var c={待完善:'tag-warn',已完成:'tag-green'};return '<span class="tag '+(c[s]||'tag-gray')+'">'+(s||'待完善')+'</span>';}
function isCurrentRisk(r){return !!(r&&r.currentVersion&&(r.hazards||[]).length);}
var pageTitle=(TITLES[tab]||TITLES.overview)[0];
UI.pageHeader(["风险管理",pageTitle],pageTitle,"");

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
var ORG_USERS=[
  {name:'张青',org:'铸锻件分公司',dept:'造型作业区 / 自动线组',post:'班组长'},
  {name:'王欣宇',org:'铸锻件分公司',dept:'造型作业区 / 自动线组',post:'兼职安全员'},
  {name:'李天翔',org:'铸锻件分公司',dept:'造型作业区 / 自动线组',post:'班组成员'},
  {name:'高远',org:'铸锻件分公司',dept:'造型作业区 / 自动线组',post:'班组成员'},
  {name:'李建杰',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组长'},
  {name:'赵志宏',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'兼职安全员'},
  {name:'张明',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'常兴明',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'李刚',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'郭海涛',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'李涛',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'郭勇',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'刘化利',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'郝利强',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'梁博文',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'王宝胜',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'杨天财',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'郭刚明',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'路宁',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'范利君',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'詹志星',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'刘翔',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'},
  {name:'张鹏伟',org:'铸锻件分公司',dept:'造型作业区 / 制模组',post:'班组成员'}
];
function ensureOrgUserOptions(){
  if(document.getElementById('orgUserOptions'))return;
  var dl=document.createElement('datalist');dl.id='orgUserOptions';
  dl.innerHTML=ORG_USERS.map(function(u){return '<option value="'+esc(u.name)+'" label="'+esc(u.org+' / '+u.dept+' / '+u.post)+'"></option>';}).join('');
  document.body.appendChild(dl);
}
function personInput(id,value,editable,extra){
  ensureOrgUserOptions();
  return '<input list="orgUserOptions" id="'+id+'" value="'+esc(value||'')+'" '+(editable?'':'disabled')+' placeholder="可搜索姓名、部门或岗位" '+(extra||'')+'>';
}
function applyOrgUserPickers(){
  ensureOrgUserOptions();
  document.querySelectorAll('#taskOwner,#rpOwner,#wbRiskOwner,#hazardOwner,#mDuty,#mExec,#rfOwner,#eRiskOwner,[id^="tierPerson"]').forEach(function(input){
    input.setAttribute('list','orgUserOptions');
    if(!input.getAttribute('placeholder'))input.setAttribute('placeholder','可搜索姓名、部门或岗位');
  });
}
function orgUserOf(name){return ORG_USERS.filter(function(u){return u.name===String(name||'').trim();})[0]||null;}
var orgUserPickerObserver=new MutationObserver(applyOrgUserPickers);
orgUserPickerObserver.observe(document.body,{childList:true,subtree:true});
function taskById(id){return App.riskTasks.filter(function(t){return t.id===id;})[0]||null;}
function taskRiskIds(t){
  if(!t)return [];
  var ids=(t.riskIds||[]).slice();
  if(t.riskId&&ids.indexOf(t.riskId)<0)ids.push(t.riskId);
  if(!ids.length&&(t.code==='TASK-ZX-2026-001'||t.code==='TASK-ZX-2026-002'))ids.push('R-001');
  return ids;
}
function risksForTask(t){var ids=taskRiskIds(t);return App.risks.filter(function(r){return ids.indexOf(r.id)>-1;});}
function taskForRisk(riskId){var ts=App.riskTasks.filter(function(t){return taskRiskIds(t).indexOf(riskId)>-1;}),active=ts.filter(function(t){return ['已完成','已生效'].indexOf(t.status)<0;});return active[0]||ts[0]||null;}
var RESPONSIBILITY_POSTS=['班组长','分公司负责人','总经理','公司领导'];
function responsibilityPostOptions(selected){return RESPONSIBILITY_POSTS.map(function(x){return '<option '+(x===selected?'selected':'')+'>'+x+'</option>';}).join('');}
function riskPointView(r){var d=r&&r.draftVersion||{};return {name:d.riskName!==undefined?d.riskName:r&&r.name,org:d.org!==undefined?d.org:r&&r.org,location:d.location!==undefined?d.location:r&&r.location,category:d.category!==undefined?d.category:r&&r.category,responsibilityPost:d.responsibilityPost!==undefined?d.responsibilityPost:(r&&r.responsibilityPost||'班组长'),boundaryDescription:d.boundaryDescription!==undefined?d.boundaryDescription:r&&r.boundaryDescription};}
function riskFlow(active){var names=['风险点建档','危险源辨识','风险评价','管控措施','责任落实','风险点审批'];return '<div class="risk-flow">'+names.map(function(n,i){return '<div class="flow-node '+(active===i+1?'active':'')+'"><span class="flow-no">'+(i+1)+'</span><span>'+n+'</span></div>'+(i<names.length-1?'<span class="flow-arrow">›</span>':'');}).join('')+'</div>';}
function setRiskHeader(title,crumbs,actions){UI.pageHeader(crumbs||['风险管理','风险台账',title],title,actions||'');}
function taskQuery(modeName,taskId,riskId,hazardId){var s='risks.html?tab=ledger&mode='+modeName;if(riskId)s+='&risk='+encodeURIComponent(riskId);if(hazardId)s+='&hazard='+encodeURIComponent(hazardId);return s;}

/* ================= 风险总览 ================= */
function viewOverview(){
  var current=App.risks.filter(isCurrentRisk);
  var major=current.filter(function(r){return r.level==="major"||r.level==="big";}).length;
  var measures=current.reduce(function(s,r){return s+(r.hazards||[]).reduce(function(a,h){return a+(h.measures||[]).length;},0);},0);
  body.innerHTML=
  '<div class="kpi-grid g3">'+
    '<div class="kpi clickable" onclick="drill(\'风险点总数\')"><div class="k-label">风险点总数</div><div class="k-num blue">'+current.length+'</div><div class="k-sub">当前生效口径</div></div>'+ 
    '<div class="kpi clickable" onclick="drill(\'重大/较大风险\')"><div class="k-label">重大/较大风险</div><div class="k-num danger">'+major+'</div><div class="k-sub">当前正式版本口径</div></div>'+ 
    '<div class="kpi clickable" onclick="drill(\'管控措施总数\')"><div class="k-label">管控措施总数</div><div class="k-num green">'+measures+'</div><div class="k-sub">当前生效版本措施</div></div>'+ 
  '</div>'+ 
  '<div class="grid-2-1" style="margin-top:16px">'+
    '<div class="card"><div class="card-title">风险点台账一览</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>风险点编号</th><th>风险点名称</th><th>作业区</th><th>危险源数</th><th>最高等级</th><th>当前版本</th><th>状态</th></tr></thead><tbody>'+ 
    current.map(function(r){return '<tr style="cursor:pointer" onclick="location.href=\'risks.html?tab=ledger&risk='+r.id+'\'"><td class="mono">'+r.code+'</td><td>'+r.name+'</td><td>'+r.org+'</td><td>'+r.hazards.length+'</td><td>'+UI.tagOf(r.level)+'</td><td>'+r.version+'</td><td>'+statusTag('当前生效')+'</td></tr>';}).join('')+
    '</tbody></table></div></div>'+ 
    '<div class="card"><div class="card-title">风险管理入口</div><div style="display:flex;flex-direction:column;gap:10px">'+ 
      '<button class="btn btn-primary" onclick="location.href=\'risks.html?tab=ledger\'">查看风险台账</button>'+ 
      '<button class="btn btn-outline" onclick="location.href=\'risks.html?tab=map\'">🗺 查看风险四色图</button>'+ 
      '<button class="btn btn-outline" onclick="location.href=\'risks.html?tab=notice\'">岗位风险告知卡</button>'+ 
      '<button class="btn btn-outline" onclick="location.href=\'risks.html?tab=changes\'">风险变更/人工复评</button>'+ 
    '</div></div>'+ 
  '</div>';
}

/* ================= 风险台账 ================= */
function viewLedger(){
  var riskParam=params.get("risk");
  body.innerHTML=
  '<div class="filter-bar risk-filter-grid">'+
    '<div class="f-item">编号 <input id="fCode" placeholder="风险点编号"></div>'+
    '<div class="f-item">名称 <input id="fName" placeholder="风险点名称"></div>'+
    '<div class="f-item">组织 <select id="fOrg"><option value="">全部</option><option value="造型作业区">造型作业区</option><option value="智能加工配送中心">智能加工配送中心</option></select></div>'+ 
    '<div class="f-item">位置 <input id="fLocation" placeholder="区域/位置"></div>'+
    '<div class="f-item">类别 <select id="fCategory"><option value="">全部</option><option>设备设施风险</option><option>作业活动风险</option><option>环境风险</option><option>管理风险</option></select></div>'+
    '<div class="f-item">等级 <select id="fLevel"><option value="">全部</option><option value="major">重大</option><option value="big">较大</option><option value="common">一般</option><option value="low">低</option></select></div>'+
    '<div class="f-item">状态 <select id="fStatus"><option value="">全部</option><option>草稿</option><option>已退回</option><option>待作业区负责人审核</option><option>待二级单位安全管理审核</option><option>待二级单位领导审批</option><option>管控中</option></select></div>'+
    '<div class="f-item">版本 <input id="fVersion" placeholder="如 V1.0"></div>'+
    '<button class="btn btn-outline btn-sm" onclick="applyFilter()">查询</button><button class="btn btn-text btn-sm" onclick="resetFilters()">重置</button>'+ 
    '<button class="btn btn-primary btn-sm" style="margin-left:auto" onclick="openRiskForm()">+ 新建风险点</button>'+ 
  '</div>'+
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>编号</th><th>名称</th><th>位置</th><th>危险源数量</th><th>风险最高等级</th><th>版本</th><th>状态</th><th>操作</th></tr></thead><tbody id="ledgerBody">'+
  '</tbody></table></div>'+
  '<div class="hint-line">点击「危险源」查看明细；支持跨模块下钻（驾驶舱重大风险 → 本页自动筛选重大）。</div>';
  renderLedger(params.get("level"));
  if(riskParam){var r=App.risk.byId(riskParam);if(r)openRiskDetail(r.id);}
}
function renderLedger(level){
  var requested=level||params.get("level")||"";
  if(document.getElementById("fLevel")&&requested&&requested!=="high"&&!document.getElementById("fLevel").value)document.getElementById("fLevel").value=requested;
  var code=document.getElementById("fCode")?document.getElementById("fCode").value.trim().toLowerCase():"";
  var name=document.getElementById("fName")?document.getElementById("fName").value.trim().toLowerCase():"";
  var lv=document.getElementById("fLevel")?document.getElementById("fLevel").value:"";
  var og=document.getElementById("fOrg")?document.getElementById("fOrg").value:"";
  var loc=document.getElementById("fLocation")?document.getElementById("fLocation").value.trim().toLowerCase():"";
  var cat=document.getElementById("fCategory")?document.getElementById("fCategory").value:"";
  var st=document.getElementById("fStatus")?document.getElementById("fStatus").value:"";
  var ver=document.getElementById("fVersion")?document.getElementById("fVersion").value.trim().toLowerCase():"";
  var rows=App.risks.filter(function(r){var levelMatch=requested==="high"?["major","big"].indexOf(r.level)>-1:(!lv||r.level===lv);return (!App.inCurrentOrgScope||App.inCurrentOrgScope(r.org))&&(!code||r.code.toLowerCase().indexOf(code)>-1)&&(!name||r.name.toLowerCase().indexOf(name)>-1)&&levelMatch&&(!og||r.org===og)&&(!loc||String(r.location||"").toLowerCase().indexOf(loc)>-1)&&(!cat||r.category===cat)&&(!st||rsOf(r)===st)&&(!ver||String(r.version||"").toLowerCase().indexOf(ver)>-1);});
  document.getElementById("ledgerBody").innerHTML=rows.map(function(r){
    return '<tr><td class="mono">'+r.code+'</td><td>'+r.name+'</td><td>'+r.location+'</td>'+ 
    '<td style="text-align:center"><button class="btn btn-text" onclick="openRiskDetail(\''+r.id+'\')">'+r.hazards.length+' 条 ▸</button></td>'+ 
    '<td>'+UI.tagOf(r.level)+'</td><td>'+(r.draftVersion?r.draftVersion.version:r.version)+'</td>'+ 
    '<td>'+riskStatusCell(r)+'</td>'+ 
    '<td>'+opBtn(r)+'</td></tr>';
  }).join('')||UI.empty('暂无符合条件风险点');
}
function rsOf(r){return r&&r.draftVersion?r.draftVersion.status:(r&&r.status==="已发布"?"管控中":r&&r.status||"草稿");}
function draftEditable(r){return !!(r&&r.draftVersion&&["草稿","已退回"].indexOf(r.draftVersion.status)>-1);}
function applyFilter(){renderLedger();App.toast('筛选条件已应用');}
function resetFilters(){['fCode','fName','fLocation','fVersion'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});['fOrg','fCategory','fLevel','fStatus'].forEach(function(id){var e=document.getElementById(id);if(e)e.value='';});renderLedger();App.toast('筛选条件已重置');}

var MEASURE_TYPES=["管理措施","工程技术措施","培训教育措施","个体防护措施","应急处置措施"];
var ACCIDENT_TYPES=["物体打击","车辆伤害","机械伤害","起重伤害","触电","淹溺","灼烫","火灾","高处坠落","坍塌","冒顶片帮","透水","放炮","火药爆炸","瓦斯爆炸","锅炉爆炸","容器爆炸","其他爆炸","中毒和窒息","其他伤害","粉尘爆炸","危险化学品泄漏","压力伤害","辐射伤害","冻伤","噪声伤害","环境污染"];
function accidentOptions(selected){return '<option value="">请选择事故类型</option>'+ACCIDENT_TYPES.map(function(x){return '<option '+(x===selected?'selected':'')+'>'+x+'</option>';}).join('');}
function accidentValues(value){
  if(value&&value.accidentTypes)value=value.accidentTypes;
  else if(value&&typeof value==='object')value=value.accidentType;
  if(Array.isArray(value))return value.filter(function(x){return ACCIDENT_TYPES.indexOf(x)>-1;});
  return String(value||'').split(/[、,，;；]/).map(function(x){return x.trim();}).filter(function(x,i,a){return ACCIDENT_TYPES.indexOf(x)>-1&&a.indexOf(x)===i;});
}
function accidentText(value){var values=accidentValues(value);return values.length?values.join('、'):'-';}
function accidentChecklist(selected,disabled){var values=accidentValues(selected);return '<div class="accident-checks">'+ACCIDENT_TYPES.map(function(x){return '<label><input type="checkbox" data-accident value="'+esc(x)+'" '+(values.indexOf(x)>-1?'checked':'')+' '+(disabled?'disabled':'')+'> '+esc(x)+'</label>';}).join('')+'</div><span class="field-hint">可多选；同一评价条件共用一次评价，条件或措施明显不同应拆分危险源。</span>';}

    '<div class="form-item"><span class="form-label">后果严重程度 C</span><select id="evalC" '+(locked?'disabled':'')+'>'+[1,3,7,15].map(function(v){return '<option value="'+v+'" '+(h.C===v?'selected':'')+'>'+v+'</option>';}).join('')+'</select></div>'+

function recalcRiskEvaluation(){var L=+document.getElementById('evalL').value,E=+document.getElementById('evalE').value,C=+document.getElementById('evalC').value,D=L*E*C,l=levelOf(D);document.getElementById('evalFormula').textContent='D = '+L+' × '+E+' × '+C+' = '+D;document.getElementById('evalLevel').innerHTML=UI.tagOf(l.key);}

function saveHazardControls(h,r){
  var measures=[];
  CONTROL_TYPES.forEach(function(x,i){var text=document.getElementById('ctrlText'+i).value.trim(),old=measureForType(h,x.key);if(!text)return;measures.push(Object.assign(old||{id:uid(),status:'待落实',checked:false,evidence:'检查记录、现场照片或台账'}, {name:text,type:x.key,generateInspection:false,generateSpecialWork:false}));});
  if(!measures.some(function(m){return m.type==='管理措施';})){App.toast('当前危险源必须填写管理措施','error');return false;}
  App.risk.saveMeasures(r.id,h.id,measures);return true;
}

function saveRiskEvaluation(submit){
  var r=App.risk.byId(params.get('risk')),h=r&&App.risk.hazardById(r.id,params.get('hazard'));
  if(!r||!h||!draftEditable(r)){App.toast('当前风险点版本不可编辑','error');return;}
  var payload={L:+document.getElementById('evalL').value,E:+document.getElementById('evalE').value,C:+document.getElementById('evalC').value,direct:document.getElementById('evalDirect').checked,note:(document.getElementById('evalDirectNote')||{}).value||''};
  if(payload.direct&&!payload.note.trim()){App.toast('直接判定重大风险必须填写判定依据','error');return;}
  if(!saveHazardControls(h,r))return;
  var saved=App.risk.saveAssessmentDraft(r.id,h.id,payload);if(!saved||!saved.ok)return;
  if(submit){h.assessmentStatus='已完成';if(App._emit)App._emit();App.toast('当前危险源评价和管控措施已完成','success');location.href=taskQuery('hazards','',r.id);}else viewHazardEvaluation();
}

function renderWorkbench(){

  '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">'+

    ((pending.length||incomplete.length)>0? 
      '<div class="block-panel" style="margin-top:16px"><div class="bp-title">提交校验未通过</div><table>'+(pending.length?'<tr><td>风险评价</td><td><b>'+pending.length+' 条危险源评价未完成</b>（'+pending.map(function(x){return x.name;}).join('；')+'）。</td></tr>':'')+(incomplete.length?'<tr><td>责任完整度</td><td><b>'+incomplete.length+' 条危险源责任未完成</b>（'+incomplete.map(function(x){return x.name;}).join('；')+'）。请返回责任确认定位。</td></tr>':'')+'</table></div>': 
      '<div class="alert green" style="margin-top:16px">全部危险源评价完成且责任完整，可以统一提交整个风险点审核。</div>')+ 
    '<div style="margin-top:20px;display:flex;justify-content:space-between">'+ 
      '<button class="btn btn-outline" onclick="wb.step=5;renderWorkbench()">← 上一步</button>'+

    '<div class="hint-line">危险源不独立审批。班组长提交整个风险点；作业区负责人、二级单位安全管理人员依次审核，较大/重大风险再由二级单位领导审批。风险审批全程在平台内完成。</div>';

function assessmentTag(status){var map={草稿:'tag-gray','待评价':'tag-gray','待完善':'tag-warn','已完成':'tag-green'};return '<span class="tag '+(map[status]||'tag-gray')+'">'+(status||'待完善')+'</span>';}
function switchHazard(i){var wv=App.risk.workVersion(wb.riskId)||risk,h=wv.hazards[i];if(!h)return;wb.hazardIdx=i;wb.step=3;history.replaceState(null,'','risks.html?tab=tasks&wb=1&risk='+encodeURIComponent(wb.riskId)+'&hazard='+encodeURIComponent(h.id));renderWorkbench();}

{document.querySelectorAll('.modal.show').forEach(function(x){x.remove();});renderWorkbench();}};

function deleteHazard(){
  if(!draftEditable(App.risk.byId(wb.riskId))){App.toast('当前版本已提交审批或已生效，只读，请先处理退回意见或发起变更复评','warn');return;}

function recalc(){

function route(){
  if(tab==='tasks'){location.replace('risks.html?tab=ledger');return;}
  if(['task-form','risk-point','hazards','hazard-form','evaluate'].indexOf(mode)>-1){openRiskForm(params.get('risk'));return;}
  if(params.get('wb')==='1'){location.replace(taskQuery('hazards','',params.get('risk')||'',params.get('hazard')||''));return;}
  if(tab==='overview')viewOverview();
  else if(tab==='ledger')viewLedger();
  else if(tab==='tasks')viewTasks();
  else if(tab==='map')viewMap();
  else if(tab==='notice')viewNotice();
  else if(tab==='changes')viewChanges();
  else viewOverview();
}

document.addEventListener('change',function(e){
  if(e.target.id==='fL'||e.target.id==='fE'||e.target.id==='fC')recalc();
  if(e.target.id==='evalL'||e.target.id==='evalE'||e.target.id==='evalC')recalcRiskEvaluation();
  if(e.target.id==='fDirect'){
    var w=document.getElementById('directNoteWrap');
    if(w)w.style.display=e.target.checked?'':'none';
  }
  if(e.target.id==='evalDirect'){
    var ew=document.getElementById('evalDirectWrap');
    if(ew)ew.style.display=e.target.checked?'':'none';
  }
});

      App.toast('草稿已保存，可继续维护危险源','success');
    }
  };
}
function deleteRisk(riskId){var r=App.risk.byId(riskId);if(!r)return;if(rsOf(r)==='当前生效'){App.toast('已生效风险点不可物理删除，请发起变更/复评或停用','error');return;}if(confirm('确认删除草稿风险点 '+r.code+'？危险源、评价和措施将一并删除。')){App.risk.deleteRisk(riskId);viewLedger();}}

function pad(n){return String(n).padStart(2,'0');}
function uid(){return 'ID-'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function now(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes());}
function levelOf(D){return App._levelOf?App._levelOf(D):{key:D>=320?'major':D>=160?'big':D>=70?'common':'low',name:D>=320?'重大':D>=160?'较大':D>=70?'一般':'低'};}
