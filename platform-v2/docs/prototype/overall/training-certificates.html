<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>培训与证书 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <div class="content">
      <div class="page-header"></div>
      <div class="page-body" id="pageBody"></div>
    </div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
"use strict";
var params=new URLSearchParams(location.search),tab=params.get("tab")||"records",body=document.getElementById("pageBody");
var TITLES={records:"培训记录",certificates:"证书管理"};
UI.renderShell("training",tab);
UI.pageHeader(["培训与证书",TITLES[tab]],TITLES[tab],tab==="records"?'<button class="btn btn-outline" onclick="openTrainingSyncLog()">查看同步记录</button><button class="btn btn-primary" onclick="syncTraining()">同步培训记录</button>':'<button class="btn btn-primary" onclick="openCertForm()">+ 新增证书</button>');

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
function certStatus(c){c.status=App.certificate.statusOf(c);return c.status;}
function statusTag(s){return s==="有效"?'<span class="tag tag-green">有效</span>':s==="临期"?'<span class="tag tag-warn">临期</span>':'<span class="tag tag-error">已过期</span>';}
function canManage(){return ["platform_admin","company_safety"].indexOf(App.currentRole)>-1;}
function orgOf(user){var team=(App.teams||[]).filter(function(t){return (t.members||[]).indexOf(user)>-1;})[0];return team?("造型作业区 / "+team.name):"待同步组织";}
function personOptions(){return App.directoryPeople().map(function(n){return '<option value="'+esc(n)+'">'+esc(orgOf(n))+'</option>';}).join("");}
function inScope(org){var leaf=(App.currentOrg||"").split(" / ").pop();if(["自动线组","制模组"].indexOf(leaf)>-1)return String(org||"").indexOf(leaf)>-1;return leaf==="智能加工配送中心"?String(org||"").indexOf(leaf)>-1:true;}

function viewRecords(){
  var records=App.trainingRecords.filter(function(x){return inScope(x.org);}),people={};records.forEach(function(x){people[x.user]=1;});
  body.innerHTML='<div class="alert info">培训记录由培训中心同步，安全管理平台只读展示，不在本模块创建课程、组织考试或修改培训结果。</div>'+ 
    '<div class="kpi-grid g4"><div class="kpi"><div class="k-label">培训记录</div><div class="k-num blue">'+records.length+'</div><div class="k-sub">当前组织范围</div></div><div class="kpi"><div class="k-label">参训人数</div><div class="k-num green">'+Object.keys(people).length+'</div><div class="k-sub">按人员去重</div></div><div class="kpi"><div class="k-label">培训学时</div><div class="k-num">'+records.reduce(function(s,x){return s+(+x.hours||0);},0)+'</div><div class="k-sub">已完成记录合计</div></div><div class="kpi"><div class="k-label">最近同步</div><div class="k-num" style="font-size:17px">'+esc(App.trainingSyncAt||"未同步")+'</div><div class="k-sub">来源：培训中心</div></div></div>'+ 
    '<div class="filter-bar" style="margin-top:16px"><div class="f-item">关键词 <input id="trKeyword" placeholder="姓名、课程或记录编号"></div><div class="f-item">培训类型 <select id="trType"><option value="">全部</option><option>三级安全教育</option><option>岗位安全培训</option><option>专项培训</option><option>安全管理培训</option></select></div><div class="f-item">结果 <select id="trResult"><option value="">全部</option><option>合格</option><option>不合格</option></select></div><button class="btn btn-outline btn-sm" onclick="renderRecords()">查询</button></div>'+ 
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>记录编号</th><th>人员/组织</th><th>培训课程</th><th>培训类型</th><th>完成日期</th><th>学时</th><th>结果</th><th>来源</th><th>操作</th></tr></thead><tbody id="trainingRows"></tbody></table></div>';
  renderRecords();
}
function renderRecords(){
  var key=(document.getElementById("trKeyword")||{}).value||"",type=(document.getElementById("trType")||{}).value||"",result=(document.getElementById("trResult")||{}).value||"";
  key=key.trim().toLowerCase();var rows=App.trainingRecords.filter(function(x){return inScope(x.org)&&(!type||x.type===type)&&(!result||x.result===result)&&(!key||[x.code,x.user,x.course].join(" ").toLowerCase().indexOf(key)>-1);});
  document.getElementById("trainingRows").innerHTML=rows.map(function(x){return '<tr><td class="mono">'+esc(x.code)+'</td><td><b>'+esc(x.user)+'</b><br><span class="muted">'+esc(x.org)+'</span></td><td>'+esc(x.course)+'</td><td>'+esc(x.type)+'</td><td>'+esc(x.endDate)+'</td><td>'+esc(x.hours)+' 学时</td><td><span class="tag tag-green">'+esc(x.result)+'</span></td><td>'+esc(x.source)+'</td><td><button class="btn btn-text" onclick="openTraining(\''+x.id+'\')">详情</button></td></tr>';}).join("")||'<tr><td colspan="9">'+UI.empty("暂无符合条件的培训记录")+'</td></tr>';
}
function openTraining(id){var x=App.training.byId(id);if(!x)return;UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">培训记录编号</span><span class="d-value">'+esc(x.code)+'</span></div><div class="d-item"><span class="d-label">来源记录编号</span><span class="d-value">'+esc(x.sourceRecordId)+'</span></div><div class="d-item"><span class="d-label">参训人员</span><span class="d-value">'+esc(x.user)+'</span></div><div class="d-item"><span class="d-label">所属组织</span><span class="d-value">'+esc(x.org)+'</span></div><div class="d-item full"><span class="d-label">培训课程</span><span class="d-value">'+esc(x.course)+'</span></div><div class="d-item"><span class="d-label">培训类型</span><span class="d-value">'+esc(x.type)+'</span></div><div class="d-item"><span class="d-label">培训方式</span><span class="d-value">'+esc(x.method)+'</span></div><div class="d-item"><span class="d-label">培训时间</span><span class="d-value">'+esc(x.startDate)+' 至 '+esc(x.endDate)+'</span></div><div class="d-item"><span class="d-label">培训学时</span><span class="d-value">'+esc(x.hours)+' 学时</span></div><div class="d-item"><span class="d-label">成绩</span><span class="d-value">'+esc(x.score)+' / '+esc(x.result)+'</span></div><div class="d-item"><span class="d-label">数据来源</span><span class="d-value">'+esc(x.source)+'</span></div></div>',{title:"培训记录详情 · "+x.code,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}
function syncTraining(){var result=App.training.sync();viewRecords();if(result&&result.batch)setTimeout(function(){openTrainingSyncBatch(result.batch.id);},0);}
function openTrainingSyncLog(){var rows=App.trainingSyncBatches||[];UI.drawer('<div class="alert info">每次从培训中心同步均生成批次记录；人员匹配或必填字段失败时保留异常明细，培训结果仍只读。</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>同步批次</th><th>同步时间</th><th>总数</th><th>成功</th><th>失败</th><th>状态</th><th>操作</th></tr></thead><tbody>'+rows.map(function(x){return '<tr><td class="mono">'+esc(x.id)+'</td><td>'+esc(x.syncAt)+'</td><td>'+x.total+'</td><td><span class="tag tag-green">'+x.success+'</span></td><td><span class="tag '+(x.failed?'tag-error':'tag-gray')+'">'+x.failed+'</span></td><td><span class="tag '+(x.failed?'tag-warn':'tag-green')+'">'+esc(x.status)+'</span></td><td><button class="btn btn-text" onclick="openTrainingSyncBatch(\''+x.id+'\')">查看批次</button></td></tr>';}).join('')+'</tbody></table></div>',{title:'培训中心同步记录',wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}
function openTrainingSyncBatch(id){var x=(App.trainingSyncBatches||[]).filter(function(b){return b.id===id;})[0];if(!x)return;var exceptions=x.exceptions||[];UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">同步批次</span><span class="d-value mono">'+esc(x.id)+'</span></div><div class="d-item"><span class="d-label">同步时间</span><span class="d-value">'+esc(x.syncAt)+'</span></div><div class="d-item"><span class="d-label">来源</span><span class="d-value">'+esc(x.source)+'</span></div><div class="d-item"><span class="d-label">结果</span><span class="d-value">总数 '+x.total+'；成功 '+x.success+'；失败 '+x.failed+'</span></div></div><div class="section-head"><h3>异常明细</h3></div>'+(exceptions.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>来源记录号</th><th>人员</th><th>失败原因</th><th>处理状态</th></tr></thead><tbody>'+exceptions.map(function(e){return '<tr><td class="mono">'+esc(e.sourceRecordId)+'</td><td>'+esc(e.personName)+'</td><td>'+esc(e.reason)+'</td><td><span class="tag tag-warn">'+esc(e.status)+'</span></td></tr>';}).join('')+'</tbody></table></div>':UI.empty('本批次无同步异常')),{title:'培训同步批次 · '+x.id,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}

function viewCertificates(){
  App.certificate.refresh();var certs=App.certs.filter(function(x){return inScope(x.org);}),fromPermit=params.get("fromPermit");
  var stat={valid:0,warning:0,expired:0};certs.forEach(function(c){var s=certStatus(c);if(s==="有效")stat.valid++;else if(s==="临期")stat.warning++;else stat.expired++;});
  body.innerHTML=(fromPermit?'<div class="alert warn">来自特殊作业资格阻断：请维护人员有效证书，完成后返回作业票重新执行资格校验。 <button class="btn btn-text" onclick="backToPermit()">返回作业票</button></div>':'')+
    '<div class="alert info">人员及组织来自企业微信，证书信息由安全管理平台维护。临期、过期状态参与驾驶舱预警，并作为特殊作业提交和开工前的资格校验依据。</div>'+ 
    '<div class="kpi-grid g4"><div class="kpi clickable" onclick="setCertStatus(\'\')"><div class="k-label">证书总数</div><div class="k-num blue">'+certs.length+'</div><div class="k-sub">点击查看全部</div></div><div class="kpi clickable" onclick="setCertStatus(\'有效\')"><div class="k-label">有效</div><div class="k-num green">'+stat.valid+'</div><div class="k-sub">当前有效证书</div></div><div class="kpi clickable" onclick="setCertStatus(\'临期\')"><div class="k-label">临期</div><div class="k-num warn">'+stat.warning+'</div><div class="k-sub">90天内到期</div></div><div class="kpi clickable" onclick="setCertStatus(\'已过期\')"><div class="k-label">已过期</div><div class="k-num danger">'+stat.expired+'</div><div class="k-sub">可阻断特殊作业</div></div></div>'+ 
    '<div class="filter-bar" style="margin-top:16px"><div class="f-item">关键词 <input id="certKeyword" placeholder="人员、证书或编号"></div><div class="f-item">证书状态 <select id="certStatus"><option value="">全部</option><option>有效</option><option>临期</option><option>已过期</option></select></div><div class="f-item">证书类型 <select id="certType"><option value="">全部</option><option>动火作业证</option><option>高处作业证</option><option>电工作业证</option><option>有限空间作业证</option><option>安全管理人员资格证</option></select></div><button class="btn btn-outline btn-sm" onclick="renderCertificates()">查询</button></div>'+ 
    '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>持证人员/组织</th><th>证书名称</th><th>证书编号</th><th>发证日期</th><th>有效期至</th><th>状态</th><th>来源</th><th>操作</th></tr></thead><tbody id="certificateRows"></tbody></table></div>';
  var qStatus=params.get("status")||"",qUser=params.get("user")||"";if(qStatus)document.getElementById("certStatus").value=qStatus;if(qUser)document.getElementById("certKeyword").value=qUser;renderCertificates();
}
function renderCertificates(){
  var key=(document.getElementById("certKeyword")||{}).value||"",status=(document.getElementById("certStatus")||{}).value||"",type=(document.getElementById("certType")||{}).value||"";key=key.trim().toLowerCase();
  var rows=App.certs.filter(function(c){var s=certStatus(c);return inScope(c.org)&&(!status||s===status)&&(!type||c.cert===type)&&(!key||[c.user,c.cert,c.code].join(" ").toLowerCase().indexOf(key)>-1);});
  document.getElementById("certificateRows").innerHTML=rows.map(function(c){return '<tr><td><b>'+esc(c.user)+'</b><br><span class="muted">'+esc(c.org)+'</span></td><td>'+esc(c.cert)+'</td><td class="mono">'+esc(c.code)+'</td><td>'+esc(c.issueDate)+'</td><td>'+esc(c.expire)+'</td><td>'+statusTag(certStatus(c))+'</td><td>'+esc(c.source)+'</td><td><button class="btn btn-text" onclick="openCertificate(\''+c.id+'\')">详情</button>'+(canManage()?'<button class="btn btn-text" onclick="openCertForm(\''+c.id+'\')">编辑</button><button class="btn btn-text" onclick="openRenew(\''+c.id+'\')">换证</button>':'')+'</td></tr>';}).join("")||'<tr><td colspan="8">'+UI.empty("暂无符合条件的证书")+'</td></tr>';
}
function setCertStatus(status){document.getElementById("certStatus").value=status;renderCertificates();}
function openCertificate(id){var c=App.certificate.byId(id);if(!c)return;var trainings=App.trainingRecords.filter(function(x){return x.user===c.user;}),permits=App.workPermits.filter(function(w){return (w.persons||[]).some(function(p){return p.user===c.user;});});UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">持证人员</span><span class="d-value">'+esc(c.user)+'</span></div><div class="d-item"><span class="d-label">所属组织</span><span class="d-value">'+esc(c.org)+'</span></div><div class="d-item"><span class="d-label">证书名称</span><span class="d-value">'+esc(c.cert)+'</span></div><div class="d-item"><span class="d-label">证书编号</span><span class="d-value mono">'+esc(c.code)+'</span></div><div class="d-item"><span class="d-label">发证机构</span><span class="d-value">'+esc(c.issuer)+'</span></div><div class="d-item"><span class="d-label">有效状态</span><span class="d-value">'+statusTag(certStatus(c))+'</span></div><div class="d-item"><span class="d-label">发证日期</span><span class="d-value">'+esc(c.issueDate)+'</span></div><div class="d-item"><span class="d-label">有效期至</span><span class="d-value">'+esc(c.expire)+'</span></div><div class="d-item"><span class="d-label">证书附件</span><span class="d-value">'+(c.attachment?'<span class="tag tag-green">已上传</span>':'<span class="tag tag-warn">未上传</span>')+'</span></div><div class="d-item"><span class="d-label">数据来源</span><span class="d-value">'+esc(c.source)+'</span></div></div><div class="section-head"><h3>关联记录</h3></div><div class="hint-line">培训记录 '+trainings.length+' 条；关联特殊作业票 '+permits.length+' 张。特殊作业资格校验始终读取当前有效证书，不沿用已过期证书。</div>'+(c.history&&c.history.length?'<div class="section-head"><h3>历史证书版本</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>原证书编号</th><th>发证日期</th><th>原有效期</th><th>归档时间</th></tr></thead><tbody>'+c.history.map(function(h){return '<tr><td>'+esc(h.code)+'</td><td>'+esc(h.issueDate)+'</td><td>'+esc(h.expire)+'</td><td>'+esc(h.updatedAt)+'</td></tr>';}).join("")+'</tbody></table></div>':''),{title:"证书详情 · "+c.user,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'+(canManage()?'<button class="btn btn-primary" onclick="closeDrawerEditCert(\''+c.id+'\')">编辑证书</button><button class="btn btn-green" onclick="closeDrawerRenew(\''+c.id+'\')">办理换证</button>':'')});}
function certFormData(c){return '<datalist id="certPeople">'+personOptions()+'</datalist><div class="form-grid"><div class="form-item"><span class="form-label">持证人员 <span class="req">*</span></span><input id="cfUser" list="certPeople" value="'+esc(c.user||"")+'" placeholder="搜索企业微信组织人员"></div><div class="form-item"><span class="form-label">所属组织</span><input id="cfOrg" value="'+esc(c.org||"")+'" disabled></div><div class="form-item"><span class="form-label">证书名称 <span class="req">*</span></span><select id="cfCert"><option>动火作业证</option><option>高处作业证</option><option>电工作业证</option><option>有限空间作业证</option><option>安全管理人员资格证</option><option>气体检测资格</option><option>监护人资格</option></select></div><div class="form-item"><span class="form-label">证书编号 <span class="req">*</span></span><input id="cfCode" value="'+esc(c.code||"")+'"></div><div class="form-item"><span class="form-label">发证机构</span><input id="cfIssuer" value="'+esc(c.issuer||"")+'"></div><div class="form-item"><span class="form-label">人员角色</span><input id="cfRole" value="'+esc(c.role||"作业人员")+'"></div><div class="form-item"><span class="form-label">发证日期 <span class="req">*</span></span><input id="cfIssue" type="date" value="'+esc(c.issueDate||"2026-08-13")+'"></div><div class="form-item"><span class="form-label">有效期至 <span class="req">*</span></span><input id="cfExpire" type="date" value="'+esc(c.expire||"2029-08-13")+'"></div><div class="form-item full"><span class="form-label">证书附件</span><label class="check-row"><input id="cfAttachment" type="checkbox" '+(c.attachment?"checked":"")+'> 已核对并上传证书扫描件（原型模拟）</label></div></div>';}
function openCertForm(id){if(!canManage()){App.toast("当前角色只有查看权限","warn");return;}var c=id?App.certificate.byId(id):{};UI.modal(certFormData(c||{}),{title:id?"编辑证书":"新增证书",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="certSave">保存证书</button>'});document.getElementById("cfCert").value=c.cert||"动火作业证";var syncOrg=function(){document.getElementById("cfOrg").value=orgOf(document.getElementById("cfUser").value.trim());};document.getElementById("cfUser").onchange=syncOrg;syncOrg();document.getElementById("certSave").onclick=function(){var user=document.getElementById("cfUser").value.trim(),result=App.certificate.save({user:user,org:orgOf(user),cert:document.getElementById("cfCert").value,code:document.getElementById("cfCode").value.trim(),issuer:document.getElementById("cfIssuer").value.trim(),role:document.getElementById("cfRole").value.trim(),issueDate:document.getElementById("cfIssue").value,expire:document.getElementById("cfExpire").value,source:"平台维护",attachment:document.getElementById("cfAttachment").checked},id);if(result.ok){document.querySelectorAll(".modal").forEach(function(n){n.remove();});viewCertificates();}};}
function openRenew(id){if(!canManage()){App.toast("当前角色只有查看权限","warn");return;}var c=App.certificate.byId(id);UI.modal('<div class="alert info">换证后保留原证书版本；特殊作业再次执行资格校验时读取新证书。</div><div class="form-grid"><div class="form-item"><span class="form-label">持证人员</span><input value="'+esc(c.user)+'" disabled></div><div class="form-item"><span class="form-label">证书名称</span><input value="'+esc(c.cert)+'" disabled></div><div class="form-item"><span class="form-label">新证书编号 <span class="req">*</span></span><input id="rnCode" value="'+esc(c.code.replace(/\*+/g,"***"))+'"></div><div class="form-item"><span class="form-label">新发证日期 <span class="req">*</span></span><input id="rnIssue" type="date" value="2026-08-13"></div><div class="form-item"><span class="form-label">新有效期至 <span class="req">*</span></span><input id="rnExpire" type="date" value="2029-08-13"></div><div class="form-item"><span class="form-label">证书附件</span><input value="已上传新证书扫描件（模拟）" disabled></div></div>',{title:"办理换证 · "+c.user,footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="renewSave">确认换证</button>'});document.getElementById("renewSave").onclick=function(){var result=App.certificate.renew(id,{code:document.getElementById("rnCode").value.trim(),issueDate:document.getElementById("rnIssue").value,expire:document.getElementById("rnExpire").value});if(result.ok){document.querySelectorAll(".modal").forEach(function(n){n.remove();});App.toast("换证完成，请返回作业票重新执行资格校验","success");viewCertificates();}};}
function closeDrawerEditCert(id){document.querySelectorAll(".mask,.drawer").forEach(function(n){n.remove();});openCertForm(id);}
function closeDrawerRenew(id){document.querySelectorAll(".mask,.drawer").forEach(function(n){n.remove();});openRenew(id);}
function backToPermit(){location.href="work-permits.html?tab=ledger&id="+encodeURIComponent(params.get("fromPermit")||"");}

window.renderRecords=renderRecords;window.openTraining=openTraining;window.syncTraining=syncTraining;window.openTrainingSyncLog=openTrainingSyncLog;window.openTrainingSyncBatch=openTrainingSyncBatch;
window.renderCertificates=renderCertificates;window.setCertStatus=setCertStatus;window.openCertificate=openCertificate;window.openCertForm=openCertForm;window.openRenew=openRenew;window.closeDrawerEditCert=closeDrawerEditCert;window.closeDrawerRenew=closeDrawerRenew;window.backToPermit=backToPermit;
if(tab==="records")viewRecords();else viewCertificates();
})();
</script>
</body>
</html>
