<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>移动现场端 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<main class="mobile-page"><div class="mobile-top"><div class="mobile-brand"><img src="assets/logo.svg" alt="太重数智">安全现场</div><button class="mobile-chip blue" id="networkState" onclick="toggleNetwork()">在线</button></div><div id="mobileBody" class="mobile-wrap"></div></main>
<nav class="mobile-bottom"><a data-view="home" href="mobile.html?view=home">⌂<span>首页</span></a><a data-view="tasks" href="mobile.html?view=tasks">▤<span>任务</span></a><a data-view="field" href="mobile.html?view=field">◎<span>现场</span></a><a data-view="messages" href="mobile.html?view=messages">✉<span>消息</span><span class="count" id="msgCount"></span></a><a data-view="me" href="mobile.html?view=me">●<span>我的</span></a></nav>
<script src="assets/store.js"></script><script src="assets/ui.js"></script>
<script>
(function(){
  'use strict';
  var q=new URLSearchParams(location.search),view=q.get('view')||'home',body=document.getElementById('mobileBody'),online=true,mobilePendingConversion=null;
  function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(s){return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s];});}
  function chip(s,kind){return '<span class="mobile-chip '+(kind||'')+'">'+esc(s)+'</span>';}
  function state(title,detail){return '<div class="mobile-state"><strong>'+esc(title)+'</strong><span>'+esc(detail||'请稍后重试或返回上一层继续操作。')+'</span></div>';}
  function back(viewName,label){return '<button class="mobile-btn outline mobile-back" onclick="go(\''+(viewName||'field')+'\')">‹ '+(label||'返回上一层')+'</button>';}
  function permitStatus(w){return chip(w.status,w.status==='执行中'?'major':w.status==='超时阻断'||w.status==='延期审批中'?'warn':w.status==='已暂停'||w.status==='待监护确认'?'warn':'blue');}
  function futurePermitEnd(){var d=new Date(Date.now()+4*60*60*1000),p=function(n){return String(n).padStart(2,'0');};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());}
  function syncTaskToLegacy(t){var legacy=App.inspectionTasks.filter(function(x){return x.id===t.id;})[0];if(!legacy){legacy={id:t.id};App.inspectionTasks.unshift(legacy);}Object.assign(legacy,{code:t.code,planId:t.planId,planName:t.planName,org:t.org,teamName:t.teamName,claimant:t.claimant,assignee:t.claimant||'',window:t.window||t.dispatchTime||'-',status:t.status,completionRate:t.completionRate||0,unqualified:t.unqualified||0,results:t.results||null,hazardGeneratedIds:t.hazardGeneratedIds||[]});(t.items||[]).forEach(function(it){var item=App.inspectionItems.filter(function(x){return x.id===it.id;})[0];if(!item){item={id:it.id};App.inspectionItems.push(item);}Object.assign(item,{code:it.code||it.id,standardVersionId:it.standardVersionId||('STD-'+(it.riskCode||'GENERAL')+'-V1'),name:it.content||it.name,standard:it.standard||it.content,response:'是非',requiredPhoto:!!it.requiredPhoto,sourceMeasure:it.measureId||it.sourceMeasure||null,riskCode:it.riskCode||null,riskLocation:it.riskLocation||null,enabled:true});});return legacy;}
  function taskItems(t){if((t.items||[]).length)return t.items;var refs=t.standardRefs||[];return App.inspectionItems.filter(function(x){return x.enabled!==false&&refs.some(function(ref){return ref.riskCode&&ref.riskCode===x.riskCode;});});}
  function mobileTasks(){var rows=(App.tasks||[]).length?App.tasks:App.inspectionTasks;rows.forEach(function(t){if((App.tasks||[]).indexOf(t)>-1)syncTaskToLegacy(t);});return rows.filter(function(t){return !App.inCurrentOrgScope||App.inCurrentOrgScope(t.org);});}
  function setActive(){document.querySelectorAll('.mobile-bottom a').forEach(function(a){a.classList.toggle('active',a.getAttribute('data-view')===view);});document.getElementById('msgCount').textContent=App.mobile.unread()||'';document.getElementById('networkState').textContent=online?'在线':'弱网';document.getElementById('networkState').className='mobile-chip '+(online?'blue':'warn');}
  function go(v){location.href='mobile.html?view='+v;}
  window.toggleNetwork=function(){online=!online;setActive();App.toast(online?'已恢复在线，可重试本地草稿':'已切换弱网模拟，提交会保留本地草稿',online?'success':'warn');};
  function home(){
    var d=App.dashboard(),pending=(App.workbenchTodos?App.workbenchTodos():[]).length,active=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&App.mapPermitStatuses.indexOf(w.status)>-1;}).length;
    body.innerHTML='<section class="mobile-hero"><div class="muted">'+esc(App.currentUser())+' · '+esc(App.currentOrg.split(' / ').pop())+'</div><h1 style="font-size:21px;margin:4px 0 8px">现场安全工作台</h1><div class="muted">风险、巡检、隐患和作业票在一个现场入口闭环</div></section>'+
      '<div class="mobile-kpis"><div class="mobile-kpi" onclick="go(\'tasks\')"><b>'+pending+'</b><span>我的业务待办</span></div><div class="mobile-kpi" onclick="go(\'field\')"><b>'+active+'</b><span>未完成作业票</span></div><div class="mobile-kpi" onclick="go(\'field&mode=hazard\')"><b>'+d.pendingHazards+'</b><span>待处置隐患</span></div><div class="mobile-kpi" onclick="go(\'messages\')"><b>'+App.mobile.unread()+'</b><span>未读消息</span></div></div>'+ 
      '<div class="mobile-card"><h3>未读待办消息</h3>'+(App.notifications.filter(function(n){return !n.read;}).slice(0,3).map(function(n){return '<div class="mobile-row" onclick="openMessage(\''+n.id+'\')"><span><b>'+esc(n.title)+'</b><span class="sub">'+esc(n.text)+'</span></span>'+chip('未读','warn')+'</div>';}).join('')||state('暂无未读消息','已读消息仍可在消息中心查询。'))+'<button class="mobile-btn outline" onclick="go(\'messages\')">查看全部消息</button></div>'+ 
      '<div class="mobile-card"><h3>现场快捷操作</h3><button class="mobile-btn primary" onclick="go(\'field\')">进入移动巡检</button><button class="mobile-btn outline" onclick="go(\'field&mode=hazard\')">随手拍隐患</button><button class="mobile-btn outline" onclick="go(\'field&mode=checkin\')">业务签到（绑定任务/作业票）</button></div>';
  }
  function tasks(){
    var ts=mobileTasks(),ps=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&App.mapPermitStatuses.indexOf(w.status)>-1;}),todos=App.workbenchTodos?App.workbenchTodos():[];
    var inspectionRows=ts.map(function(t){var checked=App.checkIns.some(function(x){return x.kind==='inspection'&&x.businessId===t.id;});return '<div class="mobile-row" tabindex="0" onclick="openInspection(\''+t.id+'\')" onkeydown="if(event.key===\'Enter\')openInspection(\''+t.id+'\')"><span><b>'+esc(t.code)+'</b><span class="sub">巡检 · '+esc(t.planName)+' · '+esc(t.window||t.dispatchTime||'-')+(checked?' · 已签到':' · 未签到')+'</span></span>'+chip(t.status,t.status==='待领取'?'warn':'green')+'</div>';}).join('');
    var permitRows=ps.map(function(w){return '<div class="mobile-row" tabindex="0" onclick="openPermitMobile(\''+w.id+'\')" onkeydown="if(event.key===\'Enter\')openPermitMobile(\''+w.id+'\')"><span><b>'+esc(w.code)+'</b><span class="sub">'+esc(w.type)+' · '+esc(w.location)+'</span></span>'+permitStatus(w)+'</div>';}).join('');
    var otherRows=todos.filter(function(t){return t.module!=='inspection'&&t.module!=='permits';}).map(function(t){return '<a class="mobile-row" href="'+esc(t.target)+'"><span><b>'+esc(t.businessCode)+' · '+esc(t.title)+'</b><span class="sub">'+esc(t.nextAction)+'</span></span>'+chip(t.status,'warn')+'</a>';}).join('');
    body.innerHTML='<div class="mobile-card"><h3>任务中心</h3><div class="hint-line">与 PC 工作台共用同一待办对象；任一端办理后状态同步。</div><div class="mobile-row"><span>我的全部待办</span>'+chip(todos.length+' 项','warn')+'</div><div class="mobile-row"><span>巡检任务</span>'+chip(ts.filter(function(t){return ['待领取','已领取','执行中'].indexOf(t.status)>-1;}).length+' 待处理','warn')+'</div><div class="mobile-row"><span>现场作业票</span>'+chip(ps.length+' 未完成','blue')+'</div></div>'+(otherRows?'<div class="mobile-card"><h3>隐患等业务待办</h3><div class="mobile-list">'+otherRows+'</div></div>':'')+'<div class="mobile-card"><h3>巡检任务</h3><div class="mobile-list">'+(inspectionRows||state('暂无巡检任务','当前没有待处理巡检任务。'))+'</div></div><div class="mobile-card"><h3>未完成作业票</h3><div class="mobile-list">'+(permitRows||state('暂无未完成作业票','当前没有需要现场处理的作业票。'))+'</div></div>';
  }
  function openInspection(id){
    var t=mobileTasks().filter(function(x){return x.id===id;})[0];
    if(!t){body.innerHTML='<div class="mobile-card">'+state('巡检任务不存在','任务可能已被撤回或刷新，请从任务中心重新进入。')+back('tasks','返回任务中心')+'</div>';return;}
    if(t.status==='待领取'){body.innerHTML='<div class="mobile-card"><div class="mobile-detail-head"><h3>'+esc(t.code)+'</h3>'+chip('待领取','warn')+'</div><div class="mobile-detail-meta"><div><small>执行班组</small><b>'+esc(t.teamName||'当前班组')+'</b></div><div><small>检查项</small><b>'+((t.items||[]).length)+' 项</b></div></div><div class="alert info">任务下发到班组，首位成员领取后锁定给本人，其他成员不能重复执行。</div><button class="mobile-btn primary" onclick="claimMobileInspection(\''+id+'\')">领取并锁定任务</button>'+back('tasks','返回任务中心')+'</div>';return;}
    if((t.status==='已领取'||t.status==='执行中')&&t.claimant&&t.claimant!==App.currentUser()){body.innerHTML='<div class="mobile-card">'+state('任务已被领取','当前任务已锁定给 '+t.claimant+'，请联系班组长解锁或转交。')+back('tasks','返回任务中心')+'</div>';return;}
    var items=taskItems(t),checked=App.checkIns.some(function(x){return x.kind==='inspection'&&x.businessId===id;}),itemBody=items.map(function(it,i){return '<div class="mobile-check-item"><div class="check-title"><span>'+(i+1)+'. '+esc(it.content||it.name)+'</span>'+(it.requiredPhoto?chip('现场照片必拍','warn'):'')+'</div><label>检查结果</label><select class="m-res" data-item="'+it.id+'"><option value="">请选择检查结果</option><option>合格</option><option>不合格</option></select><label>说明</label><textarea class="m-description" data-description="'+it.id+'" placeholder="填写现场说明；不合格时必填">'+esc(it.description||it.note||'')+'</textarea><div class="mobile-evidence"><span>照片'+(it.requiredPhoto?'（必拍）':'（选填）')+'</span><button class="mobile-btn outline m-photo" data-photo="'+it.id+'" type="button">'+(it.photoDone?'✓ 照片已留存':'留存照片')+'</button></div></div>';}).join('');
    body.innerHTML='<div class="mobile-card"><div class="mobile-detail-head"><h3>移动巡检 · '+esc(t.code)+'</h3>'+chip(t.status,t.status==='已领取'?'warn':'green')+'</div><div class="mobile-detail-meta"><div><small>巡检计划</small><b>'+esc(t.planName)+'</b></div><div><small>执行班组/领取人</small><b>'+esc(t.teamName||'-')+' / '+esc(t.claimant||App.currentUser())+'</b></div></div><div class="mobile-step"><b>1</b><span>业务签到：'+(checked?'已完成':'请先到现场签到')+'</span></div><div class="mobile-step"><b>2</b><span>逐项选择合格或不合格；说明与照片分别填写，不合格说明将作为隐患标题。</span></div><button class="mobile-btn outline" onclick="mobileCheckin(\'inspection\',\''+id+'\')">'+(checked?'已完成业务签到':'业务签到')+'</button>'+back('tasks','返回任务中心')+'</div><div class="mobile-card"><h3>逐项检查</h3>'+(itemBody?'<div class="mobile-form">'+itemBody+'</div><div class="mobile-action-bar"><button class="mobile-btn green" onclick="submitMobileInspection(\''+id+'\')">提交巡检结果</button></div>':state('暂无检查项目','请联系管理人员先配置巡检项目。'))+'</div>';
  }
  window.claimMobileInspection=function(id){var t=mobileTasks().filter(function(x){return x.id===id;})[0],team=t&&(App.teams||[]).filter(function(x){return x.id===t.teamId;})[0];if(['team_member','team_leader'].indexOf(App.currentRole)<0||!team||(team.members||[]).indexOf(App.currentUser())<0){App.toast('仅执行班组成员可以领取任务','error');return;}if(!t||t.status!=='待领取'){App.toast('任务已被其他成员领取，请刷新','warn');return;}t.claimant=App.currentUser();t.claimedAt=new Date().toISOString();t.status='已领取';syncTaskToLegacy(t);App.persist();App.toast('领取成功，任务已锁定给本人');openInspection(id);};
  function showInspectionOutcome(taskId,results){
    var t=App.inspectionTasks.filter(function(x){return x.id===taskId;})[0],unq=results.filter(function(r){return r.result==='不合格';});
    mobilePendingConversion=unq.length?{taskId:taskId,items:unq}:null;
    var items=unq.map(function(r){var it=App.inspectionItems.filter(function(x){return x.id===r.itemId;})[0];return '<div class="mobile-row"><span><b>'+esc(it?it.name:r.itemId)+'</b><span class="sub">隐患标题：'+esc(r.description||'')+'</span></span>'+chip('待转隐患','warn')+'</div>';}).join('');
    body.innerHTML='<div class="mobile-card"><div class="mobile-detail-head"><h3>巡检结果已提交</h3>'+chip(unq.length?'含不合格':'全部合格',unq.length?'warn':'green')+'</div><div class="hint-line">任务 '+esc(t?t.code:taskId)+' 已保存现场结果。</div>'+(unq.length?'<div class="alert error" style="margin-top:10px">发现 '+unq.length+' 项不合格，需点击“一键转隐患”后进入隐患治理流程。</div><div class="mobile-list" style="margin-top:10px">'+items+'</div><button class="mobile-btn primary" onclick="convertMobileHazards()">一键转隐患</button>':state('本次无不合格项','巡检结果已完成，不需要生成隐患。'))+back('tasks','返回任务中心')+'</div>';
  }
  window.convertMobileHazards=function(){
    if(!mobilePendingConversion||!mobilePendingConversion.items.length){App.toast('当前没有待转隐患的不合格项','warn');return;}
    var generated=mobilePendingConversion.items.map(function(r){return App.inspection.toHazard(mobilePendingConversion.taskId,r.itemId);}).filter(Boolean),codes=generated.map(function(h){return h.code;});
    var taskId=mobilePendingConversion.taskId;mobilePendingConversion=null;
    App.toast('已生成 '+codes.length+' 条隐患','success');
    body.innerHTML='<div class="mobile-card"><div class="mobile-detail-head"><h3>隐患已生成</h3>'+chip(codes.length+' 条','warn')+'</div><div class="alert warn">不合格项已转为隐患，来源保留为“巡检”，后续由隐患治理流程受理、整改和复查。</div><div class="mobile-list" style="margin-top:10px">'+generated.map(function(h){return '<div class="mobile-row"><span><b>'+esc(h.code)+'</b><span class="sub">'+esc(h.title)+'</span></span>'+chip(h.status,'warn')+'</div>';}).join('')+'</div><button class="mobile-btn primary" onclick="location.href=\'hazards.html?tab=ledger\'">进入隐患治理</button>'+back('tasks','返回任务中心')+'</div>';
  };
  window.submitMobileInspection=function(id){
    var t=mobileTasks().filter(function(x){return x.id===id;})[0],legacy=syncTaskToLegacy(t),rs=[],bad=false;
    if(t.claimant&&t.claimant!==App.currentUser()){App.toast('任务已锁定给 '+t.claimant+'，当前用户不可提交','error');return;}
    if(!App.checkIns.some(function(x){return x.kind==='inspection'&&x.businessId===id;})){App.toast('请先完成与本巡检任务绑定的业务签到','error');return;}
    document.querySelectorAll('.m-res').forEach(function(sel){var it=App.inspectionItems.filter(function(x){return x.id===sel.dataset.item;})[0],description=document.querySelector('[data-description="'+sel.dataset.item+'"]'),photo=document.querySelector('[data-photo="'+sel.dataset.item+'"]'),descriptionValue=description?description.value.trim():'';if(!sel.value){bad=true;return;}if(sel.value==='不合格'&&!descriptionValue){bad=true;return;}if(it.requiredPhoto&&(!photo||!photo.dataset.done)&&!it.photoDone){bad=true;return;}rs.push({itemId:sel.dataset.item,result:sel.value,description:descriptionValue,photoDone:!!(photo&&photo.dataset.done)||!!it.photoDone});});
    if(bad||rs.length!==taskItems(t).length){App.toast('未完成必检、说明或照片留证，不能提交','error');return;}
    if(!online){App.mobile.draft('inspection', {taskId:id,results:rs},'inspection:'+id);return;}
    App.inspection.submitResults(id,rs);t.results=legacy.results;t.completionRate=legacy.completionRate;t.unqualified=legacy.unqualified;t.status='已完成';t.completedAt=legacy.completedAt;App.persist();App.toast('巡检结果已提交');showInspectionOutcome(id,rs);
  };
  document.addEventListener('click',function(e){if(e.target.classList.contains('m-photo')||e.target.classList.contains('permit-start-photo')||e.target.classList.contains('permit-process-photo')){e.target.dataset.done='1';e.target.textContent='✓ 照片已留存';e.target.classList.remove('outline');e.target.classList.add('green');}});
  function hazardForm(){
    body.innerHTML='<div class="mobile-card"><h3>随手拍</h3><div class="mobile-form"><label>隐患标题<input id="mhTitle" placeholder="如：砂箱吊具异常"></label><label>现场位置<div style="display:flex;gap:8px"><input id="mhLoc" value="自动线组造型工位" readonly><button class="mobile-btn outline" id="mhLocate" type="button">获取位置</button></div></label><label>事实描述<textarea id="mhDesc" placeholder="描述不安全状态或行为"></textarea></label><button class="mobile-btn outline" id="mhPhoto">留存现场照片</button></div><button class="mobile-btn primary" onclick="submitMobileHazard()">提交隐患</button><div class="hint-line">位置、填报人和提交时间自动记录；来源固定为 MOBILE_REPORT（随手拍）。</div></div>';
    document.getElementById('mhLocate').onclick=function(){this.previousElementSibling.value=(App.currentOrg||'造型作业区').split(' / ').pop()+'现场（模拟定位）';this.textContent='已获取';this.disabled=true;};
    document.getElementById('mhPhoto').onclick=function(){this.dataset.done='1';this.textContent='✓ 照片已留存';};
  }
  window.submitMobileHazard=function(){var t=document.getElementById('mhTitle').value.trim(),key='mobile:'+((t||'empty')+':'+document.getElementById('mhLoc').value);if(!t){App.toast('请填写隐患标题','error');return;}var h=App.mobile.submitHazard({title:t,location:document.getElementById('mhLoc').value,description:document.getElementById('mhDesc').value,discoveryPhoto:!!document.getElementById('mhPhoto').dataset.done},key);if(!online){App.mobile.draft('hazard',{hazardId:h.id},key);App.toast('弱网：已保存本地草稿，稍后可重试','warn');return;}App.toast('隐患 '+h.code+' 已提交');body.innerHTML='<div class="mobile-card"><div class="mobile-detail-head"><h3>隐患已提交</h3>'+chip(h.status,'warn')+'</div><div class="mobile-row"><span>隐患编号</span><b>'+esc(h.code)+'</b></div><div class="mobile-row"><span>隐患标题</span><span>'+esc(h.title)+'</span></div><div class="mobile-row"><span>来源</span><span>随手拍</span></div><div class="hint-line">已保留填报人、提交时间、现场位置及照片证据，后续进入隐患治理流程受理。</div><button class="mobile-btn primary" onclick="location.href=\'hazards.html?tab=ledger\'">查看隐患</button>'+back('field','返回现场')+'</div>';};
  function openPermitMobile(id){
    var w=App.permit.byId(id);if(!w||App.inCurrentOrgScope&&!App.inCurrentOrgScope(w.org)){body.innerHTML='<div class="mobile-card">'+state('作业票不存在或无权查看','请从当前组织的现场列表重新进入。')+back('field','返回现场')+'</div>';return;}var actions='';
    if(w.status==='待监护确认'||w.status==='监护条件不满足')actions='<button class="mobile-btn primary" onclick="guardianMobile(\''+id+'\')">监护确认</button>';
    else if(w.status==='待开工')actions='<button class="mobile-btn green" onclick="openPermitStart(\''+id+'\')">开工确认</button>';
    else if(w.status==='执行中')actions='<button class="mobile-btn outline" onclick="recordPermitPhoto(\''+id+'\')">记录过程照片</button><button class="mobile-btn outline" onclick="permitAction(\'pause\',\''+id+'\')">暂停</button><button class="mobile-btn outline" onclick="mobileExtension(\''+id+'\')">申请延期</button><button class="mobile-btn primary" onclick="permitAction(\'complete\',\''+id+'\')">完工</button>';
    else if(w.status==='已暂停')actions='<button class="mobile-btn primary" onclick="permitAction(\'resume\',\''+id+'\')">恢复（需重新确认）</button><button class="mobile-btn outline" onclick="mobileExtension(\''+id+'\')">申请延期</button>';
    else if(w.status==='超时阻断')actions='<div class="alert error">作业票已超过许可时间，延期批准前禁止继续作业、恢复或完工。</div><button class="mobile-btn primary" onclick="mobileExtension(\''+id+'\')">申请延期</button>';
    else if(w.status==='延期审批中')actions='<div class="alert error">延期尚未批准，当前禁止继续作业。</div>';
    var actionRows=w.actions.slice(-5).reverse().map(function(a){return '<div class="mobile-row"><span><b>'+esc(a.type)+'</b><span class="sub">'+esc(a.note)+'</span></span><span class="sub">'+esc(a.at)+'</span></div>';}).join(''),checkRows=(w.checks||[]).map(function(c){return '<label class="mobile-row"><span><b>'+esc(c.type)+'</b><span class="sub">'+esc(c.text)+'</span></span><input class="guardian-check" data-check="'+esc(c.id)+'" type="checkbox" '+(c.result==='通过'?'checked':'')+'></label>';}).join(''),checked=App.checkIns.some(function(x){return x.kind==='permit'&&x.businessId===id;});
    body.innerHTML='<div class="mobile-card"><div class="mobile-detail-head"><h3>'+esc(w.code)+' · '+esc(w.type)+'</h3>'+permitStatus(w)+'</div><div class="mobile-detail-meta"><div><small>作业地点</small><b>'+esc(w.location)+'</b></div><div><small>作业级别</small><b>'+esc(w.workLevel||'三级')+'</b></div></div><div class="mobile-row"><span>作业有效期</span><span>'+esc(w.plannedStart)+' ~ '+esc(w.plannedEnd)+'</span></div><div class="mobile-row"><span>审批路径</span><span>'+esc((w.approvalPath||App.approvalPathFor(w)).join(' → '))+'</span></div><div class="mobile-row"><span>风险措施快照</span><span>'+esc((w.risks||[]).map(function(r){return r.hazard;}).join('；')||'无')+'</span></div><div class="mobile-step"><b>1</b><span>业务签到：'+(checked?'已完成':'请在现场完成签到')+'</span></div><button class="mobile-btn outline" onclick="mobileCheckin(\'permit\',\''+id+'\')">'+(checked?'已完成业务签到':'业务签到')+'</button>'+actions+back('field','返回现场')+'</div>'+((w.status==='待监护确认'||w.status==='监护条件不满足')?'<div class="mobile-card"><h3>监护确认项</h3><div class="hint-line">逐项确认后，才可完成监护确认并进入开工环节。</div>'+checkRows+'</div>':'')+'<div class="mobile-card"><h3>过程记录</h3>'+(actionRows||state('暂无过程记录','当前作业票还没有现场操作记录。'))+'</div>';
  }
  window.openPermitStart=function(id){var w=App.permit.byId(id),checked=App.checkIns.some(function(x){return x.kind==='permit'&&x.businessId===id;});body.innerHTML='<div class="mobile-card"><h3>开工确认 · '+esc(w.code)+'</h3><div class="alert warn">开工前必须完成业务签到、现场位置校验并留存开工照片。</div><div class="mobile-form"><label>业务签到<input value="'+(checked?'已完成':'未完成')+'" disabled></label><label>现场位置<input id="permitStartLocation" value="'+esc(w.location)+'" readonly></label><div style="display:flex;gap:8px"><button class="mobile-btn outline" onclick="confirmPermitLocation(1)">定位通过</button><button class="mobile-btn outline" onclick="confirmPermitLocation(0)">模拟定位异常</button></div><label id="permitLocationExceptionWrap" style="display:none">定位异常说明<textarea id="permitLocationException" placeholder="说明现场位置与许可地点不一致的原因"></textarea></label><button class="mobile-btn outline permit-start-photo" type="button">留存开工照片</button></div><button class="mobile-btn green" onclick="submitPermitStart(\''+id+'\')">确认开工</button>'+back('field&mode=permit&id='+encodeURIComponent(id),'返回作业票')+'</div>';};
  window.confirmPermitLocation=function(pass){var input=document.getElementById('permitStartLocation'),wrap=document.getElementById('permitLocationExceptionWrap');input.dataset.checked='1';input.dataset.pass=pass?'1':'0';input.value=pass?input.value+'（定位通过）':input.value+'（定位异常）';wrap.style.display=pass?'none':'block';};
  window.submitPermitStart=function(id){var w=App.permit.byId(id),loc=document.getElementById('permitStartLocation'),photo=document.querySelector('.permit-start-photo'),checked=App.checkIns.some(function(x){return x.kind==='permit'&&x.businessId===id;});if(!checked){App.toast('请先完成与本作业票绑定的业务签到','error');return;}if(!loc||loc.dataset.checked!=='1'){App.toast('请先完成现场位置校验','error');return;}var exception=document.getElementById('permitLocationException'),exceptionNote=exception?exception.value.trim():'';if(loc.dataset.pass==='0'&&!exceptionNote){App.toast('定位异常时必须填写说明','error');return;}if(!photo||!photo.dataset.done){App.toast('开工照片为必填证据','error');return;}var result=App.permit.start(id,{location:loc.value,locationPassed:loc.dataset.pass==='1',locationException:exceptionNote,photo:true});if(result&&result.ok){App.toast('开工确认完成，作业进入执行中','success');openPermitMobile(id);}};
  window.recordPermitPhoto=function(id){var w=App.permit.byId(id);body.innerHTML='<div class="mobile-card"><h3>记录作业过程 · '+esc(w.code)+'</h3><div class="mobile-form"><button class="mobile-btn outline permit-process-photo" type="button">留存过程照片</button><label>过程说明<textarea id="permitProcessNote" placeholder="可填写现场进展、异常或措施落实情况"></textarea></label></div><button class="mobile-btn primary" onclick="submitPermitProcessPhoto(\''+id+'\')">保存过程记录</button>'+back('field&mode=permit&id='+encodeURIComponent(id),'返回作业票')+'</div>';};
  window.submitPermitProcessPhoto=function(id){var photo=document.querySelector('.permit-process-photo');if(!photo||!photo.dataset.done){App.toast('请先留存过程照片','error');return;}var w=App.permit.byId(id),note=document.getElementById('permitProcessNote').value.trim()||'现场过程照片';w.processPhotos=w.processPhotos||[];w.processPhotos.push({at:new Date().toISOString().slice(0,16).replace('T',' '),by:App.currentUser(),note:note});w.actions.push({type:'过程留证',at:w.processPhotos[w.processPhotos.length-1].at,by:App.currentUser(),note:note+'（含现场照片）'});App.persist();App.toast('作业过程照片已保存','success');openPermitMobile(id);};
  window.permitAction=function(action,id){if(!online){App.mobile.draft('permit',{action:action,id:id},'permit:'+action+':'+id);return;}var result;if(action==='pause'){App.permit.pause(id);result={ok:true};}if(action==='resume')result=App.permit.resume(id);if(action==='complete')result=App.permit.complete(id);if(result&&result.ok)App.toast('作业票状态已更新');openPermitMobile(id);};
  window.mobileExtension=function(id){var w=App.permit.byId(id);body.innerHTML='<div class="mobile-card"><h3>作业票延期 · '+esc(w.code)+'</h3><div class="alert warn">超过有效时间后不得继续作业。延期前须复核五类安全条件，批准后还要重新监护确认。'+(w.typeKey==='hotwork'&&w.workLevel==='一级'?'<br><b>一级动火每次延期最多延长 8 小时。</b>':'')+'</div><div class="mobile-form"><label>当前结束时间<input value="'+esc(w.plannedEnd)+'" disabled></label><label>申请延期至<input id="mExtEnd" value="'+futurePermitEnd()+'"></label><label>延期原因<textarea id="mExtReason" placeholder="说明延期原因"></textarea></label><label class="check-row"><input type="checkbox" data-mobile-ext="personnel"> 作业人员及资格无变化</label><label class="check-row"><input type="checkbox" data-mobile-ext="guardian"> 监护人员持续到位</label><label class="check-row"><input type="checkbox" data-mobile-ext="location"> 作业地点及范围无变化</label><label class="check-row"><input type="checkbox" data-mobile-ext="environment"> 环境、气体和天气条件已复核</label><label class="check-row"><input type="checkbox" data-mobile-ext="measures"> 隔离、防护和应急措施持续有效</label><label>条件变化说明<textarea id="mExtSafetyNote" placeholder="无变化可填写“无”"></textarea></label></div><button class="mobile-btn primary" onclick="submitMobileExtension(\''+id+'\')">提交延期申请</button>'+back('field&mode=permit&id='+encodeURIComponent(id),'返回作业票')+'</div>';};
  window.submitMobileExtension=function(id){var end=document.getElementById('mExtEnd').value.trim(),reason=document.getElementById('mExtReason').value.trim(),review={note:document.getElementById('mExtSafetyNote').value.trim()};document.querySelectorAll('[data-mobile-ext]').forEach(function(box){review[box.getAttribute('data-mobile-ext')]=box.checked;});var res=App.permit.requestExtension(id,end,reason,review);if(res&&res.ok){App.toast('延期申请已提交，批准前禁止继续作业');openPermitMobile(id);}};
  window.guardianMobile=function(id){var w=App.permit.byId(id),r={},all=true;document.querySelectorAll('.guardian-check').forEach(function(box){r[box.dataset.check]=box.checked?'通过':'未确认';if(!box.checked)all=false;});if(!all){App.toast('请逐项完成监护确认','error');return;}all=App.permit.guardianConfirm(id,r);if(all){App.toast('监护确认通过，可开工');openPermitMobile(id);}else App.toast('监护未完成，禁止开工','error');};
  window.mobileCheckin=function(kind,id){var r=App.mobile.checkIn({kind:kind,id:id,location:'造型作业区现场'},kind+':'+id);if(r.ok)App.toast(r.duplicate?'已存在签到记录':'签到成功');};
  function field(){var mode=q.get('mode');if(mode==='hazard'){hazardForm();return;}if(mode==='checkin'){checkin();return;}if(mode==='permit'){openPermitMobile(q.get('id')||'W-002');return;}if(mode==='inspection'){openInspection(q.get('id')||'IT-01T');return;}mapView();}
  function checkin(){
    var rows=mobileTasks().filter(function(t){return t.status==='已领取'||t.status==='执行中';}).map(function(t){return '<div class="mobile-row"><span><b>'+esc(t.code)+'</b><span class="sub">巡检任务 · '+esc(t.window||t.dispatchTime||'-')+'</span></span><button class="mobile-btn outline" style="width:auto;margin:0" onclick="mobileCheckin(\'inspection\',\''+t.id+'\')">签到</button></div>';}).join('')+App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&App.mapPermitStatuses.indexOf(w.status)>-1&&w.status!=='延期审批中'&&w.status!=='超时阻断';}).map(function(w){return '<div class="mobile-row"><span><b>'+esc(w.code)+'</b><span class="sub">作业票 · '+esc(w.type)+'</span></span><button class="mobile-btn outline" style="width:auto;margin:0" onclick="mobileCheckin(\'permit\',\''+w.id+'\')">签到</button></div>';}).join('');
    body.innerHTML='<div class="mobile-card"><h3>业务签到</h3><div class="hint-line">签到必须绑定巡检任务或作业票，不是通用考勤。</div><div class="mobile-list" style="margin-top:10px">'+(rows||state('暂无可签到业务','当前没有待执行巡检或未完成作业票。'))+'</div></div>'+back('field','返回现场');
  }
  function mapView(){var rows=App.workPermits.filter(function(w){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(w.org))&&App.mapPermitStatuses.indexOf(w.status)>-1;});var list=rows.map(function(w){return '<div class="mobile-row" tabindex="0" onclick="openPermitMobile(\''+w.id+'\')" onkeydown="if(event.key===\'Enter\')openPermitMobile(\''+w.id+'\')"><span><b>'+esc(w.code)+'</b><span class="sub">'+esc(w.type)+' · '+esc(w.location)+'</span></span>'+permitStatus(w)+'</div>';}).join('');body.innerHTML='<div class="mobile-card"><h3>现场作业地图</h3><div class="hint-line">只显示审批中、待监护确认、待开工、执行中、暂停、超时阻断和延期审批中的作业票。当前图形为原型位置示意，不代表已接入 GIS、厂区底图或真实坐标。</div>'+(rows.length?'<div class="mobile-map"><div class="road h"></div><div class="road v"></div>'+rows.map(function(w,i){return '<span class="pin '+(w.status==='执行中'?'major':'blue')+'" tabindex="0" role="button" aria-label="打开 '+esc(w.code)+'" style="left:'+(20+(i*31)%70)+'%;top:'+(25+(i*23)%62)+'%" onclick="openPermitMobile(\''+w.id+'\')"></span>';}).join('')+'</div>':state('暂无未完成作业票','现场地图只展示当前未完成的作业票。'))+'</div><div class="mobile-list">'+(list||state('暂无现场作业','未完成且尚未归档的作业票会显示在这里。'))+'</div>';}
  function messages(){var rows=App.notifications.map(function(n){return '<div class="mobile-row" tabindex="0" onclick="openMessage(\''+n.id+'\')" onkeydown="if(event.key===\'Enter\')openMessage(\''+n.id+'\')"><span><b>'+esc(n.title)+'</b><span class="sub">'+esc(n.text)+' · '+esc(n.channel||'企业微信')+' · '+esc(n.createdAt)+'</span></span>'+chip(n.read?'已读':'未读',n.read?'':'warn')+'</div>';}).join('');body.innerHTML='<div class="mobile-card"><h3>企业微信待办与消息</h3><div class="hint-line">安全管理平台产生的待办统一推送企业微信并携带业务入口；OA 内部审批节点待办由 OA 负责，不在这里重复生成。消息已读不会自动完成业务待办。</div></div><div class="mobile-list">'+(rows||state('暂无消息','新的巡检、作业票和督办提醒会显示在这里。'))+'</div>';}
  window.openMessage=function(id){var n=App.mobile.markRead(id);if(!n)return;App.toast('消息已读，待办状态保持不变');if(n.module==='inspection'){var t=mobileTasks().filter(function(x){return ['待领取','已领取','执行中'].indexOf(x.status)>-1;})[0];if(t)go('field&mode=inspection&id='+encodeURIComponent(t.id));else go('tasks');return;}if(n.module==='permits'){var w=App.workPermits.filter(function(x){return (!App.inCurrentOrgScope||App.inCurrentOrgScope(x.org))&&App.mapPermitStatuses.indexOf(x.status)>-1;})[0];if(w)go('field&mode=permit&id='+encodeURIComponent(w.id));else go('field');return;}if(n.target)location.href=n.target;};
  function me(){var fieldRoles=['team_member','team_leader','section_manager','company_safety','group_safety','professional_inspector'],opts=App.roles.filter(function(r){return fieldRoles.indexOf(r.key)>-1;}).map(function(r){return '<option value="'+r.key+'" '+(r.key===App.currentRole?'selected':'')+'>'+esc(r.name)+' · '+esc(r.user)+'</option>';}).join('');body.innerHTML='<div class="mobile-card"><h3>我的</h3><div class="mobile-form"><label>安全业务角色（原型演示）<select onchange="switchMobileRole(this.value)">'+opts+'</select></label></div><div class="mobile-row"><span>组织人员数据源</span><span>企业微信</span></div><div class="mobile-row"><span>当前组织</span><span>'+esc(App.currentOrg)+'</span></div><div class="hint-line">生产系统不在平台重复维护组织、部门、人员、岗位和在职状态，只映射企业微信人员到安全业务角色。身份切换仅用于原型核对数据边界。</div><button class="mobile-btn outline" onclick="App.resetDemo()">重置演示数据</button><div class="hint-line">本原型只使用本地 mock 数据，不代表生产接口已经联通。</div></div>';}
  window.switchMobileRole=function(role){if(!App.roleOf(role))return;App.currentRole=role;sessionStorage.setItem('tz_anquan_role',role);App.persist();App.toast('已切换为「'+App.roleOf(role).name+'」视角','success');me();setActive();};
  if(view==='home')home();else if(view==='tasks')tasks();else if(view==='field')field();else if(view==='messages')messages();else me();setActive();
  window.openInspection=openInspection;window.openPermitMobile=openPermitMobile;window.go=go;
})();
</script>
</body>
</html>
