<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>相关方管理 · 安全管理平台</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="topbar"></header>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <main class="content"><div class="page-header"></div><div class="page-body" id="pageBody"></div></main>
  </div>
</div>
<script src="assets/store.js?v=20260901-parties-v6"></script><script src="assets/ui.js?v=20260901-parties-v6"></script>
<script>
(function(){
"use strict";
var body=document.getElementById("pageBody"),params=new URLSearchParams(location.search),tab=location.hash.slice(1)||params.get("tab")||"ledger";
function esc(v){return String(v===undefined||v===null?"":v).replace(/[&<>\"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c];});}
function dateNow(){return new Date().toISOString().slice(0,10);}
function canCrossView(){return ["group_safety","professional_inspector"].indexOf(App.currentRole)>-1;}
function inMaintainingOrg(partner){return !partner||(App.currentOrg||"").indexOf(partner.maintainingOrg)>-1||App.inCurrentOrgScope(partner.maintainingOrg);}
function inScope(partner){return canCrossView()||inMaintainingOrg(partner);}
function canMaintain(partner){return ["company_safety","section_manager","team_leader"].indexOf(App.currentRole)>-1&&inMaintainingOrg(partner);}
function canAdd(partner){return !!partner&&canMaintain(partner)&&partner.status==="合作中";}
function tag(text,kind){return '<span class="tag '+(kind||"tag-gray")+'">'+esc(text)+"</span>";}
function visiblePartners(){return (App.partners||[]).filter(inScope);}
function peopleRows(){var rows=[];visiblePartners().forEach(function(p){(p.people||[]).forEach(function(person){rows.push({partner:p,person:person});});});return rows;}
function violationCount(id){return App.partner.violationCount(id);}
function blacklisted(id){return App.partner.isBlacklisted(id);}
function certState(cert){if(!cert||!cert.expire)return "未维护";var days=(Date.parse(cert.expire.replace(/-/g,"/"))-Date.now())/86400000;return days<0?"已过期":days<=90?"临期":"有效";}
function attachment(name,type){return name?'<button class="btn btn-text" data-name="'+esc(name)+'" onclick="openAttachment(this.dataset.name)">'+esc(name)+(type?"（"+esc(type)+"）":"")+"</button>":'<span class="muted">未上传</span>';}
function orgOptions(selected){return ["铸锻件分公司","智能加工配送中心"].map(function(x){return '<option '+(selected===x?'selected':'')+'>'+x+'</option>';}).join("");}
function partnerOptions(selected,maintainOnly){return visiblePartners().filter(function(p){return !maintainOnly||canMaintain(p);}).map(function(p){return '<option value="'+p.id+'" '+(selected===p.id?'selected':'')+'>'+esc(p.name)+'</option>';}).join("");}
function activePartnerOptions(selected){return visiblePartners().filter(canAdd).map(function(p){return '<option value="'+p.id+'" '+(selected===p.id?'selected':'')+'>'+esc(p.name)+'</option>';}).join("");}
function tabBar(){return '<div class="tabs"><button class="tab '+(tab==="ledger"?"active":"")+'" onclick="goTab(\'ledger\')">相关方台账</button><button class="tab '+(tab==="people"?"active":"")+'" onclick="goTab(\'people\')">人员与证书</button><button class="tab '+(tab==="violations"?"active":"")+'" onclick="goTab(\'violations\')">违章记录</button><button class="tab '+(tab==="blacklist"?"active":"")+'" onclick="goTab(\'blacklist\')">黑名单</button></div>';}
function goTab(key){if(tab===key)return;tab=key;location.hash=key;render();}
window.addEventListener("hashchange",function(){var next=location.hash.slice(1);if(["ledger","people","violations","blacklist"].indexOf(next)>-1&&next!==tab){tab=next;render();}});
function pageTitle(){var map={ledger:"相关方台账",people:"人员与证书",violations:"违章记录",blacklist:"黑名单"};return map[tab]||"相关方管理";}
function render(){UI.renderShell("partners",tab);var actions=tab==="ledger"&&canMaintain()?'<button class="btn btn-primary" onclick="openPartnerForm()">+ 新增相关方</button>':tab==="people"&&visiblePartners().some(canAdd)?'<button class="btn btn-primary" onclick="choosePartnerForPerson()">+ 新增人员</button>':tab==="violations"&&visiblePartners().some(canAdd)?'<button class="btn btn-primary" onclick="openViolationForm()">+ 登记违章</button>':"";UI.pageHeader(["相关方管理"],pageTitle(),actions);if(tab==="ledger")viewLedger();else if(tab==="people")viewPeople();else if(tab==="violations")viewViolations();else viewBlacklist();}
function viewLedger(){body.innerHTML=tabBar()+'<div class="filter-bar"><div class="f-item">关键词 <input id="partnerKeyword" placeholder="公司、联系人或服务内容"></div><div class="f-item">维护单位 <select id="partnerOrg"><option value="">全部</option>'+orgOptions("")+'</select></div><div class="f-item">合作状态 <select id="partnerStatus"><option value="">全部</option><option>合作中</option><option>已结束</option></select></div><button class="btn btn-outline btn-sm" onclick="renderLedgerRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>相关方编号</th><th>相关方公司</th><th>维护单位</th><th>服务内容</th><th>联系人</th><th>人员数量</th><th>合作状态</th><th>操作</th></tr></thead><tbody id="partnerRows"></tbody></table></div>';renderLedgerRows();}
function renderLedgerRows(){var key=((document.getElementById("partnerKeyword")||{}).value||"").trim().toLowerCase(),org=(document.getElementById("partnerOrg")||{}).value||"",status=(document.getElementById("partnerStatus")||{}).value||"";var rows=visiblePartners().filter(function(p){return (!org||p.maintainingOrg===org)&&(!status||p.status===status)&&(!key||[p.code,p.name,p.contact,p.serviceScope].join(" ").toLowerCase().indexOf(key)>-1);});document.getElementById("partnerRows").innerHTML=rows.map(function(p){return '<tr><td class="mono">'+esc(p.code)+'</td><td><b>'+esc(p.name)+'</b></td><td>'+esc(p.maintainingOrg)+'</td><td>'+esc(p.serviceScope)+'</td><td>'+esc(p.contact||"-")+'<br><span class="muted">'+esc(p.phone||"-")+'</span></td><td>'+((p.people||[]).length)+' 人</td><td>'+tag(p.status,p.status==="合作中"?"tag-green":"tag-gray")+'</td><td>'+(canMaintain(p)?'<button class="btn btn-text" onclick="openPartnerForm(\''+p.id+'\')">编辑</button>':'')+'<button class="btn btn-text" onclick="showPartnerPeople(\''+p.id+'\')">查看人员</button></td></tr>';}).join("")||'<tr><td colspan="8">'+UI.empty("暂无符合条件的相关方")+'</td></tr>';}
function partnerForm(p){p=p||{};return '<div class="form-grid"><div class="form-item"><span class="form-label">相关方公司 <span class="req">*</span></span><input id="pfName" value="'+esc(p.name||"")+'" placeholder="填写公司全称"></div><div class="form-item"><span class="form-label">维护单位 <span class="req">*</span></span><select id="pfOrg">'+orgOptions(p.maintainingOrg||"铸锻件分公司")+'</select></div><div class="form-item full"><span class="form-label">服务内容 <span class="req">*</span></span><input id="pfScope" value="'+esc(p.serviceScope||"")+'" placeholder="如：设备检修、物流装卸"></div><div class="form-item"><span class="form-label">联系人</span><input id="pfContact" value="'+esc(p.contact||"")+'"></div><div class="form-item"><span class="form-label">联系电话</span><input id="pfPhone" value="'+esc(p.phone||"")+'"></div><div class="form-item"><span class="form-label">合作状态</span><select id="pfStatus"><option '+((p.status||"合作中")==="合作中"?"selected":"")+'>合作中</option><option '+(p.status==="已结束"?"selected":"")+'>已结束</option></select></div></div>';}
function openPartnerForm(id){var p=id?App.partner.byId(id):null;if(p&&!canMaintain(p)){App.toast("仅可维护本单位相关方数据","warn");return;}var m=UI.modal(partnerForm(p),{title:id?"编辑相关方":"新增相关方",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="partnerSave">保存</button>'});document.getElementById("partnerSave").onclick=function(){var result=App.partner.savePartner({name:document.getElementById("pfName").value.trim(),maintainingOrg:document.getElementById("pfOrg").value,serviceScope:document.getElementById("pfScope").value.trim(),contact:document.getElementById("pfContact").value.trim(),phone:document.getElementById("pfPhone").value.trim(),status:document.getElementById("pfStatus").value},id);if(result.ok){m.close();render();App.toast(result.linkedPeople?"合作已结束，"+result.linkedPeople+" 名人员已自动转为离场":"相关方台账已保存","success");}};}
function showPartnerPeople(id){tab="people";location.hash="people";render();document.getElementById("peoplePartner").value=id;renderPeopleRows();}
function openPartner(id){var p=App.partner.byId(id);if(!p)return;var people=p.people||[];UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">相关方编号</span><span class="d-value mono">'+esc(p.code)+'</span></div><div class="d-item"><span class="d-label">维护单位</span><span class="d-value">'+esc(p.maintainingOrg)+'</span></div><div class="d-item full"><span class="d-label">服务/施工内容</span><span class="d-value">'+esc(p.serviceScope)+'</span></div><div class="d-item"><span class="d-label">联系人</span><span class="d-value">'+esc(p.contact||"-")+'</span></div><div class="d-item"><span class="d-label">联系电话</span><span class="d-value">'+esc(p.phone||"-")+'</span></div></div><div class="section-head"><h3>相关方人员</h3>'+(canMaintain(p)?'<button class="btn btn-outline btn-sm" onclick="closeDrawerAddPerson(\''+p.id+'\')">+ 新增人员</button>':'')+'</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>人员</th><th>岗位</th><th>证书</th><th>累计违章</th><th>状态</th><th>操作</th></tr></thead><tbody>'+people.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.phone||"-")+'</span></td><td>'+esc(x.job)+'</td><td>'+(x.certificates||[]).length+' 项</td><td>'+violationCount(x.id)+' 次</td><td>'+tag(blacklisted(x.id)?"黑名单":x.status,blacklisted(x.id)?"tag-error":"tag-green")+'</td><td><button class="btn btn-text" onclick="openPerson(\''+x.id+'\')">详情</button></td></tr>';}).join("")+'</tbody></table></div>',{title:"相关方详情 · "+p.name,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'+(canMaintain(p)?'<button class="btn btn-primary" onclick="closeDrawerEditPartner(\''+p.id+'\')">编辑相关方</button>':'')});}
function viewPeople(){body.innerHTML=tabBar()+'<div class="filter-bar"><div class="f-item">相关方公司 <select id="peoplePartner"><option value="">全部</option>'+partnerOptions("",false)+'</select></div><div class="f-item">关键词 <input id="partyPeopleKeyword" placeholder="姓名或岗位"></div><div class="f-item">人员状态 <select id="partyPeopleStatus"><option value="">全部</option><option>在场</option><option>离场</option></select></div><button class="btn btn-outline btn-sm" onclick="renderPeopleRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>人员姓名</th><th>相关方公司</th><th>岗位/工种</th><th>联系电话</th><th>证书</th><th>证书状态</th><th>人员状态</th><th>黑名单标记</th><th>操作</th></tr></thead><tbody id="partyPeopleRows"></tbody></table></div>';renderPeopleRows();}
function renderPeopleRows(){var key=((document.getElementById("partyPeopleKeyword")||{}).value||"").trim().toLowerCase(),status=(document.getElementById("partyPeopleStatus")||{}).value||"",partnerId=(document.getElementById("peoplePartner")||{}).value||"";var rows=peopleRows().filter(function(r){return (!partnerId||r.partner.id===partnerId)&&(!status||r.person.status===status)&&(!key||[r.person.name,r.person.job].join(" ").toLowerCase().indexOf(key)>-1);});document.getElementById("partyPeopleRows").innerHTML=rows.map(function(r){var cs=r.person.certificates||[],states=cs.map(certState),state=states.indexOf("已过期")>-1?"已过期":states.indexOf("临期")>-1?"临期":cs.length?"有效":"未维护";return '<tr><td><b>'+esc(r.person.name)+'</b></td><td>'+esc(r.partner.name)+'</td><td>'+esc(r.person.job)+'</td><td>'+esc(r.person.phone||"-")+'</td><td>'+cs.length+' 项</td><td>'+tag(state,state==="有效"?"tag-green":state==="已过期"?"tag-error":state==="临期"?"tag-warn":"tag-gray")+'</td><td>'+tag(r.person.status,r.person.status==="在场"?"tag-green":"tag-gray")+'</td><td>'+tag(blacklisted(r.person.id)?"已标记":"未标记",blacklisted(r.person.id)?"tag-error":"tag-gray")+'</td><td>'+(canMaintain(r.partner)?'<button class="btn btn-text" onclick="openPersonForm(\''+r.partner.id+'\',\''+r.person.id+'\')">编辑人员</button><button class="btn btn-text" onclick="openCertificateManager(\''+r.person.id+'\')">维护证书</button>':'')+'</td></tr>';}).join("")||'<tr><td colspan="9">'+UI.empty("暂无符合条件的相关方人员")+'</td></tr>';}
function choosePartnerForPerson(){openPersonForm();}
function personForm(p,partnerId){p=p||{};return '<div class="form-grid"><div class="form-item full"><span class="form-label">所属相关方公司 <span class="req">*</span></span><select id="ppPartner" '+(p.id?'disabled':'')+'>'+(p.id?partnerOptions(partnerId||"",true):activePartnerOptions(partnerId||""))+'</select></div><div class="form-item"><span class="form-label">人员姓名 <span class="req">*</span></span><input id="ppName" value="'+esc(p.name||"")+'"></div><div class="form-item"><span class="form-label">岗位/工种 <span class="req">*</span></span><input id="ppJob" value="'+esc(p.job||"")+'" placeholder="如：检修钳工"></div><div class="form-item"><span class="form-label">联系电话</span><input id="ppPhone" value="'+esc(p.phone||"")+'"></div><div class="form-item"><span class="form-label">人员状态</span><select id="ppStatus"><option '+((p.status||"在场")==="在场"?"selected":"")+'>在场</option><option '+(p.status==="离场"?"selected":"")+'>离场</option></select></div><div class="form-item"><span class="form-label">黑名单标记</span><input value="'+(blacklisted(p.id)?"已标记":"未标记")+'" disabled></div></div>';}
function openPersonForm(partnerId,id){var row=id?App.partner.personById(id):null,p=row?row.person:null;partnerId=partnerId||(visiblePartners().filter(canAdd)[0]||{}).id;var partner=App.partner.byId(partnerId);if(!partner||!canMaintain(partner)||(!id&&!canAdd(partner))){App.toast("当前没有可新增人员的合作中相关方","warn");return;}var m=UI.modal(personForm(p,partnerId),{title:id?"编辑相关方人员":"新增相关方人员",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="personSave">保存</button>'});document.getElementById("personSave").onclick=function(){var selectedId=id?partnerId:document.getElementById("ppPartner").value,result=App.partner.savePerson(selectedId,{name:document.getElementById("ppName").value.trim(),job:document.getElementById("ppJob").value.trim(),phone:document.getElementById("ppPhone").value.trim(),status:document.getElementById("ppStatus").value},id);if(result.ok){m.close();render();App.toast("相关方人员已保存","success");}};}
function openPerson(id){var row=App.partner.personById(id);if(!row)return;var p=row.person,cs=p.certificates||[],vs=App.partner.violationsOf(p.id);UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">人员姓名</span><span class="d-value">'+esc(p.name)+'</span></div><div class="d-item"><span class="d-label">岗位/工种</span><span class="d-value">'+esc(p.job)+'</span></div><div class="d-item"><span class="d-label">相关方公司</span><span class="d-value">'+esc(row.partner.name)+'</span></div><div class="d-item"><span class="d-label">维护单位</span><span class="d-value">'+esc(row.partner.maintainingOrg)+'</span></div><div class="d-item"><span class="d-label">累计违章</span><span class="d-value">'+vs.length+' 次</span></div><div class="d-item"><span class="d-label">状态</span><span class="d-value">'+tag(blacklisted(p.id)?"黑名单":p.status,blacklisted(p.id)?"tag-error":"tag-green")+'</span></div></div><div class="section-head"><h3>人员证书</h3>'+(canMaintain(row.partner)?'<button class="btn btn-outline btn-sm" onclick="closeDrawerAddCert(\''+p.id+'\')">+ 新增证书</button>':'')+'</div>'+(cs.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>证书名称</th><th>证书编号</th><th>有效期至</th><th>证书附件</th></tr></thead><tbody>'+cs.map(function(c){return '<tr><td>'+esc(c.name)+'</td><td class="mono">'+esc(c.number)+'</td><td>'+esc(c.expire)+'</td><td>'+attachment(c.attachmentName,c.attachmentType)+'</td></tr>';}).join("")+'</tbody></table></div>':UI.empty("暂未维护证书"))+'<div class="section-head"><h3>违章记录</h3></div>'+(vs.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th>地点</th><th>违章内容</th><th>处理结果</th></tr></thead><tbody>'+vs.map(function(v){return '<tr><td>'+esc(v.date)+'</td><td>'+esc(v.location)+'</td><td>'+esc(v.content)+'</td><td>'+esc(v.handling)+'</td></tr>';}).join("")+'</tbody></table></div>':UI.empty("暂无违章记录")),{title:"相关方人员详情 · "+p.name,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'+(canMaintain(row.partner)?'<button class="btn btn-primary" onclick="closeDrawerEditPerson(\''+row.partner.id+'\',\''+p.id+'\')">编辑人员</button>':'')});}
function openCertificateManager(personId){var row=App.partner.personById(personId);if(!row)return;var cs=row.person.certificates||[];UI.modal('<div class="section-head"><h3>'+esc(row.person.name)+' · 证书列表</h3>'+(canAdd(row.partner)?'<button class="btn btn-primary btn-sm" onclick="closeModalOpenCert(\''+personId+'\')">+ 新增证书</button>':'')+'</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>证书名称</th><th>证书编号</th><th>有效期至</th><th>状态</th><th>附件</th><th>操作</th></tr></thead><tbody>'+cs.map(function(c){var state=certState(c);return '<tr><td>'+esc(c.name)+'</td><td class="mono">'+esc(c.number)+'</td><td>'+esc(c.expire)+'</td><td>'+tag(state,state==="有效"?"tag-green":state==="已过期"?"tag-error":"tag-warn")+'</td><td>'+attachment(c.attachmentName,c.attachmentType)+'</td><td>'+(canMaintain(row.partner)?'<button class="btn btn-text" onclick="closeModalOpenCert(\''+personId+'\',\''+c.id+'\')">编辑</button>':'')+'</td></tr>';}).join("")+'</tbody></table></div>'+(cs.length?'':UI.empty("暂未维护证书"))+(row.partner.status==="已结束"?'<div class="hint-line">合作已结束，不再新增证书；已有证书仍可纠正。</div>':''),{title:"维护人员证书",size:"lg",footer:'<button class="btn btn-primary" data-close>完成</button>'});}
function closeModalOpenCert(personId,id){document.querySelectorAll(".modal").forEach(function(x){x.remove();});openCertForm(personId,id);}
function openCertForm(personId,id){var row=App.partner.personById(personId);if(!row||!canMaintain(row.partner)||(!id&&!canAdd(row.partner))){App.toast("合作已结束，不能新增人员证书","warn");return;}var cert=id?(row.person.certificates||[]).filter(function(x){return x.id===id;})[0]:null;cert=cert||{};var m=UI.modal('<div class="form-grid"><div class="form-item"><span class="form-label">持证人员</span><input value="'+esc(row.person.name)+'" disabled></div><div class="form-item"><span class="form-label">证书名称 <span class="req">*</span></span><input id="pcName" value="'+esc(cert.name||"")+'"></div><div class="form-item"><span class="form-label">证书编号 <span class="req">*</span></span><input id="pcNo" value="'+esc(cert.number||"")+'"></div><div class="form-item"><span class="form-label">有效期至 <span class="req">*</span></span><input id="pcExpire" type="date" value="'+esc(cert.expire||"")+'"></div><div class="form-item full"><span class="form-label">证书附件 <span class="req">*</span></span><input id="pcFile" type="file" accept="image/*,.pdf"><div class="form-help">'+(cert.attachmentName?'当前附件：'+esc(cert.attachmentName)+'；不重新上传则保留原附件。':'支持上传证书图片或 PDF。')+'</div></div></div>',{title:id?"编辑人员证书":"新增人员证书",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="certSave">保存证书</button>'});document.getElementById("certSave").onclick=function(){var f=document.getElementById("pcFile").files[0],result=App.partner.saveCertificate(personId,{name:document.getElementById("pcName").value.trim(),number:document.getElementById("pcNo").value.trim(),expire:document.getElementById("pcExpire").value,attachmentName:f?f.name:cert.attachmentName||"",attachmentType:f?(f.type==="application/pdf"?"PDF":"图片"):cert.attachmentType||""},id);if(result.ok){m.close();render();App.toast("人员证书已保存","success");}};}
function viewViolations(){body.innerHTML=tabBar()+'<div class="filter-bar"><div class="f-item">关键词 <input id="violationKeyword" placeholder="人员、公司或违章内容"></div><div class="f-item">相关方公司 <select id="violationPartner"><option value="">全部</option>'+partnerOptions("",false)+'</select></div><button class="btn btn-outline btn-sm" onclick="renderViolationRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>违章编号</th><th>相关方公司</th><th>违章人员</th><th>违章日期</th><th>违章地点</th><th>违章内容</th><th>处理结果</th><th>证据附件</th><th>操作</th></tr></thead><tbody id="violationRows"></tbody></table></div>';renderViolationRows();}
function renderViolationRows(){var key=((document.getElementById("violationKeyword")||{}).value||"").trim().toLowerCase(),partnerId=(document.getElementById("violationPartner")||{}).value||"";var rows=(App.partyViolations||[]).filter(function(v){var r=App.partner.personById(v.personId);return r&&inScope(r.partner)&&(!partnerId||r.partner.id===partnerId)&&(!key||[r.person.name,r.partner.name,v.content].join(" ").toLowerCase().indexOf(key)>-1);});document.getElementById("violationRows").innerHTML=rows.map(function(v){var r=App.partner.personById(v.personId);return '<tr><td class="mono">'+esc(v.code)+'</td><td>'+esc(r.partner.name)+'</td><td><b>'+esc(r.person.name)+'</b></td><td>'+esc(v.date)+'</td><td>'+esc(v.location)+'</td><td>'+esc(v.content)+'</td><td>'+esc(v.handling)+'</td><td>'+attachment(v.evidenceName,"附件")+'</td><td>'+(canMaintain(r.partner)?'<button class="btn btn-text" onclick="openViolationForm(\''+v.id+'\')">编辑</button><button class="btn btn-text danger" onclick="deleteViolation(\''+v.id+'\')">删除</button>':'')+'</td></tr>';}).join("")||'<tr><td colspan="9">'+UI.empty("暂无符合条件的违章记录")+'</td></tr>';}
function violationPersonOptions(partnerId,selected){var p=App.partner.byId(partnerId);return ((p&&p.people)||[]).map(function(x){return '<option value="'+x.id+'" '+(selected===x.id?'selected':'')+'>'+esc(x.name)+' · '+esc(x.job)+'</option>';}).join("");}
function refreshViolationPeople(selected){var partnerId=document.getElementById("pvPartner").value;document.getElementById("pvPerson").innerHTML=violationPersonOptions(partnerId,selected||"");}
function openViolationForm(id){var item=id?App.partner.violationById(id):null,row=item?App.partner.personById(item.personId):null,ps=visiblePartners().filter(id?canMaintain:canAdd);if(!ps.length){App.toast("当前没有可登记违章的合作中相关方","warn");return;}var selectedPartner=row?row.partner.id:ps[0].id,selectedPerson=item?item.personId:"",selectOptions=ps.map(function(p){return '<option value="'+p.id+'" '+(selectedPartner===p.id?'selected':'')+'>'+esc(p.name)+'</option>';}).join("");var m=UI.modal('<div class="form-grid"><div class="form-item"><span class="form-label">相关方公司 <span class="req">*</span></span><select id="pvPartner" onchange="refreshViolationPeople()">'+selectOptions+'</select></div><div class="form-item"><span class="form-label">违章人员 <span class="req">*</span></span><select id="pvPerson">'+violationPersonOptions(selectedPartner,selectedPerson)+'</select></div><div class="form-item"><span class="form-label">违章日期 <span class="req">*</span></span><input id="pvDate" type="date" value="'+esc(item?item.date:dateNow())+'"></div><div class="form-item"><span class="form-label">违章地点 <span class="req">*</span></span><input id="pvLocation" value="'+esc(item?item.location:"")+'"></div><div class="form-item full"><span class="form-label">违章内容 <span class="req">*</span></span><textarea id="pvContent">'+esc(item?item.content:"")+'</textarea></div><div class="form-item"><span class="form-label">处理结果</span><input id="pvHandling" value="'+esc(item?item.handling:"现场教育并记录")+'"></div><div class="form-item"><span class="form-label">证据附件</span><input id="pvFile" type="file" accept="image/*,.pdf"><div class="form-help">'+(item&&item.evidenceName?'当前附件：'+esc(item.evidenceName):'可上传图片或 PDF')+'</div></div></div>',{title:id?"编辑违章记录":"登记违章",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="violationSave">保存</button>'});document.getElementById("violationSave").onclick=function(){var f=document.getElementById("pvFile").files[0],result=App.partner.saveViolation({personId:document.getElementById("pvPerson").value,date:document.getElementById("pvDate").value,location:document.getElementById("pvLocation").value.trim(),content:document.getElementById("pvContent").value.trim(),handling:document.getElementById("pvHandling").value.trim(),evidenceName:f?f.name:(item?item.evidenceName:"")},id);if(result.ok){m.close();render();}};}
function showPersonViolations(personId){var row=App.partner.personById(personId);tab="violations";location.hash="violations";render();document.getElementById("violationPartner").value=row.partner.id;document.getElementById("violationKeyword").value=row.person.name;renderViolationRows();}
function deleteViolation(id){var item=App.partner.violationById(id);if(!item)return;var m=UI.modal('<div class="alert warn"><b>确认删除违章记录 '+esc(item.code)+'？</b><br>删除后将重新计算该人员的累计违章次数和黑名单标记。</div>',{title:"删除违章记录",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-danger" id="violationDeleteConfirm">确认删除</button>'});document.getElementById("violationDeleteConfirm").onclick=function(){var result=App.partner.deleteViolation(id);if(result.ok){m.close();renderViolationRows();}};}
function viewBlacklist(){var rows=peopleRows().filter(function(r){return blacklisted(r.person.id);});body.innerHTML=tabBar()+'<div class="filter-bar"><div class="f-item">关键词 <input id="blackKeyword" placeholder="人员或公司"></div><button class="btn btn-outline btn-sm" onclick="renderBlacklistRows()">查询</button><span class="muted">累计违章达到 3 次自动标记，仅作台账提示。</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>人员姓名</th><th>相关方公司</th><th>岗位/工种</th><th>累计违章</th><th>最近违章日期</th><th>黑名单标记</th><th>操作</th></tr></thead><tbody id="blacklistRows"></tbody></table></div>';renderBlacklistRows();}
function renderBlacklistRows(){var key=((document.getElementById("blackKeyword")||{}).value||"").trim().toLowerCase(),rows=peopleRows().filter(function(r){return blacklisted(r.person.id)&&(!key||[r.person.name,r.partner.name].join(" ").toLowerCase().indexOf(key)>-1);});document.getElementById("blacklistRows").innerHTML=rows.map(function(r){var vs=App.partner.violationsOf(r.person.id).slice().sort(function(a,b){return b.date.localeCompare(a.date);}),last=vs[0];return '<tr><td><b>'+esc(r.person.name)+'</b></td><td>'+esc(r.partner.name)+'</td><td>'+esc(r.person.job)+'</td><td><span class="tag tag-error">'+vs.length+' 次</span></td><td>'+esc(last?last.date:"-")+'</td><td>'+tag("黑名单","tag-error")+'</td><td><button class="btn btn-text" onclick="showPersonViolations(\''+r.person.id+'\')">查看违章</button></td></tr>';}).join("")||'<tr><td colspan="7">'+UI.empty("当前范围暂无黑名单人员")+'</td></tr>';}
function openAttachment(name){UI.modal('<div class="alert info">原型演示附件：<b>'+esc(name)+'</b><br>真实系统将支持在此查看已上传的图片或 PDF 原文件。</div>',{title:"查看附件",footer:'<button class="btn btn-primary" data-close>关闭</button>'});}
function closeDrawerEditPartner(id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openPartnerForm(id);}
function closeDrawerAddPerson(id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openPersonForm(id);}
function closeDrawerEditPerson(pid,id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openPersonForm(pid,id);}
function closeDrawerAddCert(id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openCertForm(id);}
window.goTab=goTab;window.renderLedgerRows=renderLedgerRows;window.openPartnerForm=openPartnerForm;window.showPartnerPeople=showPartnerPeople;window.renderPeopleRows=renderPeopleRows;window.choosePartnerForPerson=choosePartnerForPerson;window.openPersonForm=openPersonForm;window.openCertificateManager=openCertificateManager;window.closeModalOpenCert=closeModalOpenCert;window.openCertForm=openCertForm;window.renderViolationRows=renderViolationRows;window.openViolationForm=openViolationForm;window.refreshViolationPeople=refreshViolationPeople;window.showPersonViolations=showPersonViolations;window.deleteViolation=deleteViolation;window.renderBlacklistRows=renderBlacklistRows;window.openAttachment=openAttachment;
var retryKey="tz_anquan_parties_retry";
try{render();sessionStorage.removeItem(retryKey);}catch(error){
  try{
    if(!sessionStorage.getItem(retryKey)){
      sessionStorage.setItem(retryKey,"1");
      sessionStorage.removeItem(App._stateKey);
      location.reload();
    }else body.innerHTML='<div class="alert error">相关方页面初始化失败，请关闭当前页面后重新打开。</div>';
  }catch(ignore){body.innerHTML='<div class="alert error">相关方页面初始化失败，请关闭当前页面后重新打开。</div>';}
}
})();
</script>
