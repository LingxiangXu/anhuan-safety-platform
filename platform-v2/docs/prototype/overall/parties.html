<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>相关方管理 · 安全管理平台</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <header class="topbar"></header>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <main class="content"><div class="page-header"></div><div class="page-body" id="pageBody"></div></main>
  </div>
</div>
<script src="assets/store.js?v=20260831-parties-v2"></script><script src="assets/ui.js?v=20260831-parties-v2"></script>
<script>
(function(){
"use strict";
var body=document.getElementById("pageBody"),params=new URLSearchParams(location.search),tab=location.hash.slice(1)||params.get("tab")||"ledger";
function esc(v){return String(v===undefined||v===null?"":v).replace(/[&<>\"]/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"})[c];});}
function dateNow(){return new Date().toISOString().slice(0,10);}
function canCrossView(){return ["group_safety","company_safety"].indexOf(App.currentRole)>-1;}
function inMaintainingOrg(partner){return !partner||(App.currentOrg||"").indexOf(partner.maintainingOrg)>-1||App.inCurrentOrgScope(partner.maintainingOrg);}
function inScope(partner){return canCrossView()||inMaintainingOrg(partner);}
function canMaintain(partner){return ["company_safety","section_manager","team_leader"].indexOf(App.currentRole)>-1&&inMaintainingOrg(partner);}
function tag(text,kind){return '<span class="tag '+(kind||"tag-gray")+'">'+esc(text)+"</span>";}
function visiblePartners(){return (App.partners||[]).filter(inScope);}
function peopleRows(){var rows=[];visiblePartners().forEach(function(p){(p.people||[]).forEach(function(person){rows.push({partner:p,person:person});});});return rows;}
function violationCount(id){return App.partner.violationCount(id);}
function blacklisted(id){return App.partner.isBlacklisted(id);}
function attachment(name,type){return name?'<button class="btn btn-text" data-name="'+esc(name)+'" onclick="openAttachment(this.dataset.name)">'+esc(name)+(type?"（"+esc(type)+"）":"")+"</button>":'<span class="muted">未上传</span>';}
function orgOptions(selected){return ["铸锻件分公司","智能加工配送中心"].map(function(x){return '<option '+(selected===x?'selected':'')+'>'+x+'</option>';}).join("");}
function tabBar(){return '<div class="tabs"><button class="tab '+(tab==="ledger"?"active":"")+'" onclick="goTab(\'ledger\')">相关方台账</button><button class="tab '+(tab==="people"?"active":"")+'" onclick="goTab(\'people\')">人员与证书</button><button class="tab '+(tab==="violations"?"active":"")+'" onclick="goTab(\'violations\')">违章记录</button><button class="tab '+(tab==="blacklist"?"active":"")+'" onclick="goTab(\'blacklist\')">黑名单</button></div>';}
function goTab(key){if(tab===key)return;tab=key;location.hash=key;render();}
window.addEventListener("hashchange",function(){var next=location.hash.slice(1);if(["ledger","people","violations","blacklist"].indexOf(next)>-1&&next!==tab){tab=next;render();}});
function pageTitle(){var map={ledger:"相关方台账",people:"人员与证书",violations:"违章记录",blacklist:"黑名单"};return map[tab]||"相关方管理";}
function render(){UI.renderShell("partners",tab);UI.pageHeader(["相关方管理"],pageTitle(),tab==="ledger"&&canMaintain()?'<button class="btn btn-primary" onclick="openPartnerForm()">+ 新增相关方</button>':tab==="people"?'<button class="btn btn-primary" onclick="choosePartnerForPerson()">+ 新增人员</button>':tab==="violations"?'<button class="btn btn-primary" onclick="openViolationForm()">+ 登记违章</button>':"");if(tab==="ledger")viewLedger();else if(tab==="people")viewPeople();else if(tab==="violations")viewViolations();else viewBlacklist();}
function viewLedger(){var ps=visiblePartners(),allPeople=peopleRows(),black=allPeople.filter(function(r){return blacklisted(r.person.id);});body.innerHTML=tabBar()+'<div class="alert info">相关方由各分子公司维护本单位数据；集团/公司安全管理人员可跨单位查看。公司仅维护基本信息，人员证书单独维护；累计 3 次违章的人员自动标记黑名单。</div><div class="kpi-grid g4"><div class="kpi"><div class="k-label">相关方公司</div><div class="k-num blue">'+ps.length+'</div><div class="k-sub">当前可查看范围</div></div><div class="kpi"><div class="k-label">相关方人员</div><div class="k-num green">'+allPeople.length+'</div><div class="k-sub">公司下在册人员</div></div><div class="kpi"><div class="k-label">人员证书</div><div class="k-num">'+allPeople.reduce(function(s,r){return s+(r.person.certificates||[]).length;},0)+'</div><div class="k-sub">已上传图片或 PDF</div></div><div class="kpi clickable" onclick="goTab(\'blacklist\')"><div class="k-label">黑名单人员</div><div class="k-num danger">'+black.length+'</div><div class="k-sub">累计违章 3 次及以上</div></div></div><div class="filter-bar" style="margin-top:16px"><div class="f-item">关键词 <input id="partnerKeyword" placeholder="公司、联系人或服务内容"></div><div class="f-item">维护单位 <select id="partnerOrg"><option value="">全部</option>'+orgOptions("")+'</select></div><button class="btn btn-outline btn-sm" onclick="renderLedgerRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>相关方编号</th><th>相关方公司</th><th>维护单位</th><th>服务/施工内容</th><th>联系人</th><th>人员</th><th>黑名单</th><th>状态</th><th>操作</th></tr></thead><tbody id="partnerRows"></tbody></table></div>';renderLedgerRows();}
function renderLedgerRows(){var key=((document.getElementById("partnerKeyword")||{}).value||"").trim().toLowerCase(),org=(document.getElementById("partnerOrg")||{}).value||"";var rows=visiblePartners().filter(function(p){return (!org||p.maintainingOrg===org)&&(!key||[p.code,p.name,p.contact,p.serviceScope].join(" ").toLowerCase().indexOf(key)>-1);});document.getElementById("partnerRows").innerHTML=rows.map(function(p){var b=(p.people||[]).filter(function(x){return blacklisted(x.id);}).length;return '<tr><td class="mono">'+esc(p.code)+'</td><td><b>'+esc(p.name)+'</b><br><span class="muted">更新于 '+esc(p.updatedAt)+'</span></td><td>'+esc(p.maintainingOrg)+'</td><td>'+esc(p.serviceScope)+'</td><td>'+esc(p.contact)+'<br><span class="muted">'+esc(p.phone)+'</span></td><td>'+p.people.length+' 人</td><td>'+(b?tag(b+' 人','tag-error'):tag('无','tag-gray'))+'</td><td>'+tag(p.status,'tag-green')+'</td><td><button class="btn btn-text" onclick="openPartner(\''+p.id+'\')">详情</button>'+(canMaintain(p)?'<button class="btn btn-text" onclick="openPartnerForm(\''+p.id+'\')">编辑</button>':'')+'</td></tr>';}).join("")||'<tr><td colspan="9">'+UI.empty("暂无符合条件的相关方")+'</td></tr>';}
function partnerForm(p){p=p||{};return '<div class="form-grid"><div class="form-item"><span class="form-label">相关方公司 <span class="req">*</span></span><input id="pfName" value="'+esc(p.name||"")+'" placeholder="填写公司全称"></div><div class="form-item"><span class="form-label">维护单位 <span class="req">*</span></span><select id="pfOrg">'+orgOptions(p.maintainingOrg||"铸锻件分公司")+'</select></div><div class="form-item full"><span class="form-label">服务/施工内容 <span class="req">*</span></span><input id="pfScope" value="'+esc(p.serviceScope||"")+'" placeholder="如：设备检修、物流装卸"></div><div class="form-item"><span class="form-label">联系人</span><input id="pfContact" value="'+esc(p.contact||"")+'"></div><div class="form-item"><span class="form-label">联系电话</span><input id="pfPhone" value="'+esc(p.phone||"")+'"></div></div>';}
function openPartnerForm(id){var p=id?App.partner.byId(id):null;if(p&&!canMaintain(p)){App.toast("仅可维护本单位相关方数据","warn");return;}var m=UI.modal(partnerForm(p),{title:id?"编辑相关方":"新增相关方",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="partnerSave">保存</button>'});document.getElementById("partnerSave").onclick=function(){var result=App.partner.savePartner({name:document.getElementById("pfName").value.trim(),maintainingOrg:document.getElementById("pfOrg").value,serviceScope:document.getElementById("pfScope").value.trim(),contact:document.getElementById("pfContact").value.trim(),phone:document.getElementById("pfPhone").value.trim()},id);if(result.ok){m.close();render();App.toast("相关方台账已保存","success");}};}
function openPartner(id){var p=App.partner.byId(id);if(!p)return;var people=p.people||[];UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">相关方编号</span><span class="d-value mono">'+esc(p.code)+'</span></div><div class="d-item"><span class="d-label">维护单位</span><span class="d-value">'+esc(p.maintainingOrg)+'</span></div><div class="d-item full"><span class="d-label">服务/施工内容</span><span class="d-value">'+esc(p.serviceScope)+'</span></div><div class="d-item"><span class="d-label">联系人</span><span class="d-value">'+esc(p.contact||"-")+'</span></div><div class="d-item"><span class="d-label">联系电话</span><span class="d-value">'+esc(p.phone||"-")+'</span></div></div><div class="section-head"><h3>相关方人员</h3>'+(canMaintain(p)?'<button class="btn btn-outline btn-sm" onclick="closeDrawerAddPerson(\''+p.id+'\')">+ 新增人员</button>':'')+'</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>人员</th><th>岗位</th><th>证书</th><th>累计违章</th><th>状态</th><th>操作</th></tr></thead><tbody>'+people.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b><br><span class="muted">'+esc(x.phone||"-")+'</span></td><td>'+esc(x.job)+'</td><td>'+(x.certificates||[]).length+' 项</td><td>'+violationCount(x.id)+' 次</td><td>'+tag(blacklisted(x.id)?"黑名单":x.status,blacklisted(x.id)?"tag-error":"tag-green")+'</td><td><button class="btn btn-text" onclick="openPerson(\''+x.id+'\')">详情</button></td></tr>';}).join("")+'</tbody></table></div>',{title:"相关方详情 · "+p.name,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'+(canMaintain(p)?'<button class="btn btn-primary" onclick="closeDrawerEditPartner(\''+p.id+'\')">编辑相关方</button>':'')});}
function viewPeople(){var rows=peopleRows();body.innerHTML=tabBar()+'<div class="alert info">相关方人员不纳入 OA 组织人员。证书必须上传图片或 PDF 附件；公司资质不在本期维护范围。</div><div class="filter-bar"><div class="f-item">关键词 <input id="partyPeopleKeyword" placeholder="人员、公司或岗位"></div><div class="f-item">状态 <select id="partyPeopleStatus"><option value="">全部</option><option>在场</option><option>黑名单</option></select></div><button class="btn btn-outline btn-sm" onclick="renderPeopleRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>人员</th><th>相关方公司</th><th>维护单位</th><th>岗位</th><th>证书</th><th>累计违章</th><th>状态</th><th>操作</th></tr></thead><tbody id="partyPeopleRows"></tbody></table></div>';renderPeopleRows();}
function renderPeopleRows(){var key=((document.getElementById("partyPeopleKeyword")||{}).value||"").trim().toLowerCase(),status=(document.getElementById("partyPeopleStatus")||{}).value||"";var rows=peopleRows().filter(function(r){var s=blacklisted(r.person.id)?"黑名单":r.person.status;return (!status||s===status)&&(!key||[r.partner.name,r.person.name,r.person.job].join(" ").toLowerCase().indexOf(key)>-1);});document.getElementById("partyPeopleRows").innerHTML=rows.map(function(r){var cs=r.person.certificates||[];return '<tr><td><b>'+esc(r.person.name)+'</b><br><span class="muted">'+esc(r.person.phone||"-")+'</span></td><td>'+esc(r.partner.name)+'</td><td>'+esc(r.partner.maintainingOrg)+'</td><td>'+esc(r.person.job)+'</td><td>'+(cs.length?cs.map(function(c){return attachment(c.attachmentName,c.attachmentType);}).join("<br>"):'<span class="muted">未维护</span>')+'</td><td>'+violationCount(r.person.id)+' 次</td><td>'+tag(blacklisted(r.person.id)?"黑名单":r.person.status,blacklisted(r.person.id)?"tag-error":"tag-green")+'</td><td><button class="btn btn-text" onclick="openPerson(\''+r.person.id+'\')">详情</button>'+(canMaintain(r.partner)?'<button class="btn btn-text" onclick="openPersonForm(\''+r.partner.id+'\',\''+r.person.id+'\')">编辑</button>':'')+'</td></tr>';}).join("")||'<tr><td colspan="8">'+UI.empty("暂无符合条件的相关方人员")+'</td></tr>';}
function choosePartnerForPerson(){var ps=visiblePartners().filter(canMaintain);if(!ps.length){App.toast("当前角色没有可维护的相关方公司","warn");return;}if(ps.length===1){openPersonForm(ps[0].id);return;}UI.modal('<div class="form-item"><span class="form-label">选择相关方公司</span><select id="personPartner">'+ps.map(function(p){return '<option value="'+p.id+'">'+esc(p.name)+' · '+esc(p.maintainingOrg)+'</option>';}).join("")+'</select></div>',{title:"新增相关方人员",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="selectPartner">下一步</button>'});document.getElementById("selectPartner").onclick=function(){var id=document.getElementById("personPartner").value;document.querySelectorAll(".modal").forEach(function(x){x.remove();});openPersonForm(id);};}
function personForm(p){p=p||{};return '<div class="form-grid"><div class="form-item"><span class="form-label">人员姓名 <span class="req">*</span></span><input id="ppName" value="'+esc(p.name||"")+'"></div><div class="form-item"><span class="form-label">岗位/工种 <span class="req">*</span></span><input id="ppJob" value="'+esc(p.job||"")+'" placeholder="如：检修钳工"></div><div class="form-item"><span class="form-label">联系电话</span><input id="ppPhone" value="'+esc(p.phone||"")+'"></div><div class="form-item"><span class="form-label">当前状态</span><input value="'+esc(blacklisted(p.id)?"黑名单":p.status||"在场")+'" disabled></div></div>';}
function openPersonForm(partnerId,id){var row=id?App.partner.personById(id):null,p=row?row.person:null,partner=App.partner.byId(partnerId);if(!partner||!canMaintain(partner)){App.toast("仅可维护本单位相关方人员","warn");return;}var m=UI.modal(personForm(p),{title:id?"编辑相关方人员":"新增相关方人员 · "+partner.name,size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="personSave">保存</button>'});document.getElementById("personSave").onclick=function(){var result=App.partner.savePerson(partnerId,{name:document.getElementById("ppName").value.trim(),job:document.getElementById("ppJob").value.trim(),phone:document.getElementById("ppPhone").value.trim()},id);if(result.ok){m.close();render();App.toast("相关方人员已保存","success");}};}
function openPerson(id){var row=App.partner.personById(id);if(!row)return;var p=row.person,cs=p.certificates||[],vs=App.partner.violationsOf(p.id);UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">人员姓名</span><span class="d-value">'+esc(p.name)+'</span></div><div class="d-item"><span class="d-label">岗位/工种</span><span class="d-value">'+esc(p.job)+'</span></div><div class="d-item"><span class="d-label">相关方公司</span><span class="d-value">'+esc(row.partner.name)+'</span></div><div class="d-item"><span class="d-label">维护单位</span><span class="d-value">'+esc(row.partner.maintainingOrg)+'</span></div><div class="d-item"><span class="d-label">累计违章</span><span class="d-value">'+vs.length+' 次</span></div><div class="d-item"><span class="d-label">状态</span><span class="d-value">'+tag(blacklisted(p.id)?"黑名单":p.status,blacklisted(p.id)?"tag-error":"tag-green")+'</span></div></div><div class="section-head"><h3>人员证书</h3>'+(canMaintain(row.partner)?'<button class="btn btn-outline btn-sm" onclick="closeDrawerAddCert(\''+p.id+'\')">+ 新增证书</button>':'')+'</div>'+(cs.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>证书名称</th><th>证书编号</th><th>有效期至</th><th>证书附件</th></tr></thead><tbody>'+cs.map(function(c){return '<tr><td>'+esc(c.name)+'</td><td class="mono">'+esc(c.number)+'</td><td>'+esc(c.expire)+'</td><td>'+attachment(c.attachmentName,c.attachmentType)+'</td></tr>';}).join("")+'</tbody></table></div>':UI.empty("暂未维护证书"))+'<div class="section-head"><h3>违章记录</h3></div>'+(vs.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>日期</th><th>地点</th><th>违章内容</th><th>处理结果</th></tr></thead><tbody>'+vs.map(function(v){return '<tr><td>'+esc(v.date)+'</td><td>'+esc(v.location)+'</td><td>'+esc(v.content)+'</td><td>'+esc(v.handling)+'</td></tr>';}).join("")+'</tbody></table></div>':UI.empty("暂无违章记录")),{title:"相关方人员详情 · "+p.name,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'+(canMaintain(row.partner)?'<button class="btn btn-primary" onclick="closeDrawerEditPerson(\''+row.partner.id+'\',\''+p.id+'\')">编辑人员</button>':'')});}
function openCertForm(personId){var row=App.partner.personById(personId);if(!row||!canMaintain(row.partner)){App.toast("仅可维护本单位人员证书","warn");return;}var m=UI.modal('<div class="form-grid"><div class="form-item"><span class="form-label">持证人员</span><input value="'+esc(row.person.name)+'" disabled></div><div class="form-item"><span class="form-label">证书名称 <span class="req">*</span></span><input id="pcName" placeholder="填写证书名称"></div><div class="form-item"><span class="form-label">证书编号 <span class="req">*</span></span><input id="pcNo"></div><div class="form-item"><span class="form-label">有效期至 <span class="req">*</span></span><input id="pcExpire" type="date"></div><div class="form-item full"><span class="form-label">证书附件 <span class="req">*</span></span><input id="pcFile" type="file" accept="image/*,.pdf"><div class="form-help">支持上传证书图片或 PDF；原型仅保存附件名称。</div></div></div>',{title:"新增人员证书",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="certSave">保存证书</button>'});document.getElementById("certSave").onclick=function(){var f=document.getElementById("pcFile").files[0],result=App.partner.saveCertificate(personId,{name:document.getElementById("pcName").value.trim(),number:document.getElementById("pcNo").value.trim(),expire:document.getElementById("pcExpire").value,attachmentName:f?f.name:"",attachmentType:f?(f.type==="application/pdf"?"PDF":"图片"):""});if(result.ok){m.close();render();App.toast("人员证书已保存","success");}};}
function viewViolations(){body.innerHTML=tabBar()+'<div class="alert warn">每条违章记录均关联一名相关方人员；可上传图片或 PDF 作为留存附件。累计第 3 次违章时，系统仅自动标记黑名单，不限制其他业务。</div><div class="filter-bar"><div class="f-item">关键词 <input id="violationKeyword" placeholder="人员、公司或违章内容"></div><div class="f-item">维护单位 <select id="violationOrg"><option value="">全部</option>'+orgOptions("")+'</select></div><button class="btn btn-outline btn-sm" onclick="renderViolationRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>违章编号</th><th>相关方人员</th><th>相关方公司</th><th>维护单位</th><th>违章时间/地点</th><th>违章内容</th><th>证据附件</th><th>处理结果</th><th>操作</th></tr></thead><tbody id="violationRows"></tbody></table></div>';renderViolationRows();}
function renderViolationRows(){var key=((document.getElementById("violationKeyword")||{}).value||"").trim().toLowerCase(),org=(document.getElementById("violationOrg")||{}).value||"";var rows=(App.partyViolations||[]).filter(function(v){var r=App.partner.personById(v.personId);return r&&inScope(r.partner)&&(!org||r.partner.maintainingOrg===org)&&(!key||[r.person.name,r.partner.name,v.content].join(" ").toLowerCase().indexOf(key)>-1);});document.getElementById("violationRows").innerHTML=rows.map(function(v){var r=App.partner.personById(v.personId);return '<tr><td class="mono">'+esc(v.code)+'</td><td><b>'+esc(r.person.name)+'</b><br><span class="muted">累计 '+violationCount(r.person.id)+' 次</span></td><td>'+esc(r.partner.name)+'</td><td>'+esc(r.partner.maintainingOrg)+'</td><td>'+esc(v.date)+'<br><span class="muted">'+esc(v.location)+'</span></td><td>'+esc(v.content)+'</td><td>'+attachment(v.evidenceName,"图片/PDF")+'</td><td>'+esc(v.handling)+'</td><td><button class="btn btn-text" onclick="openPerson(\''+r.person.id+'\')">查看人员</button></td></tr>';}).join("")||'<tr><td colspan="9">'+UI.empty("暂无符合条件的违章记录")+'</td></tr>';}
function openViolationForm(){var rows=peopleRows().filter(function(r){return canMaintain(r.partner);});if(!rows.length){App.toast("当前角色没有可登记违章的相关方人员","warn");return;}var m=UI.modal('<div class="form-grid"><div class="form-item full"><span class="form-label">相关方人员 <span class="req">*</span></span><select id="pvPerson">'+rows.map(function(r){return '<option value="'+r.person.id+'">'+esc(r.person.name)+' · '+esc(r.partner.name)+' · '+esc(r.partner.maintainingOrg)+'</option>';}).join("")+'</select></div><div class="form-item"><span class="form-label">违章日期 <span class="req">*</span></span><input id="pvDate" type="date" value="'+dateNow()+'"></div><div class="form-item"><span class="form-label">违章等级</span><select id="pvLevel"><option>一般违章</option><option>严重违章</option></select></div><div class="form-item full"><span class="form-label">违章地点 <span class="req">*</span></span><input id="pvLocation" placeholder="填写发生地点"></div><div class="form-item full"><span class="form-label">违章内容 <span class="req">*</span></span><textarea id="pvContent" placeholder="填写事实描述"></textarea></div><div class="form-item"><span class="form-label">处理结果</span><input id="pvHandling" value="现场教育并记录"></div><div class="form-item"><span class="form-label">证据附件</span><input id="pvFile" type="file" accept="image/*,.pdf"></div></div>',{title:"登记相关方人员违章",size:"lg",footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="violationSave">保存记录</button>'});document.getElementById("violationSave").onclick=function(){var f=document.getElementById("pvFile").files[0],result=App.partner.addViolation({personId:document.getElementById("pvPerson").value,date:document.getElementById("pvDate").value,level:document.getElementById("pvLevel").value,location:document.getElementById("pvLocation").value.trim(),content:document.getElementById("pvContent").value.trim(),handling:document.getElementById("pvHandling").value.trim(),evidenceName:f?f.name:""});if(result.ok){m.close();render();}};}
function viewBlacklist(){var rows=peopleRows().filter(function(r){return blacklisted(r.person.id);});body.innerHTML=tabBar()+'<div class="alert error">黑名单为人员状态标记：当同一相关方人员累计违章达到 3 次时自动进入本列表。本期不限制其入场、作业或其他业务。</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>相关方人员</th><th>相关方公司</th><th>维护单位</th><th>岗位</th><th>累计违章</th><th>最近违章</th><th>标记状态</th><th>操作</th></tr></thead><tbody>'+rows.map(function(r){var vs=App.partner.violationsOf(r.person.id),last=vs.sort(function(a,b){return b.date.localeCompare(a.date);})[0];return '<tr><td><b>'+esc(r.person.name)+'</b><br><span class="muted">'+esc(r.person.phone||"-")+'</span></td><td>'+esc(r.partner.name)+'</td><td>'+esc(r.partner.maintainingOrg)+'</td><td>'+esc(r.person.job)+'</td><td><span class="tag tag-error">'+vs.length+' 次</span></td><td>'+esc(last?last.date:"-")+'</td><td>'+tag("黑名单","tag-error")+'</td><td><button class="btn btn-text" onclick="openPerson(\''+r.person.id+'\')">查看详情</button></td></tr>';}).join("")+'</tbody></table></div>'+(rows.length?"":UI.empty("当前范围暂无黑名单人员"));}
function openAttachment(name){UI.modal('<div class="alert info">原型演示附件：<b>'+esc(name)+'</b><br>真实系统将支持在此查看已上传的图片或 PDF 原文件。</div>',{title:"查看附件",footer:'<button class="btn btn-primary" data-close>关闭</button>'});}
function closeDrawerEditPartner(id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openPartnerForm(id);}
function closeDrawerAddPerson(id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openPersonForm(id);}
function closeDrawerEditPerson(pid,id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openPersonForm(pid,id);}
function closeDrawerAddCert(id){document.querySelectorAll(".mask,.drawer").forEach(function(x){x.remove();});openCertForm(id);}
window.goTab=goTab;window.renderLedgerRows=renderLedgerRows;window.openPartnerForm=openPartnerForm;window.openPartner=openPartner;window.renderPeopleRows=renderPeopleRows;window.choosePartnerForPerson=choosePartnerForPerson;window.openPersonForm=openPersonForm;window.openPerson=openPerson;window.openCertForm=openCertForm;window.renderViolationRows=renderViolationRows;window.openViolationForm=openViolationForm;window.openAttachment=openAttachment;window.closeDrawerEditPartner=closeDrawerEditPartner;window.closeDrawerAddPerson=closeDrawerAddPerson;window.closeDrawerEditPerson=closeDrawerEditPerson;window.closeDrawerAddCert=closeDrawerAddCert;
var retryKey="tz_anquan_parties_retry";
try{render();sessionStorage.removeItem(retryKey);}catch(error){
  try{
    if(!sessionStorage.getItem(retryKey)){
      sessionStorage.setItem(retryKey,"1");
      sessionStorage.removeItem(App._stateKey);
      location.reload();
    }else body.innerHTML='<div class="alert error">相关方页面初始化失败，请关闭当前页面后重新打开。</div>';
  }catch(ignore){body.innerHTML='<div class="alert error">相关方页面初始化失败，请关闭当前页面后重新打开。</div>';}
}
})();
</script>
</body>
