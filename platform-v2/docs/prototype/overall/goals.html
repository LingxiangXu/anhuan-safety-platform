<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>目标职责 · 安全管理平台</title>
<link rel="icon" href="assets/logo.svg">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="body">
    <aside class="sidebar"><div class="nav-tree"></div></aside>
    <div class="content"><div class="page-header"></div><div class="page-body" id="pageBody"></div></div>
  </div>
</div>
<script src="assets/store.js"></script>
<script src="assets/ui.js"></script>
<script>
(function(){
"use strict";
var params=new URLSearchParams(location.search),requested=params.get("tab")||"organizations";
var aliases={targets:"organizations",responsibilities:"duties"},tab=aliases[requested]||requested;
var allowed=["organizations","people","users","roles","scopes","duties"];
if(allowed.indexOf(tab)<0)tab="organizations";
var body=document.getElementById("pageBody"),selectedOrgId=params.get("org")||"zj",selectedPeopleOrg="zaoxing";
var TITLES={organizations:"组织机构维护",people:"组织人员维护",users:"用户信息维护",roles:"角色管理",scopes:"角色数据权限",duties:"岗位安全职责清单"};
var GROUPS={organizations:"机构和职责",people:"机构和职责",users:"机构和职责",roles:"机构和职责",scopes:"机构和职责",duties:"安全履职"};
var ALL_PERMISSIONS=["目录同步","用户启停","角色管理","数据权限","风险填报","风险审核","巡检计划维护","任务领取","现场执行","隐患受理","隐患复查","职责维护","监督检查登记","督办","驾驶舱查看","台账查看"];

function esc(v){return String(v==null?"":v).replace(/[&<>"']/g,function(c){return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c];});}
function canPermission(){return App.canPermissionAdmin();}
function canDuty(){return App.canMaintainDuties();}
function profile(id){return App.orgProfile(id)||{};}
function member(id){return App.directoryMemberById(id)||{};}
function role(key){return App.safetyRole.byKey(key)||{};}
function statusTag(s){return s==="启用"||s==="在职"||s==="正常"?'<span class="tag tag-green">'+esc(s)+'</span>':s==="停用"||s==="离职"?'<span class="tag tag-gray">'+esc(s)+'</span>':'<span class="tag tag-warn">'+esc(s)+'</span>';}
function sourceStrip(text){return '<div class="source-strip"><span><strong>数据边界：</strong>'+text+'</span><span class="tag tag-blue">来源：企业微信</span></div>';}
function orgOptions(value){return (App.organizationProfiles||[]).map(function(x){return '<option value="'+esc(x.id)+'" '+(x.id===value?'selected':'')+'>'+Array(x.depth+1).join('　')+esc(x.name)+'</option>';}).join('');}
function roleOptions(value){return (App.safetyRoles||[]).map(function(x){return '<option value="'+esc(x.key)+'" '+(x.key===value?'selected':'')+'>'+esc(x.name)+'</option>';}).join('');}
function accountOptions(value){return (App.platformUsers||[]).filter(function(x){return x.accountStatus==="启用";}).map(function(x){return '<option value="'+esc(x.personId)+'" '+(x.personId===value?'selected':'')+'>'+esc(x.name)+' · '+esc(profile(x.defaultOrgId).name)+'</option>';}).join('');}
function orgTree(selected,handler){return '<div class="directory-tree"><div class="directory-tree-title">企业微信组织</div>'+(App.organizationProfiles||[]).map(function(x){return '<button class="directory-node '+(x.id===selected?'active':'')+'" style="padding-left:'+(8+x.depth*14)+'px" onclick="'+handler+'(\''+x.id+'\')">'+esc(x.name)+'</button>';}).join('')+'</div>';}
function closeOverlays(){document.querySelectorAll(".modal,.mask,.drawer").forEach(function(n){n.remove();});}
function headerActions(){
  if(tab==="organizations")return '<button class="btn btn-outline" onclick="openSyncLog(\'组织\')">查看同步记录</button><button class="btn btn-primary" onclick="syncOrganizations()">同步组织</button>';
  if(tab==="people")return '<button class="btn btn-outline" onclick="openSyncLog(\'人员\')">查看同步记录</button><button class="btn btn-primary" onclick="syncPeople()">同步人员</button>';
  if(tab==="users"&&canPermission())return '<button class="btn btn-primary" onclick="openUserEnable()">+ 启用平台用户</button>';
  if(tab==="roles"&&canPermission())return '<button class="btn btn-primary" onclick="openRoleForm()">+ 新增角色</button>';
  if(tab==="scopes"&&canPermission())return '<button class="btn btn-outline" onclick="openScopeForm()">配置角色默认范围</button><button class="btn btn-primary" onclick="openScopeExceptionForm()">+ 新增例外授权</button>';
  if(tab==="duties"&&canDuty())return '<button class="btn btn-primary" onclick="openDutyForm()">+ 新增职责</button>';
  return '';
}
function render(){UI.renderShell("goals",tab);UI.pageHeader(["目标职责",GROUPS[tab],TITLES[tab]],TITLES[tab],headerActions());({organizations:viewOrganizations,people:viewPeople,users:viewUsers,roles:viewRoles,scopes:viewScopes,duties:viewDuties}[tab])();}

/* 组织机构 */
function viewOrganizations(){
  var enabled=(App.organizationProfiles||[]).filter(function(x){return x.safetyEnabled;}).length;
  body.innerHTML=sourceStrip('组织名称、层级、负责人和状态只读；平台只补充安全业务属性，不新增、删除或改名企业微信组织。')+
    '<div class="kpi-grid g3"><div class="kpi"><div class="k-label">同步组织</div><div class="k-num blue">'+App.organizationProfiles.length+'</div><div class="k-sub">企业微信目录节点</div></div><div class="kpi"><div class="k-label">纳入安全平台</div><div class="k-num green">'+enabled+'</div><div class="k-sub">平台补充属性</div></div><div class="kpi"><div class="k-label">最近同步</div><div class="k-num" style="font-size:18px">'+esc(App.organizationProfiles[0].syncAt.slice(5))+'</div><div class="k-sub">演示同步批次</div></div></div>'+
    '<div class="directory-layout" style="margin-top:16px">'+orgTree(selectedOrgId,'selectOrganization')+'<div class="card" id="orgDetail"></div></div>';
  showOrganization(selectedOrgId);
}
function selectOrganization(id){selectedOrgId=id;viewOrganizations();}
function showOrganization(id){
  var x=profile(id),parent=profile(x.parentId),el=document.getElementById('orgDetail');if(!el)return;
  el.innerHTML='<div class="section-head" style="margin-top:0"><h3>'+esc(x.name)+'</h3>'+(canPermission()?'<button class="btn btn-outline btn-sm" onclick="openOrgConfig(\''+x.id+'\')">配置平台属性</button>':'')+'</div><div class="alert info">带“企业微信只读”的字段不能在安全管理平台修改。</div><div class="desc desc-2"><div class="d-item"><span class="d-label">组织名称 · 企业微信只读</span><span class="d-value">'+esc(x.name)+'</span></div><div class="d-item"><span class="d-label">组织编码 · 企业微信只读</span><span class="d-value mono">'+esc(x.id)+'</span></div><div class="d-item"><span class="d-label">上级组织 · 企业微信只读</span><span class="d-value">'+esc(parent.name||'-')+'</span></div><div class="d-item"><span class="d-label">组织层级 · 企业微信只读</span><span class="d-value">'+esc(x.level)+'</span></div><div class="d-item"><span class="d-label">组织负责人 · 企业微信只读</span><span class="d-value">'+esc(x.leader)+'</span></div><div class="d-item"><span class="d-label">目录状态 · 企业微信只读</span><span class="d-value">'+statusTag(x.sourceStatus)+'</span></div><div class="d-item"><span class="d-label">平台组织类型</span><span class="d-value">'+esc(x.orgType)+'</span></div><div class="d-item"><span class="d-label">纳入安全平台</span><span class="d-value">'+(x.safetyEnabled?'<span class="tag tag-green">是</span>':'<span class="tag tag-gray">否</span>')+'</span></div><div class="d-item"><span class="d-label">安全管理部门</span><span class="d-value">'+(x.safetyOrg?'是':'否')+'</span></div><div class="d-item"><span class="d-label">最近同步时间</span><span class="d-value">'+esc(x.syncAt)+'</span></div></div>';
}
function openOrgConfig(id){
  if(!canPermission()){App.toast('只有平台管理员或岗位映射管理员可以配置组织平台属性','warn');return;}var x=profile(id);
  UI.modal('<div class="alert info">组织名称、层级和负责人仍以企业微信为准，本弹窗只维护安全平台补充属性。</div><div class="form-grid"><div class="form-item"><span class="form-label">组织名称</span><input class="readonly-value" value="'+esc(x.name)+'" disabled></div><div class="form-item"><span class="form-label">平台组织类型</span><select id="orgType"><option '+(x.orgType==='集团总部'?'selected':'')+'>集团总部</option><option '+(x.orgType==='股份公司'?'selected':'')+'>股份公司</option><option '+(x.orgType==='分公司'?'selected':'')+'>分公司</option><option '+(x.orgType==='中心'?'selected':'')+'>中心</option><option '+(x.orgType==='作业区'?'selected':'')+'>作业区</option><option '+(x.orgType==='班组'?'selected':'')+'>班组</option></select></div><div class="form-item"><span class="form-label">显示顺序</span><input id="orgOrder" type="number" min="1" value="'+esc(x.order)+'"></div><div class="form-item"><span class="form-label">安全业务属性</span><label><input id="orgEnabled" type="checkbox" '+(x.safetyEnabled?'checked':'')+'> 纳入安全平台</label><label><input id="orgSafety" type="checkbox" '+(x.safetyOrg?'checked':'')+'> 安全管理部门</label></div></div>',{title:'配置平台属性 · '+x.name,size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="orgConfigSave">保存</button>'});
  document.getElementById('orgConfigSave').onclick=function(){var result=App.organization.saveProfile(id,{orgType:document.getElementById('orgType').value,order:document.getElementById('orgOrder').value,safetyEnabled:document.getElementById('orgEnabled').checked,safetyOrg:document.getElementById('orgSafety').checked});if(result.ok){closeOverlays();viewOrganizations();}};
}
function syncOrganizations(){App.organization.sync('组织');viewOrganizations();}
function openSyncLog(kind){var logs=(App.logs||[]).filter(function(x){return x.module==='目标职责'&&x.text.indexOf(kind+'同步')>-1;});UI.drawer('<div class="alert info">原型用于演示同步结果。生产环境需展示新增、变更、停用和失败记录，并支持按批次追溯。</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>同步对象</th><th>同步结果</th><th>时间</th><th>执行人</th></tr></thead><tbody>'+(logs.length?logs.map(function(x){return '<tr><td>'+kind+'</td><td>'+esc(x.text)+'</td><td>'+esc(x.at)+'</td><td>'+esc(x.by)+'</td></tr>';}).join(''):'<tr><td>'+kind+'</td><td>初始目录载入成功</td><td>'+esc((kind==='人员'?App.directoryMembers[0]:App.organizationProfiles[0]).syncAt)+'</td><td>系统</td></tr>')+'</tbody></table></div>',{title:'企业微信'+kind+'同步记录',wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}

/* 组织人员 */
function viewPeople(){
  body.innerHTML=sourceStrip('姓名、所属组织、岗位、负责人关系和在职状态由企业微信同步，安全管理平台只查询，不手工修改。')+
    '<div class="directory-layout">'+orgTree(selectedPeopleOrg,'selectPeopleOrganization')+'<div><div class="filter-bar"><div class="f-item">在职状态 <select id="peopleStatus"><option value="">全部</option><option selected>在职</option><option>离职</option></select></div><div class="f-item">关键词 <input id="peopleKeyword" placeholder="姓名、岗位或企业微信ID"></div><button class="btn btn-outline btn-sm" onclick="renderPeopleRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>姓名</th><th>企业微信ID</th><th>所属组织</th><th>岗位</th><th>直属负责人</th><th>状态</th><th>同步时间</th><th>操作</th></tr></thead><tbody id="peopleRows"></tbody></table></div></div></div>';
  renderPeopleRows();
}
function selectPeopleOrganization(id){selectedPeopleOrg=id;viewPeople();}
function renderPeopleRows(){
  var base=profile(selectedPeopleOrg).path||'',status=document.getElementById('peopleStatus').value,key=document.getElementById('peopleKeyword').value.trim().toLowerCase();
  var rows=(App.directoryMembers||[]).filter(function(x){var orgPath=profile(x.orgId).path||'';return orgPath.indexOf(base)===0&&(!status||x.status===status)&&(!key||[x.name,x.post,x.weComId].join(' ').toLowerCase().indexOf(key)>-1);});
  document.getElementById('peopleRows').innerHTML=rows.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b></td><td class="mono">'+esc(x.weComId)+'</td><td>'+esc(x.org)+'</td><td>'+esc(x.post)+'</td><td>'+esc(x.leader)+'</td><td>'+statusTag(x.status)+'</td><td>'+esc(x.syncAt)+'</td><td><button class="btn btn-text" onclick="openPersonDetail(\''+x.id+'\')">查看</button></td></tr>';}).join('')||'<tr><td colspan="8">'+UI.empty('当前组织暂无人员')+'</td></tr>';
}
function openPersonDetail(id){var x=member(id),account=(App.platformUsers||[]).filter(function(a){return a.personId===id;})[0];UI.drawer('<div class="alert info">以下组织人员信息来自企业微信，在安全管理平台中只读。</div><div class="desc desc-2"><div class="d-item"><span class="d-label">姓名</span><span class="d-value">'+esc(x.name)+'</span></div><div class="d-item"><span class="d-label">企业微信ID</span><span class="d-value mono">'+esc(x.weComId)+'</span></div><div class="d-item"><span class="d-label">所属组织</span><span class="d-value">'+esc(x.org)+'</span></div><div class="d-item"><span class="d-label">岗位</span><span class="d-value">'+esc(x.post)+'</span></div><div class="d-item"><span class="d-label">直属负责人</span><span class="d-value">'+esc(x.leader)+'</span></div><div class="d-item"><span class="d-label">在职状态</span><span class="d-value">'+statusTag(x.status)+'</span></div><div class="d-item"><span class="d-label">平台账号</span><span class="d-value">'+(account?statusTag(account.accountStatus):'<span class="tag tag-gray">未启用</span>')+'</span></div><div class="d-item"><span class="d-label">最近同步</span><span class="d-value">'+esc(x.syncAt)+'</span></div></div>',{title:'组织人员详情 · '+x.name,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}
function syncPeople(){App.organization.sync('人员');viewPeople();}

/* 平台用户 */
function roleNames(keys){return (keys||[]).map(function(k){return role(k).name||k;}).join('、')||'未配置';}
function businessPostSummary(personId){var rows=(App.businessPostMapping.forPerson(personId)||[]).filter(function(x){return x.status==='启用';});return rows.map(function(x){return profile(x.orgId).name+' / '+x.businessPost;}).join('、')||'未配置';}
function businessPostOptions(value){return (App.businessPostOptions||[]).map(function(x){return '<option '+(x===value?'selected':'')+'>'+x+'</option>';}).join('');}
function viewUsers(){
  var rows=App.platformUsers||[],enabled=rows.filter(function(x){return x.accountStatus==='启用';}).length;
  body.innerHTML='<div class="alert info"><b>四类配置相互独立：</b>业务岗位映射决定“谁承担岗位”，用户角色映射决定“人员具有什么角色”，角色管理决定“角色可以操作什么”，角色默认范围及例外授权决定“可以查看哪些组织数据”。人员本体始终来自企业微信。</div><div class="kpi-grid g3"><div class="kpi"><div class="k-label">平台用户</div><div class="k-num blue">'+rows.length+'</div><div class="k-sub">已建立访问关系</div></div><div class="kpi"><div class="k-label">已启用</div><div class="k-num green">'+enabled+'</div><div class="k-sub">可从企业微信进入</div></div><div class="kpi"><div class="k-label">未配置业务岗位</div><div class="k-num warn">'+rows.filter(function(x){return businessPostSummary(x.personId)==='未配置';}).length+'</div><div class="k-sub">岗位职责无法自动承接</div></div></div><div class="filter-bar" style="margin-top:16px"><div class="f-item">账号状态 <select id="userStatus"><option value="">全部</option><option>启用</option><option>停用</option></select></div><div class="f-item">关键词 <input id="userKeyword" placeholder="姓名、组织、业务岗位或角色"></div><button class="btn btn-outline btn-sm" onclick="renderUserRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>姓名</th><th>企业微信身份</th><th>默认组织</th><th>安全业务岗位</th><th>安全业务角色</th><th>账号状态</th><th>最后登录</th><th>操作</th></tr></thead><tbody id="userRows"></tbody></table></div>';
  renderUserRows();
}
function renderUserRows(){var status=document.getElementById('userStatus').value,key=document.getElementById('userKeyword').value.trim().toLowerCase();var rows=(App.platformUsers||[]).filter(function(x){return (!status||x.accountStatus===status)&&(!key||[x.name,profile(x.defaultOrgId).name,businessPostSummary(x.personId),roleNames(x.roleKeys)].join(' ').toLowerCase().indexOf(key)>-1);});document.getElementById('userRows').innerHTML=rows.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b></td><td><span class="tag tag-blue">'+esc(x.boundStatus)+'</span></td><td>'+esc(profile(x.defaultOrgId).name)+'</td><td>'+esc(businessPostSummary(x.personId))+'</td><td>'+esc(roleNames(x.roleKeys))+'</td><td>'+statusTag(x.accountStatus)+'</td><td>'+esc(x.lastLogin)+'</td><td><button class="btn btn-text" onclick="openUserDetail(\''+x.id+'\')">查看</button>'+(canPermission()?'<button class="btn btn-text" onclick="openBusinessPostMapping(\''+x.id+'\')">配置业务岗位</button><button class="btn btn-text" onclick="openUserRoles(\''+x.id+'\')">配置角色</button><button class="btn btn-text" onclick="openUserDefaultOrg(\''+x.id+'\')">默认组织</button><button class="btn btn-text '+(x.accountStatus==='启用'?'danger':'')+'" onclick="toggleUser(\''+x.id+'\')">'+(x.accountStatus==='启用'?'停用':'启用')+'</button>':'')+'</td></tr>';}).join('')||'<tr><td colspan="8">'+UI.empty('暂无符合条件的平台用户')+'</td></tr>';}
function openUserEnable(){if(!canPermission()){App.toast('请切换到平台管理员或岗位映射管理员','warn');return;}var existing=(App.platformUsers||[]).map(function(x){return x.personId;}),available=(App.directoryMembers||[]).filter(function(x){return x.status==='在职'&&existing.indexOf(x.id)<0;});UI.modal('<div class="alert info">这里只启用已从企业微信同步的人员，不创建新的自然人或本地密码。</div><div class="form-grid"><div class="form-item"><span class="form-label">企业微信人员 <span class="req">*</span></span><select id="enablePerson" onchange="syncEnableOrg()">'+available.map(function(x){return '<option value="'+x.id+'">'+esc(x.name)+' · '+esc(x.org)+' · '+esc(x.post)+'</option>';}).join('')+'</select></div><div class="form-item"><span class="form-label">默认组织 <span class="req">*</span></span><select id="enableOrg">'+orgOptions(available[0]?available[0].orgId:'auto_line')+'</select></div></div>',{title:'启用平台用户',size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="enableUserSave" '+(available.length?'':'disabled')+'>确认启用</button>'});if(document.getElementById('enableUserSave'))document.getElementById('enableUserSave').onclick=function(){var result=App.platformUser.enable(document.getElementById('enablePerson').value,document.getElementById('enableOrg').value);if(result.ok){closeOverlays();viewUsers();}};}
function syncEnableOrg(){var p=member(document.getElementById('enablePerson').value);if(p)document.getElementById('enableOrg').value=p.orgId;}
function openUserDetail(id){var x=App.platformUser.byId(id),p=member(x.personId),scopes=(App.roleScopes||[]).filter(function(s){return (x.roleKeys||[]).indexOf(s.roleKey)>-1&&s.status==='启用';}),exceptions=(App.scopeExceptions||[]).filter(function(s){return s.personId===x.personId&&s.status==='启用';});UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">姓名</span><span class="d-value">'+esc(x.name)+'</span></div><div class="d-item"><span class="d-label">企业微信ID</span><span class="d-value mono">'+esc(p.weComId)+'</span></div><div class="d-item"><span class="d-label">企业微信组织/岗位</span><span class="d-value">'+esc(p.org)+' / '+esc(p.post)+'</span></div><div class="d-item"><span class="d-label">默认组织</span><span class="d-value">'+esc(profile(x.defaultOrgId).name)+'</span></div><div class="d-item"><span class="d-label">平台状态</span><span class="d-value">'+statusTag(x.accountStatus)+'</span></div><div class="d-item"><span class="d-label">最后登录</span><span class="d-value">'+esc(x.lastLogin)+'</span></div><div class="d-item full"><span class="d-label">安全业务岗位</span><span class="d-value">'+esc(businessPostSummary(x.personId))+'</span></div><div class="d-item full"><span class="d-label">安全业务角色</span><span class="d-value">'+esc(roleNames(x.roleKeys))+'</span></div><div class="d-item full"><span class="d-label">角色默认数据范围</span><span class="d-value">'+(scopes.length?scopes.map(function(s){return esc((role(s.roleKey).name||s.roleKey)+'：'+s.scopeType+'（'+s.resolveBy+'）');}).join('<br>'):'未配置')+'</span></div><div class="d-item full"><span class="d-label">例外授权</span><span class="d-value">'+(exceptions.length?exceptions.map(function(s){return esc((role(s.roleKey).name||s.roleKey)+'：'+profile(s.orgId).path);}).join('<br>'):'无')+'</span></div></div>',{title:'用户信息 · '+x.name,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}

function openBusinessPostMappingForm(userId,mapId){var x=App.platformUser.byId(userId),p=member(x.personId),m=mapId?App.businessPostMapping.byId(mapId):{};UI.modal('<div class="alert info">人员姓名、企业微信身份不可手工维护；本弹窗只配置该人员在安全业务中的岗位承接关系。</div><div class="form-grid"><div class="form-item"><span class="form-label">企业微信人员</span><input class="readonly-value" value="'+esc(p.name+' · '+p.weComId)+'" disabled></div><div class="form-item"><span class="form-label">企业微信原始岗位</span><input class="readonly-value" value="'+esc(p.post)+'" disabled></div><div class="form-item"><span class="form-label">责任组织 <span class="req">*</span></span><select id="mapOrg">'+orgOptions(m.orgId||p.orgId)+'</select></div><div class="form-item"><span class="form-label">安全业务岗位 <span class="req">*</span></span><select id="mapPost">'+businessPostOptions(m.businessPost||p.post)+'</select></div><div class="form-item"><span class="form-label">生效日期</span><input id="mapEffective" type="date" value="'+esc(m.effectiveDate||'2026-08-18')+'"></div><div class="form-item"><span class="form-label">失效日期</span><input id="mapExpiry" value="'+esc(m.expiry||'长期')+'" placeholder="长期或YYYY-MM-DD"></div></div>',{title:(mapId?'编辑':'配置')+'业务岗位 · '+x.name,size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="businessPostSave">保存</button>'});document.getElementById('businessPostSave').onclick=function(){var result=App.businessPostMapping.save({personId:x.personId,orgId:document.getElementById('mapOrg').value,businessPost:document.getElementById('mapPost').value,effectiveDate:document.getElementById('mapEffective').value,expiry:document.getElementById('mapExpiry').value},mapId);if(result.ok)openBusinessPostMapping(userId);};}

/* 角色管理 */
function roleMemberCount(key){return (App.platformUsers||[]).filter(function(x){return (x.roleKeys||[]).indexOf(key)>-1;}).length;}

function viewRoles(){body.innerHTML='<div class="alert info">角色管理决定“可以做什么”；数据范围在“角色数据权限”中单独配置。平台管理员和岗位映射管理员不因系统权限获得业务审批权。</div><div class="filter-bar"><div class="f-item">角色类型 <select id="roleType"><option value="">全部</option><option>系统管理</option><option>业务角色</option><option>流程岗位</option><option>查看角色</option></select></div><div class="f-item">关键词 <input id="roleKeyword" placeholder="角色名称或权限"></div><button class="btn btn-outline btn-sm" onclick="renderRoleRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>角色名称</th><th>类型</th><th>适用层级</th><th>功能权限</th><th>已关联用户</th><th>状态</th><th>操作</th></tr></thead><tbody id="roleRows"></tbody></table></div>';renderRoleRows();}
function renderRoleRows(){var type=document.getElementById('roleType').value,key=document.getElementById('roleKeyword').value.trim().toLowerCase();var rows=(App.safetyRoles||[]).filter(function(x){return (!type||x.type===type)&&(!key||[x.name,(x.permissions||[]).join(' ')].join(' ').toLowerCase().indexOf(key)>-1);});document.getElementById('roleRows').innerHTML=rows.map(function(x){return '<tr><td><b>'+esc(x.name)+'</b><br><span class="muted mono">'+esc(x.key)+'</span></td><td>'+esc(x.type)+'</td><td>'+esc(x.level)+'</td><td>'+permissionsHtml(x.permissions)+'</td><td>'+roleMemberCount(x.key)+'</td><td>'+statusTag(x.status)+'</td><td><button class="btn btn-text" onclick="openRoleDetail(\''+x.key+'\')">查看</button>'+(canPermission()?'<button class="btn btn-text" onclick="openRoleForm(\''+x.key+'\')">编辑</button><button class="btn btn-text" onclick="openRoleForm(\''+x.key+'\',true)">复制</button><button class="btn btn-text '+(x.status==='启用'?'danger':'')+'" onclick="toggleRole(\''+x.key+'\')">'+(x.status==='启用'?'停用':'启用')+'</button>':'')+'</td></tr>';}).join('');}
function openRoleForm(key,copy){if(!canPermission()){App.toast('请切换到平台管理员或岗位映射管理员','warn');return;}var src=key?role(key):{},x=copy?Object.assign({},src,{name:src.name+'（副本）'}):src,editKey=copy?null:key;UI.modal('<div class="form-grid"><div class="form-item"><span class="form-label">角色名称 <span class="req">*</span></span><input id="roleNameInput" value="'+esc(x.name||'')+'"></div><div class="form-item"><span class="form-label">角色类型 <span class="req">*</span></span><select id="roleTypeInput"><option '+(x.type==='系统管理'?'selected':'')+'>系统管理</option><option '+(x.type==='业务角色'?'selected':'')+'>业务角色</option><option '+(x.type==='流程岗位'?'selected':'')+'>流程岗位</option><option '+(x.type==='查看角色'?'selected':'')+'>查看角色</option></select></div><div class="form-item"><span class="form-label">适用组织层级 <span class="req">*</span></span><select id="roleLevelInput"><option '+(x.level==='集团'?'selected':'')+'>集团</option><option '+(x.level==='二级单位'?'selected':'')+'>二级单位</option><option '+(x.level==='作业区'?'selected':'')+'>作业区</option><option '+(x.level==='班组'?'selected':'')+'>班组</option><option '+(x.level==='授权组织'?'selected':'')+'>授权组织</option><option '+(x.level==='同专业部门'?'selected':'')+'>同专业部门</option></select></div><div class="form-item full"><span class="form-label">功能权限 <span class="req">*</span></span><div class="check-grid">'+ALL_PERMISSIONS.map(function(p){return '<label><input class="rolePermission" type="checkbox" value="'+esc(p)+'" '+((x.permissions||[]).indexOf(p)>-1?'checked':'')+'> '+esc(p)+'</label>';}).join('')+'</div></div></div>',{title:(copy?'复制':'')+(editKey?'编辑':'新增')+'角色',size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="roleSave">保存</button>'});document.getElementById('roleSave').onclick=function(){var result=App.safetyRole.save({name:document.getElementById('roleNameInput').value,type:document.getElementById('roleTypeInput').value,level:document.getElementById('roleLevelInput').value,permissions:[].slice.call(document.querySelectorAll('.rolePermission:checked')).map(function(n){return n.value;})},editKey);if(result.ok){closeOverlays();viewRoles();}};}

function toggleRole(key){var x=role(key),next=x.status==='启用'?'停用':'启用';UI.modal('<div class="alert '+(next==='停用'?'warn':'info')+'">确认'+next+'角色“'+esc(x.name)+'”？已有历史业务记录不受影响。</div>',{title:next+'角色',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn '+(next==='停用'?'btn-danger':'btn-primary')+'" id="roleToggleSave">确认'+next+'</button>'});document.getElementById('roleToggleSave').onclick=function(){var result=App.safetyRole.toggle(key);if(result.ok){closeOverlays();viewRoles();}};}

function viewScopes(){body.innerHTML='<div class="alert info">角色默认范围按角色统一配置，不绑定具体人员；人员获得角色后自动继承默认范围。确需跨组织查看时，再为企业微信人员增加有期限、有原因的例外授权。流程办理仍校验业务岗位，平台管理员不得代办。</div><div class="filter-bar"><div class="f-item">角色 <select id="scopeRoleFilter"><option value="">全部</option>'+roleOptions('')+'</select></div><div class="f-item">关键词 <input id="scopeKeyword" placeholder="角色、范围或解析依据"></div><button class="btn btn-outline btn-sm" onclick="renderScopeRows()">查询</button></div><div class="section-head"><h3>角色默认数据范围</h3></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>安全业务角色</th><th>默认范围类型</th><th>范围解析依据</th><th>状态</th><th>操作</th></tr></thead><tbody id="scopeRows"></tbody></table></div><div class="section-head"><h3>人员例外授权</h3><span class="muted">仅用于明确的跨组织额外授权</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>企业微信人员</th><th>角色</th><th>额外授权组织</th><th>原因</th><th>有效期</th><th>状态</th><th>操作</th></tr></thead><tbody id="scopeExceptionRows"></tbody></table></div>';renderScopeRows();}
function renderScopeRows(){var roleKey=document.getElementById('scopeRoleFilter').value,key=document.getElementById('scopeKeyword').value.trim().toLowerCase();var rows=(App.roleScopes||[]).filter(function(x){return (!roleKey||x.roleKey===roleKey)&&(!key||[role(x.roleKey).name,x.scopeType,x.resolveBy].join(' ').toLowerCase().indexOf(key)>-1);});document.getElementById('scopeRows').innerHTML=rows.map(function(x){return '<tr><td><b>'+esc(role(x.roleKey).name||x.roleKey)+'</b></td><td>'+esc(x.scopeType)+'</td><td>'+esc(x.resolveBy)+'</td><td>'+statusTag(x.status)+'</td><td><button class="btn btn-text" onclick="previewScope(\''+x.id+'\')">规则说明</button>'+(canPermission()?'<button class="btn btn-text" onclick="openScopeForm(\''+x.id+'\')">编辑</button><button class="btn btn-text '+(x.status==='启用'?'danger':'')+'" onclick="toggleScope(\''+x.id+'\')">'+(x.status==='启用'?'停用':'启用')+'</button>':'')+'</td></tr>';}).join('')||'<tr><td colspan="5">'+UI.empty('暂无符合条件的角色默认范围')+'</td></tr>';var exceptions=(App.scopeExceptions||[]).filter(function(x){return (!roleKey||x.roleKey===roleKey)&&(!key||[member(x.personId).name,role(x.roleKey).name,profile(x.orgId).path,x.reason].join(' ').toLowerCase().indexOf(key)>-1);});document.getElementById('scopeExceptionRows').innerHTML=exceptions.map(function(x){return '<tr><td><b>'+esc(member(x.personId).name)+'</b><br><span class="muted mono">'+esc(member(x.personId).weComId)+'</span></td><td>'+esc(role(x.roleKey).name||x.roleKey)+'</td><td>'+esc(profile(x.orgId).path)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.effectiveDate)+' 至 '+esc(x.expiry)+'</td><td>'+statusTag(x.status)+'</td><td>'+(canPermission()?'<button class="btn btn-text" onclick="openScopeExceptionForm(\''+x.id+'\')">编辑</button><button class="btn btn-text '+(x.status==='启用'?'danger':'')+'" onclick="toggleScopeException(\''+x.id+'\')">'+(x.status==='启用'?'停用':'启用')+'</button>':'查看')+'</td></tr>';}).join('')||'<tr><td colspan="7">'+UI.empty('当前没有人员例外授权')+'</td></tr>';}
function openScopeForm(id){if(!canPermission()){App.toast('请切换到平台管理员或岗位映射管理员','warn');return;}var x=id?App.roleScope.byId(id):{};UI.modal('<div class="alert info">默认范围是角色规则，不选择人员。人员通过“用户信息维护”获得角色后自动继承。</div><div class="form-grid"><div class="form-item"><span class="form-label">安全业务角色 <span class="req">*</span></span><select id="scopeRole">'+roleOptions(x.roleKey||'company_safety')+'</select></div><div class="form-item"><span class="form-label">默认数据范围 <span class="req">*</span></span><select id="scopeType"><option '+(x.scopeType==='全平台技术范围'?'selected':'')+'>全平台技术范围</option><option '+(x.scopeType==='集团及授权组织'?'selected':'')+'>集团及授权组织</option><option '+(x.scopeType==='同专业部门'?'selected':'')+'>同专业部门</option><option '+(x.scopeType==='本二级单位'?'selected':'')+'>本二级单位</option><option '+(x.scopeType==='本作业区'?'selected':'')+'>本作业区</option><option '+(x.scopeType==='本班组'?'selected':'')+'>本班组</option><option '+(x.scopeType==='本人及本班组任务'?'selected':'')+'>本人及本班组任务</option><option '+(x.scopeType==='授权组织'?'selected':'')+'>授权组织</option></select></div><div class="form-item full"><span class="form-label">范围解析依据 <span class="req">*</span></span><input id="scopeResolveBy" value="'+esc(x.resolveBy||'按业务岗位责任组织')+'" placeholder="例如：按企业微信所属专业部门"></div></div>',{title:id?'编辑角色默认数据范围':'配置角色默认数据范围',size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="scopeSave">保存</button>'});document.getElementById('scopeSave').onclick=function(){var result=App.roleScope.save({roleKey:document.getElementById('scopeRole').value,scopeType:document.getElementById('scopeType').value,resolveBy:document.getElementById('scopeResolveBy').value},id);if(result.ok){closeOverlays();viewScopes();}};}
function previewScope(id){var x=App.roleScope.byId(id),r=role(x.roleKey),users=(App.platformUsers||[]).filter(function(u){return (u.roleKeys||[]).indexOf(x.roleKey)>-1;});UI.drawer('<div class="alert info">这是角色默认范围，不是人员清单。拥有该角色的人员按企业微信组织身份、业务岗位和下述解析依据得到可见数据。</div><div class="desc desc-2"><div class="d-item"><span class="d-label">角色</span><span class="d-value">'+esc(r.name)+'</span></div><div class="d-item"><span class="d-label">默认范围</span><span class="d-value">'+esc(x.scopeType)+'</span></div><div class="d-item full"><span class="d-label">解析依据</span><span class="d-value">'+esc(x.resolveBy)+'</span></div><div class="d-item full"><span class="d-label">当前关联用户</span><span class="d-value">'+esc(users.map(function(u){return u.name;}).join('、')||'暂无')+'</span></div><div class="d-item full"><span class="d-label">限制</span><span class="d-value">角色默认范围不授予跨组织例外权限；审批、整改、复查仍校验业务岗位。</span></div></div>',{title:'角色默认范围说明 · '+r.name,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}
function toggleScope(id){var result=App.roleScope.toggle(id);if(result.ok)viewScopes();}
function openScopeExceptionForm(id){if(!canPermission()){App.toast('请切换到平台管理员或岗位映射管理员','warn');return;}var x=id?App.scopeException.byId(id):{};UI.modal('<div class="alert warn">例外授权只用于明确的跨组织额外查看范围，必须记录人员、角色、授权组织、原因和有效期。所选人员必须已配置该角色。</div><div class="form-grid"><div class="form-item"><span class="form-label">企业微信人员 <span class="req">*</span></span><select id="exceptionPerson">'+accountOptions(x.personId||'P-001')+'</select></div><div class="form-item"><span class="form-label">安全业务角色 <span class="req">*</span></span><select id="exceptionRole">'+roleOptions(x.roleKey||'team_leader')+'</select></div><div class="form-item full"><span class="form-label">额外授权组织 <span class="req">*</span></span><select id="exceptionOrg">'+orgOptions(x.orgId||'jgps')+'</select></div><div class="form-item full"><span class="form-label">授权原因 <span class="req">*</span></span><textarea id="exceptionReason" placeholder="说明跨组织授权的业务原因">'+esc(x.reason||'')+'</textarea></div><div class="form-item"><span class="form-label">生效日期</span><input id="exceptionEffective" type="date" value="'+esc(x.effectiveDate||'2026-08-19')+'"></div><div class="form-item"><span class="form-label">失效日期</span><input id="exceptionExpiry" value="'+esc(x.expiry||'2026-12-31')+'" placeholder="YYYY-MM-DD或长期"></div></div>',{title:id?'编辑人员例外授权':'新增人员例外授权',size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="exceptionSave">保存</button>'});document.getElementById('exceptionSave').onclick=function(){var result=App.scopeException.save({personId:document.getElementById('exceptionPerson').value,roleKey:document.getElementById('exceptionRole').value,orgId:document.getElementById('exceptionOrg').value,reason:document.getElementById('exceptionReason').value,effectiveDate:document.getElementById('exceptionEffective').value,expiry:document.getElementById('exceptionExpiry').value},id);if(result.ok){closeOverlays();viewScopes();}};}
function toggleScopeException(id){var result=App.scopeException.toggle(id);if(result.ok)viewScopes();}

/* 岗位安全职责 */
function dutyStatus(s){return s==='启用'?'<span class="tag tag-green">启用</span>':'<span class="tag tag-gray">停用</span>';}
function viewDuties(){App.refreshResponsibilityHolders();var rows=App.responsibilityItems||[];body.innerHTML='<div class="alert info">职责按“责任组织＋安全业务岗位”建立，不直接选择人员。当前承接人员来自“用户信息维护”的业务岗位映射，人员本体和在职状态来自企业微信。</div><div class="kpi-grid g3"><div class="kpi"><div class="k-label">职责清单</div><div class="k-num blue">'+rows.length+'</div><div class="k-sub">按组织岗位建立</div></div><div class="kpi"><div class="k-label">当前生效</div><div class="k-num green">'+rows.filter(function(x){return x.status==='启用';}).length+'</div><div class="k-sub">在线可查询</div></div><div class="kpi"><div class="k-label">未匹配承接人员</div><div class="k-num warn">'+rows.filter(function(x){return x.holderMatchStatus!=='已匹配';}).length+'</div><div class="k-sub">需配置业务岗位映射</div></div></div><div class="filter-bar" style="margin-top:16px"><div class="f-item">状态 <select id="dutyStatus"><option value="">全部</option><option>启用</option><option>停用</option></select></div><div class="f-item">关键词 <input id="dutyKeyword" placeholder="组织、岗位、人员或职责内容"></div><button class="btn btn-outline btn-sm" onclick="renderDutyRows()">查询</button></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>职责编号/版本</th><th>责任组织</th><th>责任岗位</th><th>当前承接人员/匹配状态</th><th>职责类别/内容</th><th>生效日期</th><th>状态</th><th>操作</th></tr></thead><tbody id="dutyRows"></tbody></table></div>';renderDutyRows();}
function renderDutyRows(){App.refreshResponsibilityHolders();var status=document.getElementById('dutyStatus').value,key=document.getElementById('dutyKeyword').value.trim().toLowerCase();var rows=(App.responsibilityItems||[]).filter(function(x){return (!status||x.status===status)&&(!key||[x.code,x.org,x.post,x.responsibleUser,x.content].join(' ').toLowerCase().indexOf(key)>-1);});document.getElementById('dutyRows').innerHTML=rows.map(function(x){var matched=x.holderMatchStatus==='已匹配';return '<tr><td class="mono">'+esc(x.code)+'<br><span class="tag tag-blue">'+esc(x.version)+'</span></td><td>'+esc(x.org)+'</td><td><b>'+esc(x.post)+'</b></td><td>'+esc(x.responsibleUser)+'<br><span class="tag '+(matched?'tag-green':'tag-warn')+'">'+esc(x.holderMatchStatus)+'</span></td><td><b>'+esc(x.category)+'</b><br><span class="muted">'+esc(x.content)+'</span></td><td>'+esc(x.effectiveDate)+'</td><td>'+dutyStatus(x.status)+'</td><td><button class="btn btn-text" onclick="openDutyDetail(\''+x.id+'\')">查看</button><button class="btn btn-text" onclick="openDutyBindings(\''+x.id+'\')">查看人员绑定</button><button class="btn btn-text" onclick="openDutyHistory(\''+x.id+'\')">历史版本</button>'+(canDuty()?'<button class="btn btn-text" onclick="openDutyForm(\''+x.id+'\')">编辑</button><button class="btn btn-text '+(x.status==='启用'?'danger':'')+'" onclick="toggleDuty(\''+x.id+'\')">'+(x.status==='启用'?'停用':'启用')+'</button>':'')+'</td></tr>';}).join('')||'<tr><td colspan="8">'+UI.empty('暂无符合条件的岗位职责')+'</td></tr>';}
function dutyPostOptions(value){return ['二级单位领导','二级单位安全管理人员','作业区负责人','班组长','兼职安全员','岗位人员','分公司负责人','总经理','公司领导'].map(function(x){return '<option '+(x===value?'selected':'')+'>'+x+'</option>';}).join('');}
function openDutyForm(id){if(!canDuty()){App.toast('只有二级单位安全管理人员可以维护岗位安全职责','warn');return;}var x=id?App.responsibility.byId(id):{};UI.modal('<div class="alert info">职责绑定责任组织和安全业务岗位，不直接选择人员；当前承接人员通过业务岗位映射只读带出。</div><div class="form-grid"><div class="form-item"><span class="form-label">责任组织 <span class="req">*</span></span><select id="dtOrg" onchange="syncDutyHolders()">'+orgOptions(x.orgId||'auto_line')+'</select></div><div class="form-item"><span class="form-label">责任岗位 <span class="req">*</span></span><select id="dtPost" onchange="syncDutyHolders()">'+dutyPostOptions(x.post||'班组长')+'</select></div><div class="form-item"><span class="form-label">当前承接人员</span><input id="dtHolders" class="readonly-value" disabled><span class="field-hint">来源：用户信息维护中的业务岗位映射；人员本体来自企业微信。</span></div><div class="form-item"><span class="form-label">职责类别 <span class="req">*</span></span><select id="dtCategory"><option '+(x.category==='安全管理'?'selected':'')+'>安全管理</option><option '+(x.category==='属地管理'?'selected':'')+'>属地管理</option><option '+(x.category==='班组管理'?'selected':'')+'>班组管理</option><option '+(x.category==='岗位操作'?'selected':'')+'>岗位操作</option></select></div><div class="form-item"><span class="form-label">生效日期 <span class="req">*</span></span><input id="dtEffective" type="date" value="'+esc(x.effectiveDate||'2026-08-18')+'"></div><div class="form-item"><span class="form-label">当前版本</span><input class="readonly-value" value="'+esc(x.version||'V1.0（新建）')+'" disabled></div><div class="form-item full"><span class="form-label">制度或法规依据 <span class="req">*</span></span><input id="dtBasis" value="'+esc(x.basis||'')+'" placeholder="例如：班组安全生产责任制"></div><div class="form-item full"><span class="form-label">岗位安全职责 <span class="req">*</span></span><textarea id="dtContent" placeholder="说明该组织下该岗位应履行的安全职责">'+esc(x.content||'')+'</textarea></div></div>',{title:id?'编辑岗位安全职责':'新增岗位安全职责',size:'lg',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn btn-primary" id="dutySave">保存'+(id?'并生成新版本':'')+'</button>'});syncDutyHolders();document.getElementById('dutySave').onclick=function(){var result=App.responsibility.save({orgId:document.getElementById('dtOrg').value,post:document.getElementById('dtPost').value,category:document.getElementById('dtCategory').value,effectiveDate:document.getElementById('dtEffective').value,basis:document.getElementById('dtBasis').value,content:document.getElementById('dtContent').value},id);if(result.ok){closeOverlays();viewDuties();}};}
function syncDutyHolders(){var org=document.getElementById('dtOrg'),post=document.getElementById('dtPost'),holders=document.getElementById('dtHolders');if(org&&post&&holders)holders.value=App.directoryHoldersFor(org.value,post.value).join('、')||'未匹配，请到用户信息维护配置业务岗位';}
function openDutyBindings(id){var x=App.responsibility.byId(id),rows=App.businessPostMapping.forDuty(x.orgId,x.post),active=rows.filter(function(m){return m.status==='启用';}),holders=App.directoryHoldersFor(x.orgId,x.post);var content='<div class="alert '+(holders.length?'info':'warn')+'">'+(holders.length?'已通过业务岗位映射找到当前承接人员：'+esc(holders.join('、')):'当前未找到有效承接人员。请在“用户信息维护”中为企业微信人员配置对应业务岗位。')+'</div><div class="desc desc-2"><div class="d-item"><span class="d-label">责任组织</span><span class="d-value">'+esc(x.org)+'</span></div><div class="d-item"><span class="d-label">安全业务岗位</span><span class="d-value">'+esc(x.post)+'</span></div><div class="d-item"><span class="d-label">匹配状态</span><span class="d-value">'+(holders.length?'<span class="tag tag-green">已匹配</span>':'<span class="tag tag-warn">未匹配</span>')+'</span></div><div class="d-item"><span class="d-label">有效映射数</span><span class="d-value">'+active.length+'</span></div></div>'+(rows.length?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>企业微信人员</th><th>企业微信原始岗位</th><th>有效期</th><th>状态</th></tr></thead><tbody>'+rows.map(function(m){var p=member(m.personId);return '<tr><td><b>'+esc(p.name||m.personId)+'</b></td><td>'+esc(p.post||'-')+'</td><td>'+esc(m.effectiveDate)+' 至 '+esc(m.expiry)+'</td><td>'+statusTag(m.status)+'</td></tr>';}).join('')+'</tbody></table></div>':UI.empty('没有找到对应业务岗位映射'));UI.drawer(content,{title:'人员绑定 · '+x.code,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'+(!holders.length?'<button class="btn btn-primary" onclick="goToUserMappings()">前往用户信息维护</button>':'')});}
function goToUserMappings(){location.href='goals.html?tab=users';}
function toggleDuty(id){var x=App.responsibility.byId(id),next=x.status==='启用'?'停用':'启用';UI.modal('<div class="alert '+(next==='停用'?'warn':'info')+'">确认'+next+'“'+esc(x.org)+' / '+esc(x.post)+'”职责？'+(next==='停用'?'停用后不再作为当前有效职责展示。':'')+'</div>',{title:next+'岗位职责',footer:'<button class="btn btn-outline" data-close>取消</button><button class="btn '+(next==='停用'?'btn-danger':'btn-primary')+'" id="toggleDutySubmit">确认'+next+'</button>'});document.getElementById('toggleDutySubmit').onclick=function(){var result=App.responsibility.toggle(id);if(result.ok){closeOverlays();viewDuties();}};}
function openDutyDetail(id){var x=App.responsibility.byId(id);App.refreshResponsibilityHolders();UI.drawer('<div class="desc desc-2"><div class="d-item"><span class="d-label">职责编号/版本</span><span class="d-value mono">'+esc(x.code)+' · '+esc(x.version)+'</span></div><div class="d-item"><span class="d-label">状态</span><span class="d-value">'+dutyStatus(x.status)+'</span></div><div class="d-item"><span class="d-label">责任组织</span><span class="d-value">'+esc(x.org)+'</span></div><div class="d-item"><span class="d-label">责任岗位</span><span class="d-value">'+esc(x.post)+'</span></div><div class="d-item"><span class="d-label">当前承接人员</span><span class="d-value">'+esc(x.responsibleUser)+'</span></div><div class="d-item"><span class="d-label">人员匹配状态</span><span class="d-value">'+esc(x.holderMatchStatus)+'</span></div><div class="d-item"><span class="d-label">职责类别</span><span class="d-value">'+esc(x.category)+'</span></div><div class="d-item"><span class="d-label">生效日期</span><span class="d-value">'+esc(x.effectiveDate)+'</span></div><div class="d-item"><span class="d-label">更新时间</span><span class="d-value">'+esc(x.updatedAt)+'</span></div><div class="d-item full"><span class="d-label">依据</span><span class="d-value">'+esc(x.basis)+'</span></div><div class="d-item full"><span class="d-label">岗位安全职责</span><span class="d-value">'+esc(x.content)+'</span></div></div>',{title:'岗位职责详情 · '+x.code,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}
function openDutyHistory(id){var x=App.responsibility.byId(id),rows=[{version:x.version,content:x.content,basis:x.basis,effectiveDate:x.effectiveDate,current:true}].concat(x.history||[]);UI.drawer('<div class="alert info">岗位职责每次编辑均生成新版本；历史版本只用于追溯，当前在线查询读取生效版本。</div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>版本</th><th>职责内容</th><th>依据</th><th>生效日期</th><th>状态</th></tr></thead><tbody>'+rows.map(function(v){return '<tr><td class="mono">'+esc(v.version)+'</td><td>'+esc(v.content)+'</td><td>'+esc(v.basis)+'</td><td>'+esc(v.effectiveDate)+'</td><td>'+(v.current?'<span class="tag tag-green">当前</span>':'<span class="tag tag-gray">历史</span>')+'</td></tr>';}).join('')+'</tbody></table></div>',{title:'岗位职责历史版本 · '+x.code,wide:true,footer:'<button class="btn btn-outline" data-close>关闭</button>'});}

window.selectOrganization=selectOrganization;window.openOrgConfig=openOrgConfig;window.syncOrganizations=syncOrganizations;window.openSyncLog=openSyncLog;
window.selectPeopleOrganization=selectPeopleOrganization;window.renderPeopleRows=renderPeopleRows;window.openPersonDetail=openPersonDetail;window.syncPeople=syncPeople;
window.renderUserRows=renderUserRows;window.openUserEnable=openUserEnable;window.syncEnableOrg=syncEnableOrg;window.openUserDetail=openUserDetail;window.openUserRoles=openUserRoles;window.openBusinessPostMapping=openBusinessPostMapping;window.openBusinessPostMappingForm=openBusinessPostMappingForm;window.toggleBusinessPostMapping=toggleBusinessPostMapping;window.openUserDefaultOrg=openUserDefaultOrg;window.toggleUser=toggleUser;
window.renderRoleRows=renderRoleRows;window.openRoleForm=openRoleForm;window.openRoleDetail=openRoleDetail;window.toggleRole=toggleRole;
window.renderScopeRows=renderScopeRows;window.openScopeForm=openScopeForm;window.previewScope=previewScope;window.toggleScope=toggleScope;window.openScopeExceptionForm=openScopeExceptionForm;window.toggleScopeException=toggleScopeException;
window.renderDutyRows=renderDutyRows;window.openDutyForm=openDutyForm;window.syncDutyHolders=syncDutyHolders;window.openDutyBindings=openDutyBindings;window.goToUserMappings=goToUserMappings;window.toggleDuty=toggleDuty;window.openDutyDetail=openDutyDetail;window.openDutyHistory=openDutyHistory;
render();
})();
